<body>
<div class="wrap">
  <div id="toast"></div>
  <div id="vList">
    <div class="top">
      <div class="brand">追迹<small>ANITRACKER</small></div>

  </div>
  <div id="vDetail" style="display:none">

      <button onclick="doBgmSearch()">搜索</button>
    </div>

    <div class="histrow" id="bgmHist"></div>
    <div id="srList"></div>

  </div>
</div>

<script>
'use strict';
var LS={shows:'tr_shows',cfg:'tr_dav',meta:'tr_meta'};
function rd(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } }
var _quotaWarned=0;
function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){
  if(e&&(e.name==='QuotaExceededError'||e.code===22)&&Date.now()-_quotaWarned>300000){
    _quotaWarned=Date.now();
    try{ toast('存储空间已满——本地约 250 部封顶，请导出备份（⇅里）并移除部分番剧'); }catch(e2){}
  }
} }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2200); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeSid(s){ return String(s==null?'':s).replace(/[^a-zA-Z0-9_\-@]/g,'_'); }

var ST_NAME={watching:'在看',want:'想看',done:'看完',drop:'弃'};
var TYPE_NAME={canon:'漫改',semi:'半原创',filler:'TV原创',movie:'剧场版'};
var STYPE_NAME={'manga-adapt':'漫改','tv-original':'TV原创','semi-original':'半原创','unknown':'未分类'};
var VALID_TYPES={'manga-adapt':1,'tv-original':1,'semi-original':1,'unknown':1};
/* 删减信息预定义 */
var CENSOR_INFO={'one piece':{'censored':true,'note':'部分内容被删减/修改','platforms':['爱奇艺','腾讯','B站']},'naruto':{'censored':true,'note':'部分内容被删减','platforms':['爱奇艺','腾讯']},'bleach':{'censored':true,'note':'部分内容被删减','platforms':['腾讯']}};
function sTypeOf(s){ var t=s.type; return VALID_TYPES[t] ? t : (fgType(s.title)||'unknown'); }
var showTypeF='all';
function setShowType(t){ showTypeF=t; renderFilter(); renderList(); }
function jumpShowType(t){ showTypeF=t; backList(); }
function stypePill(s){ var t=sTypeOf(s); var w=STYPE_NAME[t]; return w?'<span class="type-tag '+t+'" onclick="event.stopPropagation();setShowType(\''+t+'\')">'+w+'</span>':''; }
var ST_EP={'null':'未看',watched:'已看',rewatch:'🔁回看'};
var NEXT_EP={null:'watched',watched:'rewatch',rewatch:null};
var FIL=['all','watching','want','done','drop'];

/* ---- 数据装载与迁移（watched 数组 → statuses 对象） ---- */
var shows=rd(LS.shows,[]);
(function migrate(){
  var changed=false;
  shows.forEach(function(s){
    if(Array.isArray(s.watched)&&!s.statuses){
      s.statuses={}; s.watched.forEach(function(n){ s.statuses[n]='watched'; });
      delete s.watched; changed=true;
    }
    (s.eps||[]).forEach(function(e){ if(e.type===undefined) e.type='canon'; });
  });
  if(changed) wr(LS.shows,shows);
})();


var curFilter='all', curSid=null, dType='all', dQ='';
/* 一次性清理：移除早期预置的演示海贼王条目 */
(function(){
  var cleaned=false;
  shows=shows.filter(function(s){ if(String(s.sid)==='op-onepiece'&&!s.source){ cleaned=true; return false; } return true; });
  if(cleaned){ wr(LS.shows,shows); wr('tr_seeded','1'); }
})();

function save(){ wr(LS.shows,shows); }
function bySid(sid){ return shows.find(function(s){ return String(s.sid)===String(sid); }); }
function epStat(s,n){ var v=(s.statuses||{})[n]; return v===undefined?null:v; }
function pushHist(s,act,ep){
  if(!s.hist) s.hist=[];
  var last=s.hist[s.hist.length-1];
  if(last&&last.ep===ep&&last.act===act&&Date.now()-last.t<5000) return; /* 5秒内重复动作去抖 */
  s.hist.push({t:Date.now(),act:act,ep:ep});
  if(s.hist.length>200) s.hist=s.hist.slice(-200);
}
function setEpStat(s,n,st){
  var cur=epStat(s,n);
  if(st===null) delete s.statuses[n]; else s.statuses[n]=st;
  if(cur!==st) pushHist(s, st===null?'unwatch':st, n);
  s.updAt=Date.now();
}
function fmtTs(t){
  var d=new Date(t), p2=function(x){ return x<10?'0'+x:x; };
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p2(d.getHours())+':'+p2(d.getMinutes());
}
function cntWatched(s){ var n=0; for(var k in s.statuses){ if(s.statuses[k]==='watched') n++; } return n; }
function cntRewatch(s){ var n=0; for(var k in s.statuses){ if(s.statuses[k]==='rewatch') n++; } return n; }
function pct(s){ return s.total? Math.min(100,Math.round((cntWatched(s)/s.total)*100)) : 0; }

/* ---------- 首页 ---------- */
function renderFilter(){
  var cnt={all:shows.length};
  FIL.slice(1).forEach(function(f){ cnt[f]=shows.filter(function(s){ return (s.status||'watching')===f; }).length; });
  document.getElementById('filters').innerHTML=FIL.map(function(f){
    return '<button class="fbtn'+(curFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+(f==='all'?'全部':ST_NAME[f])+' <span style="opacity:.5">'+(cnt[f]||0)+'</span></button>';
  }).join('');
  var TABS=['all','manga-adapt','tv-original','semi-original','unknown'];
  var tc={all:shows.length};
  shows.forEach(function(s){ var t=sTypeOf(s); tc[t]=(tc[t]||0)+1; });
  var str2=document.getElementById('showTypeRow');
  if(str2) str2.innerHTML=TABS.map(function(t){
    return '<button class="ty'+(showTypeF===t?' on':'')+'" onclick="setShowType(\''+t+'\')">'+(t==='all'?'全部类型':STYPE_NAME[t])+' <span style="opacity:.5">'+(tc[t]||0)+'</span></button>';
  }).join('');
}
function setFilter(f){ curFilter=f; renderFilter(); renderList(); }

/* 内置库浏览功能 */
var INTERNAL_SHOWS=window.ANITRACKER_LIB||[];
function renderInternalLib(){
  document.getElementById('vList').style.display='';
  document.getElementById('vDetail').style.display='none';
  document.getElementById('vAdd').style.display='none';
  // 确保 filter 容器存在
  var filterEl=document.getElementById('filters');
  if(!filterEl){
    var wrap=document.createElement('div');
    wrap.innerHTML='<div class="filter" id="filters"></div><div id="list"></div>';
    document.querySelector('.wrap').appendChild(wrap);
  } else {
    filterEl.innerHTML='';
    var str3=document.getElementById('showTypeRow'); if(str3) str3.innerHTML='';
    document.getElementById('list').innerHTML='';
  }
  document.querySelector('.top').innerHTML='<div class="brand">追迹<small>ANITRACKER 库</small></div><button class="topbtn" onclick="renderList()">←</button>';
  var fe=document.getElementById('filters');
  if(!document.getElementById('libQ')){
    var sr=document.createElement('div');
    sr.className='searchrow2';
    sr.innerHTML='<input id="libQ" placeholder="搜番名 / 英文名 / 集名…" oninput="libQInput()"/>';
    fe.parentNode.insertBefore(sr, fe);
    var hr=document.createElement('div');
    hr.className='histrow'; hr.id='libHist';
    fe.parentNode.insertBefore(hr, sr.nextSibling);
  }
  renderSearchHist();
  var cats={all:'全部'};
  INTERNAL_SHOWS.forEach(function(s){cats[s.type]=(cats[s.type]||0)+1;});
  var types=['all'];
  var typeOrder=['manga-adapt','tv-original','semi-original','unknown'];
  Object.keys(cats).forEach(function(t){ if(t!=='all') types.push(t); });
  types=types.sort(function(a,b){
    if(a==='all') return -1; if(b==='all') return 1;
    var ia=typeOrder.indexOf(a), ib=typeOrder.indexOf(b);
    if(ia>=0&&ib>=0) return ia-ib;
    if(ia>=0) return -1; if(ib>=0) return 1;
    return a.localeCompare(b);
  });
  document.getElementById('filters').innerHTML=types.map(function(t,i){
    var count=t==='all'?INTERNAL_SHOWS.length:cats[t];
    return '<button class="fbtn'+(i===0?' on':'')+'" onclick="filterInternal(\''+t+'\')">'+(t==='all'?'全部':t)+' <span style="opacity:.5">'+count+'</span></button>';
  }).join('');
  filterInternal('all');
}
var libType='all';
var _libT=null;
function libQInput(){
  var v=(document.getElementById('libQ')&&document.getElementById('libQ').value.trim())||'';
  clearTimeout(_libT); _libT=setTimeout(function(){ filterInternal(libType); },160);
  if(v){ pushSearchHist(v); renderSearchHist(); } /* 同步记录+前缀去重；渲染仍防抖 */
}
function filterInternal(type){
  libType=type;
  document.querySelectorAll('#filters .fbtn').forEach(function(b){
    var txt=b.textContent.split(' ')[0];
    b.classList.toggle('on', (txt===type)||(type==='all'&&txt==='全部'));
  });
  var qRaw=(document.getElementById('libQ')&&document.getElementById('libQ').value||'').trim().toLowerCase();
  var q=norm(qRaw);
  var list=(type==='all'?INTERNAL_SHOWS.slice():INTERNAL_SHOWS.filter(function(s){return s.type===type;}));
  if(q){
    list=list.filter(function(s){
      var hay=norm(((s.title||'')+' '+(s.nameJp||'')+' '+((s.aliases||[]).join(' '))));
      if(hay.includes(q)) return true;
      return (s.eps||[]).some(function(e){ return norm(e.t).includes(q); });
    });
  }
  list.sort(function(a,b){return a.title.localeCompare(b.title,'zh');});
  document.getElementById('list').innerHTML=list.map(function(s){
    var cover=s.cover?'<img src="'+esc(s.cover)+'" onerror="this.remove()" style="width:64px;height:88px;object-fit:cover;border-radius:6px;background:var(--accent-soft)"/>':'<div style="width:64px;height:88px;background:var(--accent-soft);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent)">'+esc((s.title||'?').slice(0,1))+'</div>';
    var right=s.rating?'<div style="flex:none;text-align:center"><b style="font-family:var(--serif);font-size:16px;color:var(--accent)">'+s.rating+'</b><div style="font-size:9px;color:var(--muted);letter-spacing:1px">评分</div></div>':'';
    return '<div class="show" onclick="showInternalDetail(\''+s.id.replace(/'/g,"\\'")+'\')">'+
      cover+
      '<div class="info"><div class="t">'+esc(s.title)+'</div>'+fCnt(s)+
        '<div class="s">'+(s.type?esc(s.type)+' · ':'')+(s.year||'')+((s.year&&s.status)?' · ':'')+(s.status?(ST_NAME[s.status]||s.status):'')+'</div>'+
        '<div class="num"><b>'+s.total+'</b> <span style="font-size:12px;color:var(--muted)">集</span></div>'+
      '</div>'+right+
    '</div>';
  }).join('');
}
function showInternalDetail(id){
  var s=INTERNAL_SHOWS.find(function(x){return x.id===id;});
  if(!s)return;
  curSid='int:'+id;
  document.getElementById('vList').style.display='none';
  document.getElementById('vDetail').style.display='';
  document.getElementById('dCover').src=s.cover||'';
  document.getElementById('dTitle').textContent=s.title;
  document.getElementById('dJp').textContent=s.nameJp||'';

async function addInternal(id){
  var s=INTERNAL_SHOWS.find(function(x){return x.id===id;});

  // 检查是否已在片单
  if(shows.find(function(x){return x.title===s.title;})){

  }

  addShow({
    sid:'int-'+Date.now(),
    title:s.title,
    nameJp:s.nameJp||'',
    cover:cover,
    year:s.year||'',
    total:s.total,
    eps:eps,
    statuses:{},
    status:'watching',
    addedAt:Date.now(),
    updAt:Date.now(),
    source:'内置库 · '+s.type
  });

function fgParseFills(html){
  /* 严格解析: "N. (时长) 标题 *Filler | *Mixed Canon | *Canon" */
  var text = html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#\d+;/g,' ').replace(/\s+/g,' ');
  var re = /(\d{1,4})\.\s*(?:\([\d:]+\))?\s*([^.*]{2,80}?)\s*\*\s*(Filler|Mixed Canon(?:\/Filler)?|Anime Canon|Canon)\b/gi;
  var byCat = { filler: [], mixed: [], canon: [] }, dup = {};
  var m, safety = 0;
  while ((m = re.exec(text)) !== null && safety < 5000) {
    safety++;
    var ep = +m[1]; if (ep < 1 || ep > 2000) continue;
    var cat = m[3].toLowerCase();
    cat = cat.charAt(0) === 'f' ? 'filler' : (cat.indexOf('mixed') >= 0 ? 'mixed' : 'canon');
    if (!dup[ep]) dup[ep] = cat;
  }
  Object.keys(dup).forEach(function (k) { byCat[dup[k]].push(+k); });
  Object.keys(byCat).forEach(function (k) { byCat[k].sort(function (a, b) { return a - b; }); });
  return byCat;
}
function fgFmt(arr){
  if (!arr || !arr.length) return '';
  var out = [], i = 0;
  while (i < arr.length) {
    var j = i;
    while (j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++;
    out.push(i === j ? '' + arr[i] : arr[i] + '-' + arr[j]);
    i = j + 1;
  }
  return out.join(',');
}

async function cacheCover(url,useProxy){
  if(!url) return '';
  var fetchUrl=useProxy?('https://proxy.cors.sh/'+url):url;
  var r=await fetch(fetchUrl);
  if(!r.ok) throw new Error('cover http '+r.status);
  var b=await r.blob();
  return await new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){ try{
      var c=document.createElement('canvas'); c.width=96; c.height=128;
      var ctx=c.getContext('2d'); ctx.drawImage(im,0,0,96,128);
      res(c.toDataURL('image/jpeg',0.72));
    }catch(e){ rej(e); } };
    im.onerror=function(){ rej(new Error('img decode')); };
    im.src=URL.createObjectURL(b);
  });
}

      return {s:(e.sort!==undefined&&e.sort!==''&&+e.sort>0)?+e.sort:0, t:(e.name_cn||e.name||''), type:'canon', ref:null, dur:24, bid:e.id}; /* Bangumi type1=SP≠半原创，灌水判定走 Filler Guide */

/* 从标题提取系列基名（去掉季/剧场版/OVA/年份等标记） */
function seriesBase(t){
  if(!t) return '';
  var x=String(t);
  x=x.replace(/\s*[（(][^）)]*[)）]\s*/g,'');
  x=x.replace(/\s*(第\s*[0-9一二三四五六七八九十]+\s*[季期部]\s*篇?|剧场版|动画电影|电影版|ova|oad|特别篇|总集篇|番外|外传|ova版)\s*/gi,'');
  x=x.replace(/\s*\d{4}\s*$/,'');
  return x.replace(/\s+/g,' ').trim();
}
function cnNum(s){ var d={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10}; var n=0; for(var i=0;i<s.length;i++){ n=d[s[i]]||n; } return n||0; }
/* 由标题推断部分类型与季号 */
function classifyPart(t){
  var x=String(t||'');
  if(/剧场版|动画电影|电影版|劇場版|movie/i.test(x)) return {kind:'movie',seasonNo:0};
  if(/\bova\b|oad|ova版/i.test(x)) return {kind:'ova',seasonNo:0};
  if(/特别篇|总集篇|番外|外传|\bsp\b/i.test(x)) return {kind:'sp',seasonNo:0};
  var m=x.match(/第\s*([0-9]+)\s*季/); if(m) return {kind:'tv',seasonNo:parseInt(m[1],10)};
  var m2=x.match(/第\s*([一二三四五六七八九十]+)\s*季/); if(m2) return {kind:'tv',seasonNo:cnNum(m2[1])};
  var m3=x.match(/s\s*(\d+)/i); if(m3) return {kind:'tv',seasonNo:parseInt(m3[1],10)};
  var m4=x.match(/第\s*([0-9]+)\s*期/); if(m4) return {kind:'tv',seasonNo:parseInt(m4[1],10)};
  return {kind:'tv',seasonNo:0};
}

        status:stt, rating:d.rating||0,

        type:fgType(title), ep:d.ep||0,
        source:'豆瓣'+(d.isAnime?'·动画':'·真人'),
        addedAt:Date.now(), updAt:Date.now()
      });
      added++;
    });
    if(added||upd){ save(); renderList(); }
    note('豆瓣同步完成：新增 '+added+' · 状态更新 '+upd+' · 无变化 '+dup+(j.truncated?'（条目多，只取了最近 300 条）':''), true);
  }catch(e){ note('同步异常：'+(e.message||e), false); }
}
/* 自包含：导入豆瓣导出文件（JSON 数组 或 CSV：标题,状态,年份,评分），无需网关/cookie */
function importDoubanFile(box,ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var m=box?box.querySelector('#dbMsg'):null;
  function note(t,ok){ if(m){ m.textContent=t; m.style.color=ok?'#7a9a6a':'var(--danger)'; } else toast(t); }
  var rd2=new FileReader();
  rd2.onload=function(){
    try{
      var text=String(rd2.result||''); var rows=[];
      var trimmed=text.trim();
      if(trimmed.charAt(0)==='['||trimmed.charAt(0)==='{'){
        var arr=JSON.parse(trimmed); if(!Array.isArray(arr)) arr=[arr];
        arr.forEach(function(d){ if(d&&(d.title||d.name||d.书名||d.名称)) rows.push({title:String(d.title||d.name||d.书名||d.名称||''), year:String(d.year||d.年份||'').slice(0,4), status:String(d.status||d.状态||''), rating:parseFloat(d.rating||d.评分||0)||0}); });
      } else {
        var lines=text.split(/\r?\n/);
        for(var i=0;i<lines.length;i++){ var ln=lines[i].trim(); if(!ln) continue; var c=ln.split(','); rows.push({title:(c[0]||'').trim(), year:(c[1]||'').trim().slice(0,4), status:(c[2]||'').trim(), rating:parseFloat(c[3])||0}); }
      }
      if(!rows.length){ note('文件里没解析出条目', false); return; }
      var smap={wish:'want',do:'watching',collect:'done',想看:'want',在看:'watching',看过:'done'};
      var added=0,upd=0,dup=0;
      rows.forEach(function(d){
        var title=d.title.trim(); if(!title) return;
        var stt=smap[d.status]||'watching';
        var cur=shows.find(function(s){ return dbNormTitle(s.title)===dbNormTitle(title); });
        if(cur){ if(cur.status!==stt){ cur.status=stt; cur.updAt=Date.now(); upd++; } else dup++; return; }
        shows.push({ sid:'db'+Date.now()+Math.floor(Math.random()*1e4), title:title, nameJp:'', cover:'', year:d.year, total:0, eps:[], statuses:{}, status:stt, rating:d.rating, genres:[], isAnime:false, type:fgType(title), addedAt:Date.now(), updAt:Date.now(), source:'豆瓣·导入' });
        added++;
      });
      if(added||upd){ save(); renderList(); }
      note('豆瓣文件导入完成：新增 '+added+' · 状态更新 '+upd+' · 无变化 '+dup, true);
    }catch(e){ note('导入失败：'+(e.message||e), false); }
  };
  rd2.readAsText(f,'utf-8');
}

  wrap.appendChild(box); document.body.appendChild(wrap);

function exportAllJSON(){
  var all={app:'anitracker-full',version:2,exportedAt:new Date().toISOString(),data:{}};
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); all.data[k]=localStorage.getItem(k); }
  return JSON.stringify(all);
}
function downloadBackup(){
  var all=exportAllJSON();
  var blob=new Blob([all],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='anitracker-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('备份已下载（'+Object.keys(JSON.parse(all).data).length+' 项）');
}
var _running=false;
function syncRun(auto){
  if(_running) return;
  wr(LS.shows,shows); /* 内存快照回写，防漏 save */
  var cfg=rd(LS.cfg,null);
  if(!cfg||!cfg.url){ if(!auto) syncOpen(); else toast('尚未配置同步——点右上 ⇅ 填 WebDAV'); return; }
  _running=true; if(!auto) toast('同步中…');
  try{ cfg._p=atob(cfg.pass||''); }catch(e){ cfg._p=cfg.pass||''; }
  var auth='Basic '+btoa(cfg.user+':'+cfg._p);
  var local=rd(LS.shows,[]);
  var meta=rd('tr_meta',{});
  var pack={app:'anitracker',version:2,items:local.map(function(s){
    var key=String(s.sid);
    var same=(meta[key]!==undefined)&&JSON.stringify(meta[key].val)===JSON.stringify(s);
    return {sid:key,t:same?meta[key].t:Date.now(),v:s};
  })};
  fetch(cfg.url+'/tracker-sync.json',{method:'GET',headers:{Authorization:auth},cache:'no-store'}).then(function(r){
    if(r.status===404) return null;
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    var remote=null;
    if(txt){ try{ remote=JSON.parse(txt); }catch(e){ throw new Error('云端文件损坏'); } }
    if(!remote||!Array.isArray(remote.items)){
      return fetch(cfg.url+'/tracker-sync.json',{method:'PUT',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify(pack)})
        .then(function(r2){ if(!r2.ok) throw new Error('上传 HTTP '+r2.status); return {up:pack.items.length,down:0,conflict:0}; });
    }
    var map={},res={up:0,down:0,conflict:0};
    pack.items.forEach(function(it){ map[it.sid]=it; });
    remote.items.forEach(function(it){
      it.sid=safeSid(it.sid); if(it.v) it.v.sid=it.v.sid===undefined?it.sid:safeSid(it.v.sid);
      var lv=map[it.sid];
      if(!lv){ map[it.sid]=it; res.down++; return; }
      if(it.t>lv.t){ map[it.sid]=it; res.down++; } else if(it.t<lv.t){ res.up++; } else res.conflict++;
    });
    var merged={app:'anitracker',version:2,items:Object.keys(map).map(function(k){ return map[k]; })};
    return fetch(cfg.url+'/tracker-sync.json',{method:'PUT',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify(merged)})
      .then(function(r2){ if(!r2.ok) throw new Error('上传 HTTP '+r2.status);
        var nm={};
        merged.items.forEach(function(it){ nm[it.sid]={t:it.t,val:it.v};
          var cur=bySid(it.sid);
          if(!cur){ shows.push(it.v); } else if(JSON.stringify(cur)!==JSON.stringify(it.v)){ shows[shows.indexOf(cur)]=it.v; }
        });
        save();
        wr(LS.meta,nm); /* 持久化时间戳账本，防两设备互覆盖 */
        return res;
      });
  }).then(function(res){
    wr('tr_synclast',{at:new Date().toISOString(),res:res});
    toast('同步完成：上传 '+res.up+' / 下载 '+res.down+(res.conflict?(' · 冲突保留本地 '+res.conflict):''));
    renderList();
  }).catch(function(e){
    toast(e.name==='TypeError'?'同步失败：网络不可达或被拦截（检查 WebDAV 地址）':'同步失败：'+(e.message||e));
  }).finally(function(){ _running=false; });
}

/* ---------- 启动 ---------- */
renderList();
setInterval(function(){ var c=rd(LS.cfg,null); if(c&&c.url&&shows.length) syncRun(true); },6*60*1000);
