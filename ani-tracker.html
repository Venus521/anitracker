       直接把 /app/AniTracker-<code>.apk 当链接给人点，会被 CloudBase 测试域名那堵
       「页面访问提示」墙按文档请求拦一次（每个新地址都要重过一遍，用户：「每次都这样太麻烦了」）；
       而 fetch 不是文档请求，实测永远 200。所以这里取清单→fetch→blob 落地成文件，绕开那堵墙。
       清单里的 url 一概不信，只拿 versionCode 那串纯数字自己拼路径（和固定入口同一套规矩）。 */
    var arow=document.createElement('div'); arow.className='acctbk';
    arow.innerHTML='<span class="mini" style="color:var(--muted)">手机版 App</span>'+
      '<button type="button" class="lnk" id="apkBtn">下载 APK</button>'+
      '<span class="note" id="apkMsg">装到手机桌面，离线也能用</span>';
    box.insertBefore(arow,box.querySelector('#verLine'));
    var abtn=arow.querySelector('#apkBtn'),amsg=arow.querySelector('#apkMsg');
    window.__atApk=function(t,ok){ abtn.textContent='下载 APK'; abtn.disabled=false;
      amsg.textContent=t; amsg.style.color=ok?'var(--ok)':'var(--danger)'; };
    abtn.onclick=function(){
      abtn.textContent='取清单…'; abtn.disabled=true; amsg.textContent=''; amsg.style.color='var(--muted)';
      fetch('/app/version.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
      }).then(function(j){
        var c=String((j&&j.versionCode)||'');
        if(!/^\d{1,6}$/.test(c)) throw new Error('清单里的版本号不合法');
        abtn.textContent='下载中…';
        return fetch('/app/AniTracker-'+c+'.apk',{cache:'no-store'}).then(function(r2){
          if(!r2.ok) throw new Error('HTTP '+r2.status); return r2.blob();
        }).then(function(b){
          if(!b||!b.size) throw new Error('拿到的是空文件');
          var u=URL.createObjectURL(b), a=document.createElement('a');
          a.href=u; a.download='AniTracker-'+c+'.apk';
          document.body.appendChild(a); a.click();
          setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(u); },1500);
          window.__atApk('v'+((j&&j.versionName)||c)+'（'+Math.round(b.size/1024)+' KB）已交给浏览器下载，点开装即可',true);
        });
      }).catch(function(e){
        var m=String(e&&e.message||e).slice(0,46);
        /* 取不到分两种：清单本身被人改坏（说清楚哪不合法），和真没网（才提网络） */
        window.__atApk('没拿到安装包（'+m+''+(/HTTP|Failed|fetch|空文件|Load/i.test(m)?'）——多半是这台设备没联网':'）'),false);
      });
    };
  }
  box.querySelector('#syExport').onclick=function(){ downloadBackup(); };  box.querySelector('#syImport').onclick=function(){ box.querySelector('#syFile').click(); };
  /* 手机端这两行整块不在 DOM 上（见 openAccount 里的 AT_TOUCH 分支），绑定必须跟着认空 */
  var _cvb=box.querySelector('#cvSrcOpen'); if(_cvb){ _cvb.onclick=function(){ openCoverSrc(); }; }
  var _dbb=box.querySelector('#dbSyncOpen'); if(_dbb){ _dbb.onclick=function(){ openDoubanSync(); }; }
/* ===== 封面来源设置（v2.25.0 建；v2.29.1 起 TMDB 密钥为可选进阶，主文案=全自动免配置）===== */
function openCoverSrc(){
  var old=document.getElementById('cvSrcMask'); if(old) old.remove();
  var wrap=makeEl('<div class="mask" id="cvSrcMask"><div class="panel aiwrap">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="margin:0">封面来源</h3>'+
    '<button type="button" id="cvSrcX" aria-label="关闭" style="background:none;border:none;font-size:20px;line-height:1.2;color:var(--muted);padding:2px 4px">×</button></div>'+
    '<p class="aihint">封面抓取<b style="color:var(--ink)">全自动、无需任何密钥</b>：国产剧/中文剧由豆瓣云函数按剧名抓图（覆盖最全），海外剧与动画走 TVMaze / AniList / Wikidata（均免 key）。</p>'+
    '<label style="margin:0">TMDB API Key（可选进阶，只存本机；导出备份 / 云同步会自动剔除）</label>'+

    '<div class="msg" id="cvSrcMsg"></div>'+
    '<div class="row2" style="margin-top:2px"><button type="button" class="b1" id="cvSrcSave" style="flex:1">保存</button>'+
    '<button type="button" class="b2" id="cvSrcClear" style="flex:0 0 auto">清除</button></div>'+
    '<p class="aihint" style="margin-top:10px">什么时候才值得配：想给部分海外剧提升封面命中率时，去 '+
    '<a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>（免费）申请，复制 <b style="color:var(--ink)">API Key (v3 auth)</b> 那串 <b style="color:var(--ink)">32 位</b>的填进来即可；页面上另一串 eyJ 开头、很长的 v4 令牌不是它，贴进来会被拦下。豆瓣偶发限流时，稍后再点详情页「⟳ 重拉封面」；总抓不到的走「⇪ 本地封面」手动传图。</p>'+
    '</div></div>');
  document.body.appendChild(wrap);
  var km=$('cvSrcKey'); if(km) km.value=rd('at_tmdb_key','')||'';
  /* v2.46.1：上回撞过 401 的话，一开面板就把话说在前面（否则他只看到输入框是空的，不知道这一环停了） */
  var mi=$('cvSrcMsg');
  if(_tmdbBadKey){ mi.textContent='⚠ 上次拉封面时 TMDB 回「密钥无效」，这一环已停用；换一个 Key 保存就恢复'; mi.style.color='var(--warn)'; }
  wrap.addEventListener('click',function(e){ if(e.target===wrap) wrap.remove(); });
  $('cvSrcX').onclick=function(){ wrap.remove(); };
  $('cvSrcSave').onclick=function(){
    var v=String($('cvSrcKey').value||'').trim(), m=$('cvSrcMsg'), w=(typeof tmdbKeyWarn==='function')?tmdbKeyWarn(v):'';
    if(typeof tmdbKeyBlocked==='function'&&tmdbKeyBlocked(v)){ m.textContent='✗ 没保存：'+w; m.style.color='var(--danger)'; return; }
    wr('at_tmdb_key',v); _tmdbBadKey=false;

    m.textContent = w ? ('⚠ 已保存，但这串可能不对：'+w) : '已保存（本机，导出已剔除）';
    m.style.color = w ? 'var(--warn)' : 'var(--ok)';
  };
  $('cvSrcClear').onclick=function(){ wr('at_tmdb_key',''); _tmdbBadKey=false; var k2=$('cvSrcKey'); if(k2) k2.value='';
    var m=$('cvSrcMsg'); m.textContent='已清除 TMDB Key'; m.style.color='var(--muted)'; };
}
  box.querySelector('#syFile').addEventListener('change',function(ev){
    var f=ev.target.files[0]; if(!f) return; var rd2=new FileReader();
    rd2.onload=function(){ try{
      var j=JSON.parse(rd2.result);
      if(j.app!=='anitracker-full') throw new Error('不是追迹备份文件');
      var s=backupSanitize(j.data||{});
      var n=0; Object.keys(s.ok).forEach(function(k){ localStorage.setItem(k,s.ok[k]); n++; });
      toast('已恢复 '+n+' 项'+(s.skipped.length?('（拒收 '+s.skipped.length+' 项敏感/非法数据）'):'')+'，即将刷新');
      setTimeout(function(){ location.reload(); },700);
    }catch(e){ toast('恢复失败：'+e.message); } };
    rd2.readAsText(f,'utf-8');
  });
}

function exportAllJSON(){
  var all={app:'anitracker-full',version:3,exportedAt:new Date().toISOString(),data:{}};
  /* v2.13.0：凭证与机器级 key 永不入备份文件 */
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(SECRET_KEY_RE.test(k)) continue;
    all.data[k]=localStorage.getItem(k);
  }
  return JSON.stringify(all);
}
function downloadBackup(){
  var all=exportAllJSON();
  var blob=new Blob([all],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='anitracker-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('备份已下载（'+Object.keys(JSON.parse(all).data).length+' 项）');
}
/* v2.10.0 移除：WebDAV 文件同步整套 ——
   syncRun() / tracker-sync.json 读写 / tr_meta 时间戳账本 / 6 分钟一次的后台自动同步。
   移除理由有两层：
     1. 它是「账号系统」的劣质代替品 —— 要用户自己去搞一个 WebDAV 空间，还得填地址账号密码；
     2. 它把 WebDAV 密码用 btoa 明文存在 localStorage 里，本身是个安全隐患。
   现在有真正的账号系统（cloudbase-sync.js），这套东西没有存在必要了。 */

/* ---------- 启动 ---------- */
applyTheme((function(){ try{ return localStorage.getItem('at_theme')==='dark'?'dark':'light'; }catch(e){ return 'light'; } })());
/* v2.10.1：任何 .mask 面板出现/消失时同步 body 标记 —— 让 toast 抬高，不遮面板底部主按钮。
   用 MutationObserver 而不是在每个开关面板处埋点，覆盖面更全（含未来新增的面板）。 */
(function(){
  var sync=function(){
    try{
      var has=!!document.querySelector('.mask');
      if(has) document.body.classList.add('panel-open');
      else document.body.classList.remove('panel-open');
    }catch(e){}
  };
  try{
    new MutationObserver(sync).observe(document.body,{childList:true,subtree:true});
    sync();
  }catch(e){}
})();
/* v2.44.7：开机补标记日期必须在第一次渲染之前——先看到按 addedAt 排的错误顺序、
   隔一秒再跳一次，比不跳更让人怀疑数据丢了。耗时当场记下，写进 CHANGELOG 的是量到的数。 */
var _dbmT=Date.now(), _dbmR=null, _dbmE='';
try{ _dbmR=dbMarkSync(); }catch(e){ _dbmE=String((e&&e.message)||e); }
window.__dbMarkSync={ r:_dbmR, ms:Date.now()-_dbmT, err:_dbmE };
renderList();
/* v2.6.0：启动后小批量静默补封面（离线自动跳过；失败退避见 coverCanAuto）
   v2.41.0 试过一轮加到 10 部：立刻把 run-regression的 T13（切季零网络）与 T15（标记已看零请求）
   一起撞红——那两条靠「测量窗口内无请求」判功能，开机后台这条尾巴一长就伸进窗口里，
   量具读到的就成了「切季/标记在发请求」。部数维持 6：静默补齐只做润色，
   「封面全都要」交给用户点的那枚「⟳ 一键拉封面」（全量、带进度、有体检）。
   v2.44.1（用户反馈「还是没封面很多」）：单轮 6 部是量具底线，但**可以多跑几轮**——
   开机后按 20s间隔连跑三轮，同一批 limit=6，于是最多自动补到 18 部，
   而任何一轮的尾巴仍只有 6 部那么长，T13/T15 的测量窗量到的还是同一件事。
   每轮之间先看有没有在跑（_coverHealRunning），不重入；离线/页面隐藏就停。
   coverCanAuto 的失败退避缩到 2h，所以第二轮能真正捡起第一轮失败的部。 */
var _atAutoHealRounds=0;
function _atAutoHealRound(){
  try{
    if(_atAutoHealRounds>=3) return;
    if(!navigator.onLine) return;
    if(_coverHealRunning) { setTimeout(_atAutoHealRound,4000); return; }
    _atAutoHealRounds++;
    coverHealAll(false,6);
    setTimeout(_atAutoHealRound,20000);
  }catch(e){}
}
setTimeout(_atAutoHealRound,4000);
/* ===== v2.44.2：后台补封面（用户令「后台也可以补封面」）=====
   开机那一轮只有三轮共 18 部的名额，且它跑在 4 秒后——这时候组件还在加载、
   云合并更没落地（自动登录 + 合并要 1.2 秒之后才跑），所以开机那一轮看到的
   常常是**登录前/合并前**的片单：换设备或重装后回来的那批一部封面都没有，
   而它们恰恰是最需要补的（封面 dataURL 不进云同步，合并回来必然是空的）。
   这里接住 cloudbase-sync.js 发来的 at_bgcover 事件，在这些时刻各补一轮：
     · 自动登录/云合并刚完成 —— 拿到真正登录态、合并结果已刷新的那份片单；
     · 用户点开账号面板 —— 界面开着，补完当场看得见。
   三条护栏，少一条就白搭：
     ① **必须有封面可补**（pool 为空直接结束，不做无谓请求）；
     ② **冷却**：距上一轮超过 60 秒才跑 —— 用户可能反复点开面板，
        也可能自动登录与mount 前后脚各发一次，不设冷却就是同一轮跑两遍；
     ③ **只补一轮 6 部**，不跟开机那三轮叠成 18 部：账号面板开着的时候
        还要渲染/查版本，长尾巴会让门禁 T15 的测量窗重新变脏。
   用「静默」调用（manual=false），所以不弹进度、不打断用户正在做的事。 */
var _atBgCoverAt=0;
window.addEventListener('at_bgcover',function(e){
  try{
    if(!navigator.onLine) return;
    var need=shows.filter(function(s){ return coverNeedsHeal(s)&&coverCanAuto(s); }).length;
    if(!need) return;
    if(Date.now()-_atBgCoverAt<60000) return;
    if(_coverHealRunning) return;
    _atBgCoverAt=Date.now();
    coverHealAll(false,6);
  }catch(err){}
});
/* v2.10.0：后台定时同步已随 WebDAV 移除（账号云同步由 CBSync.autosync 在 save() 时触发） */
</script>

<script id="at270-js">
/* =====================================================================
   AniTracker v2.7.0 模块（一）：防丢草稿 · 联想引擎 · 手动添加
   —— 由修复会话注入；不改动主脚本既有代码，全部以运行时增强实现。
   ===================================================================== */
(function () {
  'use strict';
  var AT270 = window.AT270 = window.AT270 || {};
  AT270.V = '2.7.0';

  /* ---------- 小工具 ---------- */
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function makeEl(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
  function pad(n) { return n < 10 ? ('0' + n) : ('' + n); }
  function fmt(t) { try { var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); } catch (e) { return ''; } }
  function logEdit(sid, kind, detail) { /* v2.14.0d 修改历史退役（用户指令「已有的记录全清空」）：停写，保留空壳防调用点报错 */ }
  AT270.logEdit = logEdit;

  /* =====================================================================
     一、防丢草稿系统
     - 白名单弹层在「点空白关闭 / ESC 关闭」前自动保存已填内容
     - 重新打开时显示「恢复草稿 / 丢弃」横幅
     ===================================================================== */
  var DRAFT_MASKS = ['syncMask', 'at270AddMask', 'at270ProfMask', 'at270RelMask'];
  function collectDraft(mask) {
    var fields = {}, els = mask.querySelectorAll('input,textarea,select');
    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      if (!e.id) continue;
      var v = (e.type === 'checkbox' || e.type === 'radio') ? (e.checked ? '1' : '') : String(e.value == null ? '' : e.value);
      if (!v || !v.trim()) continue;
      fields[e.id] = { v: v, t: e.type || 'text' };
    }
    return fields;
  }
  function saveMaskDraft(mask) {
    if (!mask || !mask.id || DRAFT_MASKS.indexOf(mask.id) < 0) return false;
    var fields = collectDraft(mask);
    var D = lsGet('at_drafts', {});
    if (!Object.keys(fields).length) {
      if (D[mask.id]) { delete D[mask.id]; lsSet('at_drafts', D); }
      return false;
    }
    D[mask.id] = { at: Date.now(), fields: fields };
    lsSet('at_drafts', D);
    try { toast('已自动保存草稿（' + Object.keys(fields).length + ' 项），重新打开可一键恢复'); } catch (e) {}
    return true;
  }
  function clearDraftFor(id) { var D = lsGet('at_drafts', {}); if (D[id]) { delete D[id]; lsSet('at_drafts', D); } }
  AT270.clearDraftFor = clearDraftFor;
  function restoreDraft(mask, draft) {
    var n = 0, ks = Object.keys(draft.fields || {});
    for (var i = 0; i < ks.length; i++) {
      var id = ks[i], f = draft.fields[id];
      var e = mask.querySelector('[id="' + id + '"]');
      if (!e) continue;
      try {
        if (e.type === 'checkbox') e.checked = (f.v === '1');
        else { e.value = f.v; e.dispatchEvent(new Event('input', { bubbles: true })); }
        n++;
      } catch (x) {}
    }
    return n;
  }

  var AI_PASTE_KEY = 'at_ai_paste';   /* {slug: {f,m,c,at,t,raw}}AI 结果长期库，优先级最高 */

  /* —— 解析引擎 ———————————————————————————————————————————

       "第 1、2、3 集是原创；第4集漫改"
       "TV原创：11-15, 23, 45-47"
       "【动画原创】第12集 ／ 12话 原创 ／ 12 (Filler)"
       "ep1-5 manga canon, ep6 filler"
     输出：{filler:[], mixed:[], canon:[], unknownLines:[], total}
     分类口径与项目一致：TV原创→filler，半原创→mixed，漫改→canon

     核心思路：先按「子句」切（逗号/顿号/分号/换行都切），再对每个子句
     分别判分类。关键点：子句只含集号不带分类词时，继承「它前面的分类词」
     —— 这样 "TV原创：11,12,13" 才能正确归到 TV原创 而不是漫改。
     ————————————————————————————————————————————————————— */
  var AI_CAT = {
    filler: ['tv原创', 'tv 原创', '动画原创', '動畫原創', '原创', '原創', 'filler', 'fillers', 'anime original'],
    mixed: ['mixed canon/filler', 'mixed canon', 'anime canon', '混合原创', '半原创', '半原創', '半改', 'mixed'],
    canon: ['manga canon', '漫画改编', '漫改', '原作改编', '原作', '原著', '漫画', 'manga', 'canon']
  };
  /* 关键词探测顺序：长词优先，防止 "mixed canon" 被 "canon" 抢走 */
  var AI_WORDS = [
    ['mixed canon/filler', 'mixed'], ['mixed canon', 'mixed'], ['anime canon', 'mixed'],
    ['动画原创', 'filler'], ['動畫原創', 'filler'], ['tv 原创', 'filler'], ['tv原创', 'filler'],
    ['混合原创', 'mixed'], ['半原创', 'mixed'], ['半原創', 'mixed'], ['半改', 'mixed'],
    ['漫画改编', 'canon'], ['manga canon', 'canon'], ['原作改编', 'canon'],
    ['漫改', 'canon'], ['原作', 'canon'], ['原著', 'canon'], ['漫画', 'canon'], ['canon', 'canon'],

    ['manga', 'canon'], ['mixed', 'mixed']

  function aiFindCat(seg) {

    var best = null;
    for (var i = 0; i < AI_WORDS.length; i++) {
      var w = AI_WORDS[i][0], cat = AI_WORDS[i][1];
      var at = low.indexOf(w);

     → ④ 每个集号归属「离它最近的那个分类词」。

      var low = ln.toLowerCase();

      /* ① 找出所有分类词出现位置（长词优先，同位置取长；已被吃掉的区间不重复计） */
      var marks = [];

      /* 归一：只在"副本"上找数字，位置与原文一致（替换都等长或仅去标点，需保持长度）

         没有的话，再往前面的子句找最近的一个分类词（"TV原创：11,12,13" 的 12/13）。
         但若自己所在子句的"更后面"有分类词，且前面子句也没有 → 用后面的

      var spans = [];
      var reRange = /(\d{1,4})\s*(?:集|话|話|集数|ep|episode)?\s*-\s*(?:第)?\s*(\d{1,4})\s*(?:集|话|話|ep|episode)?/gi;
      var m;
      while ((m = reRange.exec(scan)) !== null) {
        var a = +m[1], b = +m[2];
        if (a > b) { var t = a; a = b; b = t; }
        if (b > 3000 || a < 1) continue;
        if (b - a > 2000) continue;
        /* 正则尾部 \s* 会多吃空格，导致 sp.end 越界到下一个分类词上，
           使 "45-47 半原创" 的区间误判为半原创。这里把尾随空白去掉。 */
        var mTxt = m[0].replace(/\s+$/, '');

      }
      /* 剔除已被区间覆盖的数字，再抓零散单集号 */
      var covers = spans.map(function (s) { return { a: s.at, b: s.end }; });
      var reOne = /\d{1,4}/g;
      while ((m = reOne.exec(scan)) !== null) {
        var pos = m.index, inside = false;

      }
      /* 该行连一个集号都没有：若它"看起来像在讲分类"就记为没懂，否则静默忽略。

      if (!spans.length) {

      var lineHit = false;
      spans.forEach(function (sp) {

        /* ① 本子句内的分类词：优先取集号「前面最近」的；前面没有才取后面的。
             这样 "原创：45-47 半原创：50"（空格分隔、无逗号）里

      /* 本行一个集号都没归好，但仍"看起来像在讲分类" → 记为没懂：
         a) 含分类词但找不到任何集号（"TV原创的那几集我记不清了"）
         b) 含数字但完全没分类词（"大概 70 多集吧"）

    var sortU = function (a) { a.sort(function (x, y) { return x - y; }); return a; };

     · 通道② 这里：设置里填一次 LLM key（本机存储，走 SECRET_KEY_RE 加密保护 + 导出剔除），
       搜不到时自动调 AI，复用 aiAskAdd 提示词 + aiStdParse 解析 + aiStdBuild 建档；
       任何一步失败都回退到既有「粘贴面板」，原文预填进去，用户改两下照样能入库。
     五家兼容端点均为 /chat/completions 且实测浏览器直连可达（401 只代表 key 假，不是网络不通）。
     ===================================================================== */
  var AI_CFG_KEY = 'at_ai_cfg';
  var AI_PROVIDERS = [
    { id: 'deepseek', n: 'DeepSeek', base: 'https://api.deepseek.com/chat/completions', model: 'deepseek-chat' },
    { id: 'zhipu', n: '智谱 GLM', base: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4-flash' },
    { id: 'moonshot', n: 'Moonshot Kimi', base: 'https://api.moonshot.cn/v1/chat/completions', model: 'moonshot-v1-8k' },
    { id: 'dashscope', n: '通义千问 DashScope', base: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
    { id: 'siliconflow', n: '硅基流动 SiliconFlow', base: 'https://api.siliconflow.cn/v1/chat/completions', model: 'Qwen/Qwen2.5-7B-Instruct' },
    { id: 'custom', n: '自定义（OpenAI 兼容）', base: '', model: '' }
  ];
  function aiCfgGet() {
    try { var c = JSON.parse(localStorage.getItem(AI_CFG_KEY) || 'null'); return c && typeof c === 'object' ? c : null; }
    catch (e) { return null; }
  }
  function aiCfgSet(c) { try { localStorage.setItem(AI_CFG_KEY, JSON.stringify(c || {})); } catch (e) {} }
  function aiCfgClear() { try { localStorage.removeItem(AI_CFG_KEY); } catch (e) {} }
  /* 只有 base+model+key 三样齐了才算配好——缺一个就退回手动粘贴面板，绝不闷头发请求 */
  function aiAutoReady() {
    var c = aiCfgGet();
    return !!(c && c.base && c.model && c.key);
  }
  AT270.aiAutoReady = aiAutoReady;
  AT270.aiCfgGet = aiCfgGet;
  AT270.aiCfgSet = aiCfgSet;
  AT270.aiCfgClear = aiCfgClear;

  /* 调一次 LLM：system 把「只输出固定格式」钉死，user 复用 aiAskAdd 的提问模板 */
  async function aiAutoAsk(kw) {
    var c = aiCfgGet();
    if (!c || !c.base || !c.model || !c.key) return { ok: false, why: '还没配置 API key' };
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return { ok: false, why: '网络不通' };
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    try {
      var tm = setTimeout(function () { try { ctrl && ctrl.abort(); } catch (e) {} }, 60000);
      var r = await fetch(c.base, {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
        body: JSON.stringify({
          model: c.model, temperature: 0.2, max_tokens: 8000,
          messages: [
            { role: 'system', content: '你是条目数据生成器。只输出用户要求的固定行格式，不要解释、不要客套、不要 Markdown 表格或加粗、不要代码块围栏。' },
            { role: 'user', content: aiAskAdd(String(kw || '').trim()) }
          ]
        }),
        signal: ctrl ? ctrl.signal : undefined
      });
      clearTimeout(tm);
      if (!r.ok) {
        var body = ''; try { body = await r.text(); } catch (e) {}
        return { ok: false, why: '接口返回 ' + r.status + (body ? ('：' + body.slice(0, 160)) : '') };
      }
      var j = await r.json();
      var txt = (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
      if (!String(txt).trim()) return { ok: false, why: 'AI 返回了空内容' };
      return { ok: true, text: String(txt) };
    } catch (e) {
      return { ok: false, why: (e && e.name === 'AbortError') ? '请求超时（60 秒）' : ('请求失败：' + ((e && e.message) || e)) };
    }
  }
  AT270.aiAutoAsk = aiAutoAsk;

  /* 解析失败 / 同名冲突 / 接口挂了 —— 统一回退到粘贴面板，原文预填进 textarea
     （触发既有 260ms 防抖预览），用户改两下照样能入库，比「重来一遍」省事。 */
  function aiAutoFallback(kw, raw, why) {
    openAiStd('add', kw);
    setTimeout(function () {
      try {
        var ta = $('at270StdText');
        if (ta) {
          if (ta.value.trim()) {
            /* v2.22.0: textarea has content - do not overwrite; show restore button */
            var m2 = $('at270StdMsg');
            if (m2) {
              m2.textContent = 'AI reply ready - click button to replace, current draft preserved';
              m2.style.color = 'var(--info)';
              var btn = document.createElement('button');
              btn.type = 'button';
              btn.textContent = 'Restore AI reply';
              btn.style.marginLeft = '8px';
              btn.onclick = function() {
                ta.value = String(raw).slice(0, 20000);
                ta.dispatchEvent(new Event('input', { bubbles: true }));
                m2.textContent = 'Restored AI reply';
                m2.style.color = 'var(--muted)';
              };
              m2.appendChild(btn);
            }
          } else if (raw) {
            ta.value = String(raw).slice(0, 20000);
            ta.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
        var m = $('at270StdMsg');
        if (m && why) { m.textContent = '自动建档没走通（' + why + '）——已切手动：确认下面的预览再点「加入片单」'; m.style.color = 'var(--danger)'; }
      } catch (e) {}
    }, 90);
  }
  /* 全自动建档主路径：调 LLM → 解析 → 同名并入 / 新建 → 直接落详情页 */
  async function aiAutoAdd(kw) {
    kw = String(kw || '').trim(); if (!kw) return;
    if (!aiAutoReady()) { openAiStd('add', kw); return; }
    toast('三条源都没搜到，正在自动问 AI 建档（最长 60 秒）…');
    var r = await aiAutoAsk(kw);
    if (!r.ok) { aiAutoFallback(kw, '', r.why); return; }
    var p;
    try { p = aiStdParse(r.text); } catch (e) { p = null; }
    if (!p || !p.ok) { aiAutoFallback(kw, r.text, '回答没解析成条目'); return; }
    var nt = normTxt(p.title || '');
    var dup = (window.shows || []).filter(function (x) {
      return normTxt(x.title) === nt || (p.nameJp && x.nameJp && normTxt(p.nameJp) === normTxt(x.nameJp));
    })[0];
    if (dup) {
      var st;
      try { st = aiStdMerge(dup, p); } catch (e) { st = null; }
      if (!st || (!st.added && !st.named && !st.srcs)) { toast('《' + dup.title + '》已经全都有了，没有可补的'); openDetail(dup.sid); return; }
      save(); try { statInvalidate(dup.sid); } catch (e) {}; aiHealCoverUrl(dup);
      openDetail(dup.sid);
      toast('已并入《' + dup.title + '》：新增 ' + st.added + ' 集 · 补名 ' + st.named);
      return;
    }
    var item;
    try { item = aiStdBuild(p); } catch (e) { item = null; }
    if (!item) { aiAutoFallback(kw, r.text, '建档构造失败'); return; }
    addShow(item); aiHealCoverUrl(item);
    if (bySid(item.sid)) { try { openDetail(item.sid); } catch (e) {} }
  }
  AT270.aiAutoAdd = aiAutoAdd;

  /* =====================================================================
     十三、启动：迁移 + 数据版本 + 一次性自动校准
     ===================================================================== */
  function boot() {
    try {
      if (!lsGet('at_v270', false)) {
        lsSet('at_v270', true);
      }
      var snap = lsGet('at_fg_snap', '');
      if (snap !== SNAP) {
        try { localStorage.removeItem('at_fg_cache'); } catch (e) {}
        lsSet('at_fg_snap', SNAP);
      }
      /* v2.17.0：来源校准从「等数据版本变了才联网跑一次」改成「每次启动离线扫一遍」。
         离线扫不吃网络，所以不必再挑时机；联网补抓留在「数据体检 → 重新校准」里由人点名。 */
      setTimeout(function () { try { calibrateAllLocal(); } catch (e) {} }, 1200);
      setTimeout(function () { try { renderSrcBar(); } catch (e) {} }, 900);
    } catch (e) {}
  }
    /* 空剧集本地方案（v2.7.1）：内置库补齐 / 生成占位 / 兜底引导——不依赖 Bangumi */
  AT270.fillFromLib = function () {
    var s = bySid(curSid); if (!s) return;
    if ((s.eps || []).length) { toast('已有剧集数据，无需补齐'); return; }
    var lib = (window.INTERNAL_SHOWS || []).filter(function (x) { return normTxt(x.title) === normTxt(s.title) || (s.nameJp && x.nameJp && normTxt(x.nameJp) === normTxt(s.nameJp)); })[0];
    if (!lib || !(lib.eps || []).length) { toast('内置库没有《' + (s.title || '') + '》的剧集——可点「生成第1–N集」占位，或「✎ 编辑集数」手动补'); return; }
    s.eps = JSON.parse(JSON.stringify(lib.eps));
    if (!s.total || s.total < s.eps.length) s.total = s.eps.length;
    s.updAt = Date.now(); save(); try { statInvalidate(s.sid); } catch (e) {}
    renderDetail(); toast('已从内置库补齐 ' + s.eps.length + ' 集（含中文集名）');
  };
  AT270.fillPlaceholders = function () {
    var s = bySid(curSid); if (!s) return;
    if ((s.eps || []).length) { toast('已有剧集数据，无需生成'); return; }
    var n = parseInt(s.total, 10) || 0;
    if (!n) { toast('先在「✎ 编辑集数」里填总集数，再生成占位'); return; }
    s.eps = [];
    for (var i = 1; i <= n; i++) s.eps.push({ s: i, t: '第 ' + i + ' 集' });
    s.updAt = Date.now(); save(); try { statInvalidate(s.sid); } catch (e) {}
    renderDetail(); toast('已生成 ' + n + ' 集占位——点集号可逐集补双语集名');
  };
  AT270.fillEps = function (s) {
    if (!s) return;
    if ((s.eps || []).length) { renderDetail(); return; }
    AT270.fillFromLib();
    try { var cur = bySid(curSid) || s; if (!(cur.eps || []).length) AT270.fillPlaceholders(); } catch (e) {}
  };
boot();
  /* v2.9.2：不再有「同步精简」全局开关。此处仅清理旧版遗留的 at_sync_off 标记（已在头部执行）。 */
  /* 草稿清扫（v2.7.0 复核修复）：登录/注册成功后表单消失 → 自动清理对应草稿 */
  setInterval(function () {
    try {
      var D = JSON.parse(localStorage.getItem('at_drafts') || '{}');
      var changed = false;
      var keys = Object.keys(D);
      for (var i = 0; i < keys.length; i++) {
        var mask = document.getElementById(keys[i]);
        if (!mask) continue;
        var ks = Object.keys(D[keys[i]].fields || {});
        var gone = ks.length > 0;
        for (var j = 0; j < ks.length; j++) {
          if (mask.querySelector('[id="' + ks[j] + '"]')) { gone = false; break; }
        }
        if (gone) { delete D[keys[i]]; changed = true; }
      }
      if (changed) localStorage.setItem('at_drafts', JSON.stringify(D));
    } catch (e) {}
  }, 6000);

})();

</script>
