<!-- v2.29.2 安全头收口（审计项 2 · 方案 A「最小暴露」）：
     1) connect-src 用 * 而不是域名白名单——AI 供应商 base 由用户自填（at_ai_cfg；预设 deepseek/智谱/Kimi/千问/硅基流动，
        还可能是 http://192.168.x.x:11434 这类本地 Ollama），CSP 无法动态放行任意域名，
        写成白名单会当场拦死「问 AI 加片」自动路（AI_PROVIDERS 直连 fetch）。
     2) frame-ancestors 只在 HTTP 响应头生效，写在 meta 里等于空转，已移除；
        防点击劫持要服务器侧加头（见 服务器-空闲自退.py / 托管平台响应头配置）。
     3) 仍起作用的是 script-src / object-src / form-action / base-uri / frame-src——XSS 面主要靠这几条。
     4) script-src 必须留 'wasm-unsafe-eval'：vendor/cloudbase.full.js（CloudBase SDK）会做 WebAssembly 编译，
        少了这一项账号云同步链路会被 CSP 静默拦掉（探针实测违规 script-src :: wasm-eval，页面不报错、只是功能坏）。 -->

/* v2.14.0j 局域网登录中转（免费方案，用户指令「用不了，我要免费的」）：
   CloudBase 网关按来源白名单拦跨域，HTTP 网关「跨域设置」是付费能力（个人版 19.9/月被否）。
   页面经 http://192.168.x.x 这类内网 IP 打开时（手机），把网关请求改写到本机服务器 /cb-relay，
   由服务器带白名单内 Origin（127.0.0.1:8089）转发——浏览器视角是同源，天然没有跨域。
   本机 127.0.0.1/localhost 打开时不启用，照旧直连。 */
(function(){
  try{
    var h=location.hostname;
    var lan=/^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
    if(!lan) return;
    var RX=/^https:\/\/[\w.-]+\.(tcloudbasegateway\.com|cloudbase\.net|tcloudbase\.com)(\/|$)/i;
    function via(u){ return '/cb-relay?t='+encodeURIComponent(u); }
    var _f=window.fetch;
    window.fetch=function(a,b){
      try{
        var u=(typeof a==='string')?a:(a&&a.url)||'';
        if(RX.test(u)){
          u=via(u);
          a=u;
          b=b||{};
          var hd=new Headers(b.headers||{}); hd.set('x-target',u); b.headers=hd;
        }
      }catch(e){}
      return _f.call(this,a,b);
    };
    var _o=XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open=function(m,u){
      try{ if(RX.test(u)){ arguments[1]=via(u); this.setRequestHeader('x-target',u); } }catch(e){}
      return _o.apply(this,arguments);
    };
  }catch(e){}
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('tracker-sw.js').catch(function(){}); try{ atVerCheck(); }catch(e){} });
}
/* v2.24.0+：开机自检版本——页面落后于服务端（tracker-version.json）时，置顶一条可点刷新横幅。
   解决「软件更新怎么没同步」：SW 离线回退会喂旧缓存页，用户不知要刷新；横幅一键硬刷新即可。 */
function atVerCheck(){
  try{
    fetch('tracker-version.json?_='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(v){
      if(!v||!v.version) return;
      if(String(v.version)===AT_VERSION) return; /* 已是最新，不骚扰 */
      if(document.getElementById('atVerBar')) return;
      var b=document.createElement('div'); b.id='atVerBar';
      b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;text-align:center;background:var(--accent);color:#fff;font-size:13px;line-height:1.4;padding:7px 10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)';
      b.innerHTML='发现新版本 v'+esc(String(v.version))+'，点此刷新 ↻';
      document.body.appendChild(b);
      b.onclick=function(){ location.reload(true); };
    }).catch(function(){});
  }catch(e){}
}
</script>

/* ============ 追迹 v2 · preset 11 Build 奢侈极简 ============ */
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#17150f; --muted:#6f695c; --line:#e8e3d9;
  /* v2.40.0 精修：accent #b08d4f→#a67f45（实测对比度 bg 3.45/card 3.66；原值 2.92 连大字线都不过）；
     --accent-ink=强调「文字」专用深黄铜（对 bg/card/soft 5.14~6.20 全过 4.5）——文字与装饰分家：
     border/进度条/底色继续用 accent，凡是拿 accent 当字色的地方一律改 accent-ink */
  --accent:#a67f45; --accent-ink:#7a5c28; --accent-soft:#f2e9d8; --danger:#a8552f;
  --ok:#5c7f4a; --info:#2d6a9f; --warn:#9a6420;
  /* v2.40.0 分层阴影（ambient+direct，色相朝纸底暖棕 tint，告别纯黑）；深色主题另行覆写 */
  --shadow-1:0 1px 2px rgba(80,62,32,.07),0 2px 10px rgba(80,62,32,.07);
  --shadow-2:0 1px 2px rgba(80,62,32,.16),0 8px 22px rgba(80,62,32,.18);
  --serif:Georgia,'Source Han Serif SC','Noto Serif SC',serif;
  --sans:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  /* v2.23.0 排版令牌 —— 对齐《排版-需求规格》R1/R2/R3/R5/R11 */
  --fs-display:44px; --fs-h1:34px; --fs-h2:26px; --fs-h3:20px;
  --fs-lg:16px; --fs-body:14px; --fs-meta:12px; --fs-micro:10px;
  --lh-display:1.2; --lh-h1:1.25; --lh-h2:1.35; --lh-h3:1.5;
  --lh-lg:1.6; --lh-body:1.75; --lh-meta:1.7; --lh-micro:1.6;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px; --sp-20:80px;
  --r-1:4px; --r-2:8px; --r-3:12px; --r-4:16px; --r-pill:999px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
.wrap{max-width:560px;margin:0 auto;padding:0 24px 64px;min-height:100vh}

.top{padding:32px 0 8px;display:flex;align-items:flex-end;justify-content:space-between}
.brand{font-family:var(--serif);font-size:var(--fs-h1);font-weight:300;letter-spacing:6px;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:8px;font-weight:400}
.topbtn{background:none;border:1px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.topbtn svg{width:17px;height:17px}
.topbtn:active{background:var(--accent-soft)}
.filter{display:flex;gap:20px;padding:24px 0 8px;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.fbtn{background:none;border:none;font-size:14px;color:var(--muted);font-weight:400;padding:4px 0 12px;position:relative;white-space:nowrap;min-height:44px}
.fbtn.on{color:var(--ink);font-weight:600}
.fbtn.on:after{content:'';position:absolute;left:0;right:0;bottom:4px;height:2px;background:var(--accent)}
/* v2.14.0 主列表 AniList 混合风：海报主视觉 + hover 行尾操作钮 + 封面墙双视图 */
.show{display:flex;gap:20px;padding:16px;border-bottom:1px solid var(--line);align-items:flex-start;border-radius:12px;transition:background .15s}
.show:hover{background:var(--card)}
.show img{width:96px;height:135px;object-fit:cover;border-radius:8px;background:var(--accent-soft);flex:none;box-shadow:0 2px 10px rgba(0,0,0,.14);image-rendering:-webkit-optimize-contrast;image-rendering:pixelated}
.show .info{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;min-height:135px}
.show .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show .s{font-size:var(--fs-meta);color:var(--muted);letter-spacing:.5px;margin-top:4px}
.show .progline{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:12px}
.show .prog{flex:1;height:3px;background:var(--line);border-radius:var(--r-1);overflow:hidden}
.show .prog i{display:block;height:100%;background:var(--accent)}

.show:hover .acts,.show:focus-within .acts{opacity:1}

.abtn{width:36px;height:36px;border-radius:var(--r-2);border:1px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.abtn:hover{border-color:var(--accent);color:var(--accent)}

/* v2.21.0 封面墙收口：海报一像素不遮（动作走右上角一枚 ⋮），进度压在海报底沿，元信息退回列表视图 */
.cards.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:20px 12px;padding:8px 0}

.cards.grid .show:hover{background:none}
.gp{position:relative;display:block;border-radius:var(--r-3);overflow:hidden;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:pointer}

.gmore{position:absolute;top:4px;right:4px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border:none;background:none;color:#fff;cursor:pointer;opacity:0;transition:opacity .15s}

.gmore svg{position:relative;width:15px;height:15px}
.gmore:hover:before{background:rgba(24,19,12,.8)}
.cards.grid .show:hover .gmore,.cards.grid .show:focus-within .gmore{opacity:1}
.gt{display:flex;align-items:baseline;gap:8px;padding:8px 2px 0;cursor:pointer}
.gt .gtn{flex:1;min-width:0;font-size:var(--fs-meta);font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .gn{flex:none;font-family:var(--serif);font-size:var(--fs-meta);color:var(--muted)}
.gt .gn b{font-weight:600;color:var(--ink)}
.vbtn{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px!important;padding:8px 12px!important;border:1px solid var(--line);border-radius:16px!important;min-height:32px!important}
.vbtn:after{display:none!important}
.vbtn svg{width:14px;height:14px}
/* v2.14.0b 片内搜索：与状态筛选同行的标题过滤框（静态节点，不随 renderFilter 重建，避免打字丢焦点） */

.lq{flex:none;width:180px;background:none;border:1px solid var(--line);border-radius:16px;color:var(--ink);font-size:12px;padding:8px 12px;outline:none;min-width:0}

.hero{display:flex;gap:20px;padding:24px 0 20px}

   原来「⟳ 一键拉封面」是颗带字的胶囊，横向吃掉一百多像素、常驻在筛选条下面，
   而它几个月才点一次；豆瓣进自动源之后它更只剩「强制重拉」这一个用途。
   34 是手机档触点下限（phone-look 那条门禁按 <34 判红），别再往下压。 */
.srcchip.ico{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;min-width:34px;min-height:34px}
.srcchip.ico svg{width:15px;height:15px;flex:none;display:block}
/* 名字得留着（读屏要念、C08/M06 两条门禁按 textContent 取词），但不能占版面。
   标准视觉隐藏写法：千万别改成 display:none / visibility:hidden，那等于把入口也一起藏了。 */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.srchint{font-size:10px;color:var(--muted);letter-spacing:.5px}
.eprow .ty{cursor:pointer}
.eprow .ty.ty-filler{color:var(--danger);border-color:#e8c8b0}
.eprow .ty.ty-semi{color:#c07b2d;border-color:#ecd5ae}
.eprow .ty.ty-canon{color:#2d6a9f;border-color:#c3d8ee}
.eprow .ty.ty-unknown{color:var(--muted);border-style:dashed}
.eprow .ty.ty-movie{color:#6a5acd;border-color:#cfc8ef}
.srccov{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:var(--fs-meta);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-3);padding:8px 12px;margin:0 0 12px;background:var(--card);line-height:1.75}
.srccov b{color:var(--ink);font-weight:600}
.srccov .lnk{color:var(--accent);cursor:pointer;margin-left:auto;white-space:nowrap;font-weight:600}
/* v2.14.0 极简单屏：账号面板底部一行「本地备份：导出 · 导入」 */
.acctbk{display:flex;align-items:center;gap:8px;margin:16px 0 2px;padding-top:12px;border-top:1px solid var(--line)}
.acctbk .lnk{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 0;cursor:pointer}
.acctbk .sep{color:var(--muted);font-size:12px}
/* v2.44.2：账号面板每一行统一成「标签 · 按钮 · 说明」三段。
   改之前这四行是四种长相：豆瓣那行按钮后面拖着说明、「手机版App」那行后面也拖着说明、
   封面来源那行后面是空的、本地备份是两个按钮加一个分隔点—— 摆在一起看，
   后两行的说明文字长短不一，读起来不像一组（用户令：「账号哪个框的 UI 跟其他不统一」）。
   规则只定结构、不定内容：
     ① 标签（.mini）固定在最左；
     ② 按钮（.lnk）紧随其后，个数随功能（本地备份本来就是两个，不强塞成一個）；
     ③ 说明统一收进.acctbk .note，并且 `margin-left:auto` 把它推到行尾——
        这样长短不一的说明一律右对齐，视觉重量落在同一条竖线上，就是一组了。
   没有说明的行不必补空占位：右对齐在没有内容时天然成立。 */
.acctbk .note{color:var(--muted);font-size:12px;margin-left:auto;line-height:1.5}
.syrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sybtn{border:1px solid var(--line);background:none;border-radius:var(--r-2);padding:12px 16px;font-size:12px;color:var(--muted);min-height:38px}
.sybtn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.sybtn.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sybtn:disabled{opacity:.45}
.sybtn.sm{padding:8px 12px;font-size:var(--fs-meta);border-radius:8px;min-height:32px}
/* ===== v2.14.0：账号面板「登录 / 注册」单屏切换（去 Tab）=====
   默认只显示登录表单，底部一行「还没有账号？注册」点开注册；注册页可切回。 */
.cbpane label{display:block;font-size:var(--fs-meta);color:var(--muted);margin:12px 0 4px;letter-spacing:.02em}
.cbpane label:first-of-type{margin-top:0}
.cbpane input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r-3);background:var(--card);color:var(--ink);font:14px/1.5 var(--sans);padding:12px 12px;outline:none;min-height:44px;transition:border-color .15s}
.cbpane input:focus{border-color:var(--muted)}
.cbpane input::placeholder{color:var(--muted);opacity:.7}
/* 顶部状态条：刷新续用注册时在表单最上方说明「还差一步」，
   位置比塞在验证码框下面更醒目，也更符合「进度提示」的语义。 */
.cbnotice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-3);padding:12px 12px;font-size:12px;line-height:1.6;color:var(--ink);margin:0 0 4px}
.cbnotice b{color:var(--accent);font-weight:700}
/* 验证码 + 获取按钮同一行 */
.cbcode{display:flex;gap:8px}
.cbcode input{flex:1;min-width:0}
.cbcode .cbget{flex:none;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:var(--r-3);padding:0 16px;font:600 12px/1 var(--sans);min-height:44px;white-space:nowrap;transition:opacity .15s}
.cbcode .cbget:disabled{opacity:.5;border-color:var(--line);background:none;color:var(--muted)}
/* 账号屏底部那两颗链接（注册 / 重设密码）是自助路唯一的入口，
   裸文字只有 22×15px——手机拇指按不中就等于功能不存在，所以给足触点再排成一行。 */
.cbfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;margin-top:12px;
  font-size:12px;color:var(--muted);text-align:center}
.cbfoot a{display:inline-flex;align-items:center;justify-content:center;min-width:56px;min-height:36px;
  padding:0 12px;color:var(--accent);font-weight:600;text-decoration:none}
.cbfoot .cbdot{color:var(--line);padding:0 2px}
/* ===== v2.42.0 记住登录 =====
   上面 .cbpane label 是「字段说明」的样子（灰、小、块级），而「记住登录」是一条
   **可点的开关**——照抄那条规则会得到一个灰色的、看起来不像能点的标签。
   所以整条覆写：字色回到正文色、改成行内、勾子本身要压回 16px（否则会被
   input{width:100%;min-height:44px} 拉成一条横贯全屏的怪东西）。 */
/* 整条 label 就是点击区，高度按手机可点区门禁（≥34px）给到 36，别做成一条细缝 */
.cbpane label.cbrem{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:2px 0;
  font-size:var(--fs-body);color:var(--ink);cursor:pointer;min-height:36px}
.cbpane label.cbrem input[type=checkbox]{width:16px;height:16px;min-height:0;flex:none;margin:0;
  padding:0;accent-color:var(--accent);cursor:pointer}
.cbnote{margin:-2px 0 10px;line-height:1.55}
/* ===== v2.12.0：右键 / 长按菜单 =====
   设计要点：不用原生右键（原生会把「另存为图片」等系统菜单也带出来），
   自绘一个轻量菜单；移动端用长按（500ms）触发，同一套逻辑。 */
.ctxmenu{position:fixed;z-index:9999;min-width:172px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px;box-shadow:0 10px 34px rgba(0,0,0,.28);opacity:0;transform:scale(.96);
  transition:opacity .11s ease,transform .11s ease;pointer-events:none}
.ctxmenu.on{opacity:1;transform:scale(1);pointer-events:auto}
.ctxmenu .ctxhd{padding:8px 12px 8px;font-size:var(--fs-meta);color:var(--muted);border-bottom:1px solid var(--line);
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.ctxmenu .ctxi{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;
  text-align:left;padding:12px 12px;border-radius:8px;font-size:var(--fs-body);color:var(--ink);min-height:42px;
  transition:background .12s}
.ctxmenu .ctxi:hover,.ctxmenu .ctxi:focus{background:var(--accent-soft);outline:none}
.ctxmenu .ctxi .ic{font-size:14px;width:18px;text-align:center;flex:none;opacity:.85}
.ctxmenu .ctxi .k{flex:none;font-size:10px;color:var(--muted);border:1px solid var(--line);
  border-radius:var(--r-1);padding:1px 4px;margin-left:auto}
.ctxmenu .ctxi.dg{color:var(--danger)}
.ctxmenu .ctxi.dg:hover{background:rgba(168,85,47,.10)}
.ctxmenu .ctxsep{height:1px;background:var(--line);margin:4px 4px}
/* 可右键的卡片给一点暗示（桌面端才显示 hover 提示） */
@media (hover:hover){
  .show.ctxable,.srrow.ctxable,.eprow.ctxable{cursor:context-menu}
}
html[data-theme=dark] .ctxmenu{box-shadow:0 12px 40px rgba(0,0,0,.72)}
html[data-theme=dark] .ctxmenu .ctxi.dg:hover{background:rgba(208,112,74,.14)}
.ledger{margin-top:4px}
.lgrow{border-bottom:1px dashed var(--line);padding:8px 0;font-size:12px}
.lgrow .lg1{display:flex;justify-content:space-between;gap:8px;cursor:pointer;align-items:baseline}
.lgrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgrow .r{flex:none;font-size:var(--fs-meta);color:var(--muted);white-space:nowrap}
.lgrow .r .ok{color:var(--ok)}.lgrow .r .er{color:var(--danger)}
.lgdet{display:none;padding:8px 0 4px}
.lgdet.open{display:block}
.lgitem{font-size:var(--fs-meta);color:var(--muted);padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.lgitem .e{color:var(--danger);max-width:55%;text-align:right}
.srcopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.srcopt{border:1px solid var(--line);border-radius:var(--r-3);background:var(--card);padding:12px 4px;font-size:12px;color:var(--muted);min-height:44px}
.srcopt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.rangeline{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:8px 0;flex-wrap:wrap}
.rangeline input{width:64px;border:none;border-bottom:1px solid var(--line);background:none;font-size:var(--fs-body);text-align:center;color:var(--ink);padding:4px 0}
.verline{font-size:10px;color:var(--muted);letter-spacing:1px;text-align:center;padding:16px 0 4px}
.verline .warn{color:var(--danger);font-weight:600}
/* ===== 批次R：手机端走查修正（393×851 触屏实测，tests/phone-look.js 九屏截图） =====
   判据一律用 hover:none / max-width，桌面版式一个像素都不动。 */
@supports(padding:max(0px)){
  /* 壳走的是 edge-to-edge + 刘海短边布局（MainActivity 里 LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES），
     页面原先只补了底部：真机状态栏一划出来就压在「追迹 / ANITRACKER」这行上 */
  .top{padding-top:max(34px,calc(env(safe-area-inset-top) + 20px))}
  .panel{padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 16px))}
  #toast{bottom:max(34px,calc(env(safe-area-inset-bottom) + 14px))}
}
/* 10px 在 2.75DPR 的手机上约等于 3.5 毫米字高，读着费劲；装饰性字标 .brand small 保留原样 */
.stat span,.srchint,.part .py,.eprow .ty,.eprow .no .rw{font-size:var(--fs-meta)}
.verline{font-size:var(--fs-meta);letter-spacing:.5px}
.fcnt,.type-tag{font-size:var(--fs-meta)}
.ep small{font-size:10px;letter-spacing:0}
@media(max-width:520px){
  /* 搜索框和筛选条抢同一行时，「看完」「弃」被挤到屏外——让搜索框自己占一行 */
  .frow{flex-wrap:wrap;gap:12px}
  .frow .filter{flex:1 1 auto;gap:16px;flex-wrap:wrap;overflow:visible}
  .lq{flex:1 1 100%;width:auto;order:2}
}
@media(hover:none){
  /* 20~30px 的可点区在手机上就是按不中，一律抬到 38 以上；外观仍走现成的胶囊语汇，不新开样式 */
  .ty,.srcchip{min-height:38px;padding:8px 16px;font-size:12px}
  .vbtn{min-height:38px!important}
  .fbtn{padding-left:12px;padding-right:12px}
  /* 集号本身是个「点开可编辑」的独立按钮，嵌在整行的「标记已看」里：17px 高只会误触 */
  .eprow .no{display:flex;align-items:center;justify-content:flex-end;min-height:40px;min-width:44px}
  .histchip{min-height:36px;padding:8px 16px}
  .scrlbtn{width:38px;height:38px}
  .acctbk{gap:12px;flex-wrap:wrap}
  .acctbk .lnk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 16px;min-height:38px}
  /* v2.44.2：按钮在手机档变方框并换行，说明文字这时候 `margin-left:auto` 会把它甩到行尾、
     和按钮之间拉出一段空白，读着更散。小屏改成「占满整行、跟在按钮下面」：
     `flex-basis:100%` 强制换行，宽度自撑满，缩进对齐到按钮左缘。 */
  .acctbk .note{flex-basis:100%;margin-left:0}
  .dbn-row{min-height:60px}
  .dbn-q,.dbn-file{min-height:38px}
  /* v2.31.0：面板主按钮（导入/推送）原先漏在小屏触点规则外，实测 393 宽下只有 19px 高。
     推送一次要连点几十条，19px 的按钮在小屏上点不准比什么都劝退 —— 和 .dbn-q 同规格补齐。 */
  .dbn-foot .b1{min-height:38px;padding:8px 16px}
  .timline .lnk{min-height:38px;padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  .acctbk .sep{display:none}
  /* 面板右上角的 × 全是 h3 的紧邻兄弟，一条选择器覆盖 11 个浮层，不必逐个加类 */
  .panel h3+button{width:44px;height:44px;margin:-8px -12px 0 0;display:flex;align-items:center;justify-content:center}
  .ratebtn{display:inline-block;padding:12px 8px;margin:-12px -8px}
  #cbToReg{display:inline-block;padding:12px 8px}
  /* 手机触屏档：hover 不存在，⋮ 只能常显并抬到 38；海报密排三列，一屏扫九张 */
  .cards.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}
  .gmore{opacity:1;width:38px;height:38px;top:2px;right:2px}
  .gmore:before{width:26px;height:26px}
  .gmore svg{width:16px;height:16px}
  .gt .gtn{font-size:12px}
  /* 手机实测：26 部的片单有 6 屏长，往下滚一点「＋添加」就跑出屏幕，想加片得一路滑回顶。
     解法是右下角那颗拇指可及的悬浮「＋」（见 #fabAdd），不做吸顶筛选条：
     393 宽下筛选标签要占两行，连搜索框一起吸顶就是永久 161px、占掉 19% 屏幕，第二行还只剩「弃 0」，得不偿失。
     全在 hover:none 内，桌面一条都不吃。 */
  /* 底部留给悬浮钮，别让最后一行片卡藏在它下面 */
  .wrap{padding-bottom:max(96px,calc(env(safe-area-inset-bottom) + 84px))}
  /* 整幅的「从片单移除」实测 43px，是全页最不可逆的一颗，抬到 44 */
  #delBtn{min-height:44px}
  /* 点开一部番，主操作是「标记下一集」。v2.21 曾把工具条整体折到剧集列表之后保首屏，
     v2.28.0 用户令：「重拉封面/本地封面/AI 导入这些不要放在最后的界面」——改成精确重排：
     下一集仍守首屏（hero→状态→分季→下一集），工具条紧跟其后不再沉底；
     剧集网格和「从片单移除」仍收在最后。DOM 一行不动，桌面顺序照旧。 */
  #vDetail{display:flex;flex-direction:column}
  #vDetail>.back{order:0}
  #vDetail>.hero{order:1}
  #vDetail>.strow{order:2}
  #vDetail>.timline{order:2}
  #vDetail>.cnpline{order:2}
  #vDetail>.cnpblock{order:2}
  #vDetail>#dParts{order:3}
  #vDetail>.quickrow{order:4}
  #vDetail>.dtools{order:5}
  #vDetail>.statgrid{order:6}
  #vDetail>.durline{order:7}
  #vDetail>.filmpos{order:8}
  #vDetail>#dSrcCov{order:9}
  #vDetail>.searchrow2{order:10}
  #vDetail>.typerow{order:11}
  #vDetail>.seclabel{order:12}
  #vDetail>#dGroups{order:13}
  #vDetail>#delBtn{order:14}
  #vDetail>div:last-child{order:99}
  #vDetail>#dMoreBtn{order:5}
  /* v2.35.0：管理箱恢复了，但它在 #vDetail 的 flex 里没有 order，会落到第 0 位顶在片名上方。
     给它一个明确位置：排在「从片单移除」之后、页尾留白之前（order 14 与 99 之间）。 */
  #vDetail>#at270Box{order:15}
  /* v2.34.0 手机只留追剧：低频工具从主路拿走（收进「⋯ 更多工具」抽屉，见 openDTools），
     抽屉里还是那批按钮本身，不是第二套界面；它仍排在「标记下一集」后面，没有沉到页尾。 */
  #vDetail>.dtools{display:none}
  #dMoreBtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;
    margin:-6px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-3);
    color:var(--muted);font-size:var(--fs-meta);letter-spacing:1px}
  #dMoreBtn:active{border-color:var(--accent);color:var(--accent)}
  #dToolsMask .ty{flex:1 1 40%;min-height:48px;display:flex;align-items:center;justify-content:center}
  /* 统计四卡压成一行文字（数字留着，卡片壳子去掉），时长条同样只留字 */
  .statgrid{display:flex;flex-wrap:wrap;gap:2px 14px;margin:2px 0 6px}
  .statgrid .stat{flex:0 0 auto;display:flex;align-items:baseline;gap:5px;min-height:0;padding:0;text-align:left;background:none;border:none}
  .statgrid .stat b{display:inline;font-size:var(--fs-body)}
  .statgrid .stat span{font-size:var(--fs-meta)}
  .durline{border:none;background:none;padding:0;margin:0 0 10px;line-height:1.6}
  /* 加片页这一屏只剩一个动作：那颗「搜索」实测 36×42（两个汉字挤到边框），抬到 44 见方 */
  .searchrow button{min-width:44px;min-height:44px;font-size:15px;padding:0 10px}
  /* v2.35.0（用户令「漫改这些恢复原来的」）：片单页的来源筛选条与类型行、
     详情页的类型行、集级「改来源标注」长按项，v2.34.0 都按输入能力从手机上拿掉了。
     这一版全部撤回——分档只保留「低频工具进抽屉」「统计压成一行」「加片页只留搜索框」
     这三条真正减负的，漫改/来源这条轴不再参与分档。
     下面不留任何 display:none：撤干净了才叫恢复，留一条空规则只会让人以为还在生效。 */
}
/* 悬浮添加钮：默认不存在于桌面（desktop 由这条 display:none 挡着，只在触屏下由 JS 决定何时露面） */
#fabAdd{display:none}
@media(hover:none){
  #fabAdd{display:flex;position:fixed;right:16px;z-index:40;
    bottom:max(18px,calc(env(safe-area-inset-bottom) + 14px));

/* 手机实测出的规矩：toast 只有一条，后台自动任务（静默补封面、启动自动校准）曾经把
   用户刚点出来的回执顶掉——「已看到第 6 集」半路变成「已自动补齐 6 部封面」。
   所以后台播报一律让位：此刻正给用户看东西就不插话。用户自己触发的消息照常覆盖。 */
function toast(m,prio){ var t=document.getElementById('toast');
  if(prio==='bg'&&t.classList.contains('on')) return;
  t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2200); }
/* 悬浮添加钮的出场时机：只在触屏、只在片单视图、且往下滚过 0.9 屏之后。平时不露面，不占视线。 */
function fabSync(){
  var f=document.getElementById('fabAdd'); if(!f) return;
  var listOn=document.getElementById('vList').style.display!=='none';
  var on=listOn&&window.scrollY>window.innerHeight*0.9
    &&window.matchMedia&&window.matchMedia('(hover:none)').matches;
  f.classList[on?'add':'remove']('on');
}
window.addEventListener('scroll',fabSync,{passive:true});
window.addEventListener('resize',fabSync);
/* v2.13.0 错误留痕：数据类应用最怕「吞错不上报」。环形日志 at_errlog（最近100条）+ 控制台，
   账号面板「同步日志」下方可查看；同步/保存链路的空 catch 全部接进来。 */
function atErr(where,e){
  try{ var L=rd('at_errlog',[]); if(!Array.isArray(L)) L=[];
    var wkey=String(where||'');
    var now=Date.now();
    /* v2.29.2 去重抑制：同一 where 在 60s 内只记 1 条,死循环也不会淹没 100 条环形日志 */
    var last=L[L.length-1];
    if(!(last&&last.w===wkey&&now-(last.t||0)<60000)){
      L.push({t:now,w:wkey,m:String((e&&(e.message||e))||'').slice(0,300)});
      if(L.length>100) L=L.slice(-100);
      localStorage.setItem('at_errlog',JSON.stringify(L));
    }
    /* v2.29.2 当日快统：60s 内 ≥5 个不同源报错则置 at_unhealthy=1（CI/账号面板可轮询） */
    window.__atErrWindow=window.__atErrWindow||[];
    var win=window.__atErrWindow;
    win.push({t:now,w:wkey});
    win=win.filter(function(x){ return now-x.t<60000; });
    window.__atErrWindow=win;
    var uniq={}; win.forEach(function(x){ uniq[x.w]=1; });
    var n=Object.keys(uniq).length;
    if(n>=5){ try{ localStorage.setItem('at_unhealthy',String(now)); }catch(x){} }

/* v2.36.0：单集标记时间戳（s.epT[集号]=毫秒）。v2.35.0 漫改进度行的时间只能给「全剧」，

/* ===== v2.30.0 观看时间账：开始看 / 看完 =====
   两个来源：本机操作（From='me'）与豆瓣标记日期（From='db'，精确到天）。
   「豆瓣优先」只作用在导入那一刻——本机动作一律只在字段为空时填，绝不覆盖豆瓣给的值；
   反过来豆瓣再拉一次也不覆盖本机记下的。手改（详情页「改时间」）把来源改写成 me。 */
function fmtDay(ms){
  if(!ms) return '';
  var d=new Date(+ms); if(isNaN(d.getTime())) return '';
  var p=function(x){ return x<10?('0'+x):(''+x); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function parseDay(str){
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(str||'').trim());
  if(!m) return 0;
  var d=new Date(+m[1],(+m[2])-1,+m[3],12,0,0,0);
  if(d.getFullYear()!==+m[1]||d.getMonth()+1!==+m[2]||d.getDate()!==+m[3]) return 0;

}
function dayDiff(a,b){ if(!a||!b||b<a) return 0; return Math.floor((b-a)/86400000); }
function stampStart(s,ms,from){ if(!s||s.tStart) return; s.tStart=ms||Date.now(); s.tStartFrom=from||'me'; }
function stampDone(s,ms,from){ if(!s||s.tDone) return; s.tDone=ms||Date.now(); s.tDoneFrom=from||'me'; }
function clearDoneStamp(s){ if(s&&s.tDone&&s.tDoneFrom==='me'){ delete s.tDone; delete s.tDoneFrom; } }
/* 详情页那一行：没记过时间的条目整行不出现，不占位 */
function timeLineHtml(s){

  if(s.tDone) out.push('看完 <b>'+fmtDay(s.tDone)+'</b>'+(s.tDoneFrom==='db'?'<span class="src">豆瓣</span>':''));
  var days=(s.tStart&&s.tDone&&s.tDone>=s.tStart)?dayDiff(s.tStart,s.tDone):0;
  if(days>0) out.push('用时 <b>'+days+'</b> 天');

function editWatchTime(sid){

  uiDialog({ title:'观看时间 · '+s.title,

      if(parseDay(v.st)&&parseDay(v.dn)&&parseDay(v.dn)<parseDay(v.st)) return '看完时间早于开始看时间，改一下';

    },

    }});

/* ===== v2.3 来源判定器（唯一口径；v2.4.2 起无系列级摊派）=====
   优先级：人工标注 > 标题【动画原创】 > 显式数据 > 校准区间 > 待核 */
function srcInfoOf(s,e){
  if(!e) return {src:'unknown',by:'none',note:''};
  if(e.src==='canon'||e.src==='filler'||e.src==='semi') return {src:e.src,by:(e.srcNote==='AI 导入'||e.srcNote==='AI 导入（其余按漫改）')?'ai':'manual',note:e.srcNote||''};
  var tt=String(e.t||'');
  if(tt.indexOf('【动画原创】')>=0) return {src:(e.type==='semi'?'semi':'filler'),by:'title',note:''};
  if(e.type==='filler'||e.type==='semi'||e.type==='movie') return {src:e.type,by:'data',note:''};
  if(s&&(s.filler||s.mixed)){
    if(inRangeList(s.filler,e.s)) return {src:'filler',by:'calib',note:'AFG 校准区间'};
    if(inRangeList(s.mixed,e.s)) return {src:'semi',by:'calib',note:'AFG 校准区间'};
    return {src:'canon',by:'calib',note:'AFG 校准（区间外）'};
  }
  return {src:'unknown',by:'none',note:''};
}
function epTypeOf(s,e){ return srcInfoOf(s,e).src; }
/* 「原创集」这条轴只对动画成立。kind 是加入片单时从全网库带来的类型（动画 / 真人剧 / 英语剧…），
   旧数据没有这个字段的一律按动画处理（本来的用户群就是番剧）。 */
function fillerAxisApplies(s){ var k=String((s||{}).kind||''); return !k||k==='动画'; }
function srcDisplayName(k){ return TYPE_NAME[k]||'待核'; }
function srcBasisText(s,e){
  var inf=srcInfoOf(s,e);
  var by={manual:'人工标注',ai:'AI 导入',title:'标题含【动画原创】',data:'标注数据',calib:'AFG 校准',none:'暂无依据'}[inf.by]||inf.by;
  return srcDisplayName(inf.src)+(inf.note?('（'+inf.note+'）'):'')+' · 判定依据：'+by+' · 点击修改';
}
/* v2.17.0：多季作品（老友记这类真人剧整部 200+ 集）按「当前季」过滤卡片。
   集号 s 仍是整部剧的连续序号，所以标记/统计不受切季影响；无 sn 的旧数据不启用。 */
function seasonKeyOf(s){
  if(!s||!(s.parts||[]).length||s.parts.length<2) return null;
  var k=String(s.curPart||''); if(!/^S\d+$/.test(k)) return null;
  if(!(s.eps||[]).some(function(e){ return Number(e.sn)>0; })) return null;
  return k;
}
function visEps(s){
  var list=(s.eps||[]);
  var kp=seasonKeyOf(s);
  if(kp) list=list.filter(function(e){ return 'S'+(Number(e.sn)||1)===kp; });
  if(!anyHide()) return list; return list.filter(function(e){ return !isHiddenSrc(srcInfoOf(s,e).src); });
}
function nextUnwatched(s){ var list=visEps(s); for(var i=0;i<list.length;i++){ if(epStat(s,list[i].s)===null) return list[i].s; } return null; }
var _statCache={};
function statInvalidate(sid){ try{ delete _statCache[String(sid)]; }catch(e){} }
function statOf(s){
  if(!s) return null;
  var sig=(s.updAt||0)+'|'+(HIDE_SRC.filler?1:0)+(HIDE_SRC.semi?1:0)+'|'+((s.eps||[]).length)+'|'+(s.filler||'')+'|'+(s.mixed||'')+'|'+(s.pos||0);
  var c=_statCache[String(s.sid)];
  if(c&&c.sig===sig) return c.data;
  var list=(s.eps||[]);
  var cov={canon:0,filler:0,semi:0,movie:0,unknown:0,total:list.length};
  var visN=0, hidden=0, w=0, r=0;
  list.forEach(function(e){
    var k=srcInfoOf(s,e).src; if(cov[k]==null) k='unknown'; cov[k]++;
    if(isHiddenSrc(k)){ hidden++; return; }
    visN++;
    var v=(s.statuses||{})[e.s];
    if(v==='watched') w++; else if(v==='rewatch') r++;
  });
  var total,watched;
  if(!list.length){
    total=s.total||0; watched=0;
    for(var kk in (s.statuses||{})){ if(s.statuses[kk]==='watched') watched++; }
  } else { total=visN; watched=w; }
  /* v2.19.1 电影部分进度：一集＝一整部片，「看到一半」不是第几集而是百分之几（s.pos 0–100）。
     集没标 watched 但 pos 记了 45% → 进度按 45% 走；标了看完就回到 100%。 */
  var pos=filmPosOf(s);
  var pct=total?Math.min(100,Math.round((watched/total)*100)):0;
  if(pos>pct) pct=pos;
  var data={vis:visN,hidden:hidden,watched:watched,rewatch:r,unwatched:Math.max(0,total-watched),total:total,
            pct:pct,pos:pos,cov:cov,hasEps:!!list.length};
  _statCache[String(s.sid)]={sig:sig,data:data};
  return data;
}
function srcCovLine(cov){
  if(!cov||!cov.total) return '无剧集数据';
  var parts=[];
  if(cov.canon) parts.push('漫改 '+cov.canon);
  if(cov.filler) parts.push('TV原创 '+cov.filler);
  if(cov.semi) parts.push('半原创 '+cov.semi);
  if(cov.movie) parts.push('剧场版 '+cov.movie);
  parts.push('待核 '+cov.unknown);

/* ===== v2.19.1 时长统计（用户指令「一集多久 / 看完一季多少小时 / 看完全剧多少小时」）=====
   runtime 只有全网库那条路带得回来（ep.dur）；内置库/AI 导入的老数据没有时长，
   这时按 kind 估：真人剧 45 分、剧场版/电影 100 分、动画 24 分——所以估算时文案带「约」。 */
/* v2.44.6：「按什么估」得说得出名字。以前 defDurMin 里三个数字、界面上只写
   「按类型估」，用户指着《大宋提刑官》那行问「24 分钟哪来的」——答不上来也改不了。
   现在类别与分钟数从这一个函数出，界面照它报（门禁断言界面那句里的数字 == defDurMin）。 */
function defDurKind(s){
  s=s||{};
  if(/剧场版|电影|Movie|Film/i.test(String(s.kind||'')+' '+String(s.type||''))) return {n:'剧场版',m:100};
  if(/剧$/.test(String(s.kind||''))) return {n:'真人剧',m:45};   /* 真人剧 / 英语剧 / 韩剧… */
  return {n:'',m:24};   /* 压根没格式信号（豆瓣联想/手动建档）：只报档位，不冒充「动画」 */
}
/* 估档那句话只有一个出口：界面、弹窗说明、toast 都从这里取，不许各自拼一遍 */
function durEstTxt(s){
  var k=defDurKind(s);
  return k.n ? ('按'+k.n+'估 '+k.m+' 分/集') : ('没标类型，按最低档估 '+k.m+' 分/集');
}
function defDurMin(s){
  s=s||{};
  /* v2.20.0：AniList 直接带 duration（单集分钟，真值）。有时长就用真值，
     下面那套「按类型估」只在真的没有数据时才兜底（否则时长账会白估一整部）。
     v2.44.6：真值不再只有 AniList 一条路——详情页「✎ 改」填的就是它（s.epDur）。 */
  var _ed=Number(s.epDur)||0;
  if(_ed>0&&_ed<=600) return Math.round(_ed);
  return defDurKind(s).m;
}
/* 电影＝整条只有一个片子（total/eps 都 ≤1）：进度是「看到哪一分钟」而不是「第几集」 */
function isFilmEntry(s){
  s=s||{};
  var t=Number(s.total)||0, n=(s.eps||[]).length;
  if(/剧场版|电影|Movie|Film/i.test(String(s.kind||'')+' '+String(s.type||''))) return t<=1;
  return t>0 && t<=1 && n<=1;
}
function epDurMin(s,e){
  var d=Number((e||{}).dur)||0;
  return d>0?d:defDurMin(s);
}
/* ===== v2.19.1 电影部分进度（用户指令「看电影看到一半也要标记出来」）=====
   电影只有一条 eps，集级状态非 0 即 100，装不下「看到 45 分钟」。所以另开 s.pos（0–100）：
   集标了 watched → 一律 100%；否则按 s.pos 报进度。非电影条目恒 0（不受影响）。 */
function filmPosOf(s){
  s=s||{};
  if(!isFilmEntry(s)) return 0;
  var st=(s.statuses||{})[1]||(s.statuses||{})['1'];
  if(st==='watched'||st==='rewatch') return 100;
  var p=Math.round(Number(s.pos)||0);
  return p<0?0:p>100?100:p;
}
function setFilmPos(p){
  var s=bySid(curSid); if(!s) return;
  if(s.pv){ toast('预览模式：先点上方「＋ 加入片单」即可标记进度'); return; }
  p=Math.round(Number(p)||0); p=p<0?0:p>100?100:p;
  if(!s.statuses) s.statuses={};
  if(p>=100){ s.statuses[1]='watched'; stampEpT(s,1); delete s.pos;
    if((s.status||'watching')==='want') s.status='watching';
    statInvalidate(s.sid); s.updAt=Date.now(); save(); renderDetail();
    toast('《'+s.title+'》标记看完'); return; }
  if(p<=0){ delete s.pos; if(s.statuses[1]){ delete s.statuses[1]; clearEpT(s,1); }
    statInvalidate(s.sid); s.updAt=Date.now(); save(); renderDetail();
    toast('已清除《'+s.title+'》的进度'); return; }
  if(s.statuses[1]){ delete s.statuses[1]; clearEpT(s,1); }   /* 半途进度与「第 1 集已看」互斥 */
  s.pos=p;
  if((s.status||'watching')==='want') s.status='watching';
  statInvalidate(s.sid); s.updAt=Date.now(); save(); renderDetail();
  toast('《'+s.title+'》看到 '+p+'%（约 '+fmtDur(Math.round((Number(durOf(s).total)||0)*p/100))+'）');
}
/* 详情页里那条「看到哪了」进度条（只对电影条目出现） */
function renderFilmPos(){
  var box=document.getElementById('dFilm'); if(!box) return;
  var s=bySid(curSid);
  if(!s||!isFilmEntry(s)){ box.style.display='none'; box.innerHTML=''; return; }
  var p=filmPosOf(s), total=Math.round(Number(durOf(s).total)||0);
  var mins=Math.round(total*p/100);
  var chips=[25,50,75,100].map(function(x){
    return '<button class="fpc'+(p===x?' on':'')+'" onclick="setFilmPos('+x+')">'+(x===100?'看完':x+'%')+'</button>';
  }).join('');
  box.innerHTML='<div class="fpbar"><span class="fplab">看到哪了</span>'+
    '<b class="fpv">'+(p?(p>=100?'已看完':p+'%'):'还没开始')+'</b>'+
    (p&&p<100&&total?('<span class="fpm">约 '+fmtDur(mins)+' / '+fmtDur(total)+'</span>'):'')+
    '<span class="fpchips">'+chips+(p?'<button class="fpc clr" onclick="setFilmPos(0)">清除</button>':'')+'</span></div>'+
    '<div class="fptrack"><i style="width:'+p+'%"></i></div>';

function fmtDur(min){
  min=Math.round(Number(min)||0);

/* 季度卡片上要塞下「24集 · 9.6小时」这种短格式，用一位小数的小时数 */
function fmtDurShort(min){
  min=Math.round(Number(min)||0);
  if(min<=0) return '';
  if(min<60) return min+'分';
  var h=min/60;

}
/* 整部（含各季）的时长账：total 全剧、seasons 按季、watched/remain 按已看集折算 */
function durOf(s){
  s=s||{};
  var eps=s.eps||[], statuses=s.statuses||{}, def=defDurMin(s);
  /* v2.44.6：s.epDur 是「一条集级时长都没有时唯一的实测来源」——AniList 带的 duration、
     详情页「✎ 改」里用户亲手填的分钟数。既然叫实测，整本账就不许再挂「约」、
     也不许说「没有时长数据」（旧版只认逐集 e.dur，用户改完 46 分页面照旧报「约 46 分钟」，
     就是这条「时长还是对不上」）。夹在 1~600 之外的一律不算（脏数据不许冒充实测）。 */
  var _ed=Number(s.epDur)||0, declared=(_ed>0&&_ed<=600);
  var out={epMin:def,total:0,watched:0,remain:0,seasons:{},known:false,partial:false,film:isFilmEntry(s)};
  if(!eps.length){
    var t=Number(s.total)||0;
    out.total=def*t;
    for(var k in statuses){ if(statuses[k]==='watched'||statuses[k]==='rewatch') out.watched+=def; }
    out.remain=Math.max(0,out.total-out.watched);
    if(declared) out.known=true;
    if(out.film){
      var fp0=filmPosOf(s);
      if(fp0>0&&fp0<100){ out.watched=Math.round(out.total*fp0/100); out.remain=Math.max(0,out.total-out.watched); }
    }
    return out;
  }
  var knownN=0, knownSum=0;
  eps.forEach(function(e){
    var d=Number(e.dur)||0, m=d>0?d:def;
    if(d>0){ knownN++; knownSum+=d; }
    out.total+=m;
    var sn=Number(e.sn)||1;
    if(!out.seasons[sn]) out.seasons[sn]={count:0,total:0,remain:0};
    out.seasons[sn].count++; out.seasons[sn].total+=m;
    var v=statuses[e.s];
    if(v==='watched'||v==='rewatch') out.watched+=m;
    else { out.remain+=m; out.seasons[sn].remain+=m; }
  });
  if(knownN||declared){
    if(knownN) out.epMin=Math.round(knownSum/knownN);
    /* v2.44.5：「有真值」必须是每条都有，不是有一条就算。缺一集就是估的，
       整本账要标「约」——否则 12 集里 10 集有真值，报出来的数看着像实测。
       v2.44.6：补一条同等判据——整部级 s.epDur 也是真值（AniList 的 duration、
       或用户亲手填的分钟数）。缺的那几集按它折算就不是「估」，「约」与 partial 一并撤掉。 */
    out.known=(knownN===eps.length)||declared;
    out.partial=(knownN>0&&knownN<eps.length&&!declared);
  }
  /* 电影部分进度折进时长账：看到 45% ⇒ 已看 45 分钟、还剩 55 分钟 */
  if(out.film){
    var fp=filmPosOf(s);
    if(fp>0&&fp<100){
      out.watched=Math.round(out.total*fp/100);
      out.remain=Math.max(0,out.total-out.watched);
    }
  }
  return out;
}

function durLineHtml(s,editable){

  var kp=seasonKeyOf(s), segs=[];
  var est=d.known?'':'约 ';
  if(d.film) segs.push('片长 '+est+fmtDur(d.total));
  else segs.push('单集 '+est+fmtDur(d.epMin));
  var _fp=d.film?filmPosOf(s):0;
  if(_fp>0&&_fp<100) segs.push('看到 <b>'+_fp+'%</b>（约 '+fmtDur(Math.round(d.total*_fp/100))+'）');
  if(kp && d.seasons[Number(kp.slice(1))]){

    segs.push(kp+' 看完 '+fmtDur(sd.total)+(sd.remain?('（还剩 '+fmtDur(sd.remain)+'）'):'（本季已看完）'));

async function addInternal(id){
  var s=INTERNAL_SHOWS.find(function(x){return x.id===id;});
  if(!s)return;
  // 检查是否已在片单（v2.4：归一化标题）
  var _nt=normTxt(s.title);
  var _hit=shows.find(function(x){return normTxt(x.title)===_nt;});
  if(_hit){
    toast('已在片单：《'+_hit.title+'》（未重复添加）');
    return;
  }
  // 构建集数组
  var eps=s.eps&&s.eps.length?s.eps:[];
  if(!eps.length){
    /* v2.44.5：同 rebaseEps —— 新集不写 dur。原来硬写 dur:24 会让整本时长账
       自认「有真值」，真人剧按 24 分算还不带「约」。没有时长证据就不冒充。 */
    for(var i=1;i<=s.total;i++) eps.push({s:i,t:'第 '+i+' 集',ref:null});
  }
  var cover=s.cover||'';
  var entry={
    sid:'int-'+Date.now(),
    title:s.title,
    nameJp:s.nameJp||'',
    cover:cover,
    year:s.year||'',
    total:s.total,
    eps:eps,
    statuses:{},
    status:'watching',
    addedAt:Date.now(),
    updAt:Date.now(),
    source:'内置库 · '+s.type
  };
  /* v2.44.5b：内置库的 type 是「热血/经典/国漫/长篇/连载/剧场版」这类标签，
     其中只有「剧场版」是格式信息。片单级 type 早被 v2.4.2 那条迁移删干净了
     （分类只留集级），所以格式只能落在 kind 上——defDurMin 认 kind 里的「剧场版」
     ⇒ 整片 100 分；之前这类条目一律退回动画 24 分/集，一部电影报成 24 分钟。
     只给剧场版写 kind：其余留空，fillerAxisApplies 那套判定与今天一字不差。 */
  if(String(s.type)==='剧场版') entry.kind='剧场版';
  addShow(entry);

     点「添加」到看见回执中间干了 2.2 秒（内置库封面本来就在自家 CDN 上，当场就能显示）。
     后台转成 dataURL 再写回，App 离线时依然有图，但用户不用等它。 */
  if(cover){
    cacheCover(cover).then(function(du){
      if(!du||String(du).indexOf('data:image')!==0) return;
      if(shows.indexOf(entry)<0) return;
      entry.cover=du; entry.updAt=Date.now(); save();
      renderList();
      var d=document.getElementById('vDetail');
      if(d&&d.style.display!=='none'&&curSid===entry.sid) renderDetail();
    }).catch(function(){});
  }

}

/* ---------- 详情 ---------- */
/* ===== v2.17.0：返回键 / 全面屏返回手势走「上一层」，不是一步退回桌面 =====
   壳的 onKeyDown 早就把返回交给 WebView 历史（MainActivity: canGoBack→goBack），
   但这页从不 pushState，历史永远是空的 ⇒ 手势一回退就退出 App。
   现在：开一层（详情/添加视图，或任意 .mask 弹层）压一格历史，回退时只关掉最上面那层。
   弹层走 DOM 观察统一接管：十来个入口各自 wrap.remove() 关，逐处挂接必漏；
   用户用 ×/取消/点遮罩 自己关掉的层，要补一格 history.back()，否则回退先吃掉空状态、像失灵。 */
var AT_LAYERS=[], AT_CLOSING=0, AT_VIEW=null, AT_NAV=0, AT_SEQ=0, AT_WANTED=[];
/* 深度对账：我们压进历史的那一格，state 里带着「压进来时栈深是几」（atDepth），
   于是当前深度随时能从现场读回来。为什么不自己记计数器：history.back() 是异步的，
   同一拍里「关一层 + 开一层」（长按菜单点「打开详情」、连续开关弹层）会让迟到的 popstate
   落在新的 pushState 之后，计数器与真实位置永久错位——之后每一次回退都往**上一个文档**走，
   在手机上就是「返回键把 App 弹回桌面 / 整页重载」。对账式没有可漂移的账本：以现场为准。 */
function atDepth(){ var st=null; try{ st=history.state; }catch(e){} return (st&&typeof st.atDepth==='number')?st.atDepth:0; }
function atSync(){
  if(AT_NAV) return;                     /* 我们那次 go() 还在路上，popstate 回来继续对账 */
  var want=AT_LAYERS.length, have=atDepth(), d=want-have;
  if(d>0){ for(var i=1;i<=d;i++){ try{ history.pushState({atDepth:have+i},''); }catch(e){ return; } } }
  else if(d<0){ /* 点名要关的是哪几层：history.go 是异步的，同一拍里若又开了新层，
       popstate 回来时不能把新开的层当成「多出来的一层」关掉——
       否则「换个面板」就变成了面板凭空消失（v2.30.0 豆瓣面板二次打开实测踩过）。 */
    AT_WANTED=AT_LAYERS.slice(want+d).map(function(l){ return l.seq; });
    AT_NAV=1; try{ history.go(d); }catch(e){ AT_NAV=0; } }
}
function atPush(layer){ layer.seq=++AT_SEQ; AT_LAYERS.push(layer); atSync(); }
function atCloseTop(){
  var l=AT_LAYERS.pop(); if(!l) return false;
  AT_CLOSING++;
  try{
    if(l.kind==='view'){ AT_VIEW=null; backList(); }
    else if(l.el){ l.el.__atUs=1; if(l.el.parentNode) l.el.parentNode.removeChild(l.el); }
  } finally{ AT_CLOSING--; }
  return true;
}
/* 一层被「非回退」的方式关掉了（×、取消、点遮罩）：从栈里摘掉再对账，让历史跟着缩。
   只在真找到那一层时动手——没找到还缩，就会吃掉别的层（尤其详情那一格）。 */
function atDrop(kind, el){
  if(AT_CLOSING>0 || (el && el.__atUs)) return;
  for(var i=AT_LAYERS.length-1;i>=0;i--){
    var l=AT_LAYERS[i];
    if(l.kind===kind && (kind!=='mask' || l.el===el)){ AT_LAYERS.splice(i,1); atSync(); return; }
  }
}
function atViewEnter(which){
  if(AT_VIEW===which) return;
  if(AT_VIEW){ for(var i=AT_LAYERS.length-1;i>=0;i--){ if(AT_LAYERS[i].kind==='view'){ AT_LAYERS[i].name=which; break; } } AT_VIEW=which; return; }
  AT_VIEW=which; atPush({kind:'view', name:which});
}
function atViewLeave(){
  if(!AT_VIEW) return;
  AT_VIEW=null;
  for(var i=AT_LAYERS.length-1;i>=0;i--){ if(AT_LAYERS[i].kind==='view'){ AT_LAYERS.splice(i,1); break; } }
  if(AT_CLOSING>0) return;
  atSync();
}
window.addEventListener('popstate', function(){
  AT_NAV=0;
  /* 谁按的返回都按现场处理：真实深度比栈浅，就把多出来的层关掉；
     是我们自己那次 go() 落点的话，栈已经等于深度，这里自然什么都不多做的。 */
  var have=atDepth();
  while(AT_LAYERS.length>have){
    var top=AT_LAYERS[AT_LAYERS.length-1];
    /* AT_WANTED 非空=这一跳是我们自己发起的：只关点过名的层，新开的留下。
       为空=用户真按了返回键，照 v2.17.0 的老规矩关掉最上面一层。 */
    if(AT_WANTED.length&&top&&AT_WANTED.indexOf(top.seq)<0) break;
    if(!atCloseTop()) break;
  }
  AT_WANTED=[];
  atSync();
});
(function atObserveMasks(){
  if(!window.MutationObserver) return;
  var isMask=function(n){ return n && n.nodeType===1 && n.classList && n.classList.contains('mask'); };
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      Array.prototype.forEach.call(m.addedNodes, function(n){ if(isMask(n)) atPush({kind:'mask', el:n}); });
      Array.prototype.forEach.call(m.removedNodes, function(n){ if(isMask(n)) atDrop('mask', n); });
    });
  }).observe(document.body, {childList:true, subtree:true});
})();

    body+

function phCharOf(title){
  var t=String(title||'').trim()
    .replace(/^【[^】]*】/,'')
    .replace(/^[《「『(\[<]+/,'')
    .replace(/[《》「」『』()（）\[\]【】]/g,'');
  if(!t) return '';
  var ch=t.charAt(0);
  /* 拉丁字母统一大写，看着更像印在票面上的字 */
  if(/[a-z]/.test(ch)) ch=ch.toUpperCase();
  return ch;
}
function coverPHChar(title){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var ch=phCharOf(title);

/* v2.41.0：裂图不再只是「换张占位图」——先按 sid 记账（markCoverDead），
   这条目才会重新进入补封面池；再换上带首字的印刷感占位（见 coverPHChar）。
   sid 有两个来源：img 自己带 data-sid，或外层卡片 .show[data-sid] 带。
   搜索结果/内置库列表那些没有 sid 的图，记账静默跳过（它们本来就不在片单里）。 */
function __coverFail(img){
  try{
    img.onerror=null;
    var sid=img.getAttribute&&img.getAttribute('data-sid');
    if(!sid&&img.closest){ var host=img.closest('[data-sid]'); if(host) sid=host.getAttribute('data-sid'); }
    if(sid) markCoverDead(sid);
  }catch(e){ try{ img.onerror=null; }catch(e2){} }
  img.style.opacity=1;
  img.src=coverPHOf(img);
}
/* 占位图上带的片名：渲染时写进 data-ph，裂图换占位时直接读，省一次反查 */
function coverPHOf(img){

  return coverPHChar('');
}

  /* v2.12.0：给搜索结果卡挂右键 / 长按菜单 */

  /* —— ③ AniList 回包：补第三区，再收口最终文案与「三条全 0 才转 AI」的判定 —— */
  var al=await alP;

  var seenKeys={};

  if(tvDown&&alDown) setAddOffline(true);

  } else if(tvDown&&alDown){
    msg.textContent=localN?'仅本地结果（网络不可用）':(AT_TOUCH()?'网络不可用，本地也没命中——可用「＋ 手动添加」，或稍后重试':'网络不可用且本地未命中——可用「＋ 手动添加」「✧ 问 AI 加片」，或稍后重试');

     联想拿不到就静默没有这一区，绝不拖慢主流程（doubanSuggest 内部 6s 超时 + 失败空列表）。 */
  var db=await dbP;
  if(tok!==window.__srTok) return;
  var dbItems=(db||[]).filter(function(it){
    var t=normTxt(it&&it.title||''); if(!t) return false;
    if(seenKeys[t]) return false;

    if(dupAl) return false;
    seenKeys[t]=1; return true;
  });
  window.__dbCache={};
  var dbHtml=dbItems.map(function(it,i){
    var did=(String(it.url||'').match(/subject\/(\d+)/)||[])[1]||'';
    it.did=did; window.__dbCache['db'+i]=it;
    var own=(did&&bySid('db-'+did))||shows.filter(function(x){ return normTxt(x.title)===normTxt(it.title); })[0];
    return '<div class="sr">'+(it.img?'<img src="'+esc(it.img)+'" onerror="this.style.display=\'none\'" referrerpolicy="no-referrer"/>':'<div style="width:44px;flex:none"></div>')+

  if(dbItems.length){
    list.insertAdjacentHTML('beforeend','<div id="srDbBox">'+secHdr('豆瓣联想','国产剧 / 中文剧 · 一键入库')+dbHtml+'</div>');

     才自动转（半自动会把人从结果堆里拽走）。v2.29.0：豆瓣联想有货也算有活路，不转 AI。 */
  if(!localN&&!onlineN&&!dbItems.length) autoAiAdd(kw);

/* —— 全网结果行：中文俗称（用户就是打「老友记」搜进来的）标在英文名后面 —— */
/* 别名组命中的往往是转写（friends ↔ Friends），那不算俗称；优先回显用户打的那个叫法，
   只有它就是英文名时才不标，免得行里出现「Friends（Friends）」这种废话。 */
function webCnName(sh){
  var q=String(sh._q||''), kw=String(sh._kw||'');
  var disp=/[^\x00-\x7f]/.test(q)?q:kw;
  if(!disp||normTxt(disp)===normTxt(sh.name||'')) return '';
  return disp;
}
/* 条目 id 一律规整成数字再拼进 HTML：这行是 innerHTML，id 来自外部接口，
   不规整就等于把「拼进 onclick 属性」的注入口留给对方（v2.5 的 srItemHtml 就钉过这条）。 */
function webRowHtml(sh){
  var tv=Number(sh.id)||0, own=bySid('tv'+tv), cn=webCnName(sh);
  var st=String(sh.status&&sh.status.name||'');
  return '<div class="sr" data-tv="'+tv+'">' +
    (webCoverOf(sh)?'<img src="'+esc(webCoverOf(sh))+'" onerror="__coverFail(this)" referrerpolicy="no-referrer"/>':'<div style="width:44px;flex:none"></div>') +
    '<div class="i"><div class="t">'+esc(sh.name)+(cn?('（'+esc(cn)+'）'):'')+'</div>' +
    '<div class="m">'+esc(webKind(sh))+(webYear(sh)?(' · '+esc(webYear(sh))):'')+(st?(' · '+esc(st)):'')+'</div></div>' +
    '<button onclick="toggleSrEps(\'sreps_tv'+tv+'\',\''+tv+'\')">单集</button>' +
    (own?'<button disabled>已加</button>':'<button onclick="webAddFromSearch(this,'+tv+')">添加</button>') +
    '<div class="sreps" id="sreps_tv'+tv+'" data-sid="'+tv+'"></div>' +
    '</div>';
}
/* v2.29.0：豆瓣联想一键入库——标准名+年份+集数直接建档（source 豆瓣联想，sid 用豆瓣 subject id 防重）。
   封面先挂豆瓣小图（列表 img 均带 referrerpolicy=no-referrer，可显示），后台再走封面链转存本机
   dataURL（离线不裂）；集数取 suggest 的 episode（单季剧=总集数），多季剧进详情页「编辑集数」改。 */
function dbAddShow(i){
  var it=window.__dbCache['db'+i]; if(!it||!it.title) return;
  var sid='db-'+(it.did||normTxt(it.title).replace(/[^a-z0-9]/g,'').slice(0,20)||(''+Date.now()));
  var n=parseInt(it.episode,10)||0, eps=[];
  for(var k=1;k<=n;k++) eps.push({s:k,t:'第 '+k+' 集'});
  addShow({ sid:sid, title:it.title, nameJp:'', cover:it.img||'', year:String(it.year||''), total:n, eps:eps,
    statuses:{}, status:'watching', addedAt:Date.now(), updAt:Date.now(), source:'豆瓣联想', manual:1, doubanId:it.did||'' });
  var s=bySid(sid);
  if(s&&navigator.onLine){ try{ healCoverFor(s,{relay:true}).then(function(ok){ if(ok) renderList(); }); }catch(e){} }
}
async function webAddFromSearch(btn,tvId){
  var sh=window.__srCache&&window.__srCache['tv'+tvId]; if(!sh) return;
  if(btn){ btn.disabled=true; btn.textContent='添加中…'; }
  webAddShow(sh);
}
/* 立刻入库 + 回执，单集在后台补齐（缺点5 的规矩：主路径上绝不等网络） */
function webAddShow(sh){
  var tv=Number(sh.id)||0;
  var entry={ sid:'tv'+tv, title:String(sh.name||'').trim(), nameJp:'', cover:webCoverOf(sh),
    year:webYear(sh), total:0, eps:[], statuses:{}, status:'watching', addedAt:Date.now(), updAt:Date.now(),
    source:'全网 · '+webKind(sh), tvId:tv, kind:webKind(sh) };
  var _cn=webCnName(sh); if(_cn) entry.aliases=[_cn];
  addShow(entry);
  webFillEpisodes(entry.sid);
}
async function webFillEpisodes(sid){
  var s=bySid(sid); if(!s||!s.tvId) return;
  try{
    var eps=await webEpisodes(s.tvId);
    var cur=bySid(sid); if(!cur||!eps.length) return;
    cur.eps=eps; cur.total=eps.length; cur.updAt=Date.now();
    try{ ensureSeasons(cur); }catch(e){}
    try{ autoCalibrateSrc(cur); }catch(e){}
    save(); renderList();
    var d=document.getElementById('vDetail');
    if(d&&d.style.display!=='none'&&curSid===cur.sid) renderDetail();
  }catch(e){}
}
/* v2.5.3 搜索结果逐集：按条目拉取单集（内存缓存 + 就地重试） */
var SR_EPS_MEM={}, SR_EPS_BUSY={};
function srEpsRows(ded){ return ded.map(function(e2){ return '<div class="srep"><span class="n">E'+(e2.s<10?'0':'')+e2.s+'</span><span class="tt">'+esc(e2.t||('第 '+e2.s+' 集'))+'</span><span class="m">'+(e2.dur?e2.dur+'分钟':'')+'</span></div>'; }).join(''); }
async function fillSrEps(cid){
  var box=document.getElementById(cid); if(!box) return;
  var sid=box.getAttribute('data-sid'); if(!sid) return;
  if(SR_EPS_MEM[sid]){ box.innerHTML='<div class="srepswrap">'+srEpsRows(SR_EPS_MEM[sid])+'</div>'; box.classList.add('on'); return; }
  if(SR_EPS_BUSY[sid]) return; SR_EPS_BUSY[sid]=1;
  box.classList.add('on');
  box.innerHTML='<div class="srepswrap"><div class="srep"><span class="n">…</span><span class="tt">正在拉取单集列表…</span></div></div>';
  try{
    var eps=await webEpisodes(Number(sid));
    if(!eps.length) throw new Error('全网库里这部还没有分集记录');
    SR_EPS_MEM[sid]=eps;
    box.innerHTML='<div class="srepswrap">'+srEpsRows(eps)+'</div>';
  }catch(e){
    box.innerHTML='<div class="srepswrap"><div class="srep"><span class="tt">单集拉取失败：'+esc(String((e&&e.message)||e))+'</span><button class="epgo" onclick="fillSrEps(\''+cid+'\')">重试</button></div></div>';
  }finally{ delete SR_EPS_BUSY[sid]; }
}
function toggleSrEps(cid,sid){
  var box=document.getElementById(cid); if(!box) return;
  var cur=box.getAttribute('data-sid');
  var vis=box.classList.contains('on');
  if(vis&&(!sid||String(sid)===String(cur))){ box.classList.remove('on'); return; }
  if(sid) box.setAttribute('data-sid',String(sid));
  fillSrEps(cid);
}

/* v2.8.0：中文/日文标题 → 英文 slug 的松散兜底匹配。
   数据集本身带英文标题 t，可做「番剧英文名/别名 ↔ 数据集标题」双向包含匹配。 */
function fgLooseMatch(s){
  var ds = window.AFG_FILLER || {};
  var names = [];
  if (s) [s.title, s.nameJp, s.titleEn, s.nameEn].forEach(function(x){ if(x) names.push(String(x)); });
  if (s && s.aliases) try{ (Array.isArray(s.aliases)?s.aliases:[]).forEach(function(a){ names.push(String(a)); }); }catch(e){}
  var norm = function(x){ return String(x).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,''); };
  var cands = names.map(norm).filter(function(x){ return x.length >= 3; });
  if (!cands.length) return null;
  var keys = Object.keys(ds);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i], entry = ds[k];
    var t = norm(entry && entry.t || k);
    if (!t || t.length < 3) continue;
    for (var j = 0; j < cands.length; j++) {
      var c = cands[j];
      /* 只做足够长的包含匹配，避免 "naruto" 命中 "boruto" 这类误判 */
      if (t === c) return { slug: k, data: entry };
      if (c.length >= 6 && (t.indexOf(c) >= 0 || c.indexOf(t) >= 0)) return { slug: k, data: entry };
    }
  }
  return null;
}

function fgParseFills(html){
  /* 严格解析: "N. (时长) 标题 *Filler | *Mixed Canon | *Canon" */
  var text = html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#\d+;/g,' ').replace(/\s+/g,' ');
  var re = /(\d{1,4})\.\s*(?:\([\d:]+\))?\s*([^.*]{2,80}?)\s*\*\s*(Filler|Mixed Canon(?:\/Filler)?|Anime Canon|Canon)\b/gi;
  var byCat = { filler: [], mixed: [], canon: [] }, dup = {};
  var m, safety = 0;
  while ((m = re.exec(text)) !== null && safety < 5000) {
    safety++;
    var ep = +m[1]; if (ep < 1 || ep > 2000) continue;
    var cat = m[3].toLowerCase();
    cat = cat.charAt(0) === 'f' ? 'filler' : (cat.indexOf('mixed') >= 0 ? 'mixed' : 'canon');
    if (!dup[ep]) dup[ep] = cat;
  }
  Object.keys(dup).forEach(function (k) { byCat[dup[k]].push(+k); });
  Object.keys(byCat).forEach(function (k) { byCat[k].sort(function (a, b) { return a - b; }); });
  return byCat;
}
function fgFmt(arr){
  if (!arr || !arr.length) return '';
  var out = [], i = 0;
  while (i < arr.length) {
    var j = i;
    while (j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++;
    out.push(i === j ? '' + arr[i] : arr[i] + '-' + arr[j]);
    i = j + 1;
  }
  return out.join(',');
}
function fgSlug(title){
  return String(title||'').toLowerCase().replace(/[’'":]/g,'').replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,'');
}
function fgLookupLocal(s){
  /* 本地灌水库（离线快照）查表，零网络依赖 */
  var ds = window.AFG_FILLER || {};
  var alias = FG_ALIAS[String(s.title || '').toLowerCase()] || null;
  var cands = [];
  if (alias) cands.push(alias);
  cands.push(fgSlug(s.title), fgSlug(s.nameJp));
  for (var i = 0; i < cands.length; i++) {
    if (ds[cands[i]]) return { slug: cands[i], data: ds[cands[i]] };
  }
  /* v2.8.0：别名/英文名松散兜底匹配（大幅提升新数据集的命中率） */
  try { var loose = fgLooseMatch(s); if (loose) return loose; } catch(e) {}
  return null;
}
/* v2.8.0：本地未收录时，联网实时抓取 animefillerlist.com 并缓存到本地。
   这样「以后新番」不用等数据集更新——查一次就自动进本地库。
   注意：浏览器直连该站可能被 CORS 拦；失败时给出明确提示与手动入口。 */
var AFL_BASE = 'https://www.animefillerlist.com';
var FG_LIVE_CACHE_KEY = 'at_fg_live';   /* {slug: {t,f,m,at}}，联网抓到后长期缓存 */

function fgLiveCacheAll(){ try{ return JSON.parse(localStorage.getItem(FG_LIVE_CACHE_KEY)||'{}'); }catch(e){ return {}; } }
function fgLiveCachePut(slug, entry){
  try{ var c=fgLiveCacheAll(); c[slug]=entry; localStorage.setItem(FG_LIVE_CACHE_KEY, JSON.stringify(c)); }catch(e){}
}
/* 用 slug 直接解析 animefillerlist 的剧集表 */
function fgParseAfl(html){
  var m = html.match(/<table[\s\S]*?<\/table>/i);
  if (!m) return null;
  var table = m[0];
  var f = [], mixed = [];
  var rows = table.match(/<tr[\s\S]*?<\/tr>/gi) || [];
  for (var i = 0; i < rows.length; i++) {
    var cells = rows[i].match(/<td[^>]*>([\s\S]*?)<\/td>/gi) || [];
    if (cells.length < 3) continue;
    var clip = function(h){ return h.replace(/<[^>]+>/g,'').replace(/&#0?39;/g,"'").replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').trim(); };
    var epTxt = clip(cells[0]), typ = clip(cells[2]);
    var nums = epTxt.match(/\d+/g); if (!nums) continue;
    var eps = nums.map(Number);
    if (typ === 'Filler') f = f.concat(eps);
    else if (typ === 'Mixed Canon/Filler' || typ === 'Anime Canon') mixed = mixed.concat(eps);
  }
  var uniq = function(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }).sort(function(x,y){ return x-y; }); };
  if (!f.length && !mixed.length) return null;
  return { f: uniq(f), m: uniq(mixed) };
}
/* 抓取一个 slug 的页面（走与 Bangumi 相同的代理策略） */
function fgFetchSlug(slug){
  var url = AFL_BASE + '/shows/' + slug;
  return fetch(url, { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(html){
    var parsed = fgParseAfl(html);
    if (!parsed) throw new Error('该页面没有可解析的剧集分类表');
    return parsed;
  }).catch(function(e){
    var ne = new Error('联网抓取失败（' + (e && e.message || '未知') + '）。可能原因：网络不通 / 该站被墙 / CORS 拦截。可点「打开 AFG 英文站」在浏览器里手动查，或在集上右键「来源标注」手动标。');
    ne.name = e && e.name || 'Error';
    throw ne;
  });
}
async function fgFetchOne(show){
  var hit = fgLookupLocal(show);
  if (hit) {
    return { ok: true, title: show.title,
      url: AFL_BASE + '/shows/' + hit.slug,
      filler: hit.data.f || [], mixed: hit.data.m || [],
      canon: 0, at: Date.now(), src: hit.data.t || hit.slug };
  }
  /* 本地未收录：尝试联网实时抓（先查 live 缓存，再命中别名 slug） */
  var live = fgLiveCacheAll();
  var cand = [ FG_ALIAS[String(show.title||'').toLowerCase()], fgSlug(show.title), fgSlug(show.nameJp) ].filter(Boolean);
  for (var i = 0; i < cand.length; i++) {
    var slug = cand[i];
    if (live[slug] && live[slug].f) {
      return { ok: true, title: show.title, url: AFL_BASE + '/shows/' + slug,
        filler: live[slug].f || [], mixed: live[slug].m || [], canon: 0, at: live[slug].at || Date.now(),
        src: live[slug].t || slug, fromLiveCache: true };
    }
  }
  /* 联网试抓 */
  for (var j = 0; j < Math.min(cand.length, 2); j++) {
    try {
      var data = await fgFetchSlug(cand[j]);
      fgLiveCachePut(cand[j], { t: show.title, f: data.f, m: data.m, at: Date.now() });
      return { ok: true, title: show.title, url: AFL_BASE + '/shows/' + cand[j],
        filler: data.f, mixed: data.m, canon: 0, at: Date.now(), src: show.title + '（联网抓取）', fromLive: true };
    } catch (e) { /* 换下一个候选 */ }
  }
  return { ok: false, title: show.title,
    err: '《' + (show.nameJp || show.title) + '》本地库与联网均未找到分类数据（本地已收录 212 部 + 联网自动补）。可在「来源标注」里手动标注，或点「打开 AFG 英文站」自行查阅。' };
}
async function fgCalibrate(showsList){
  toast('正在校准 Filler Guide 数据…');
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem('at_fg_cache') || '{}'); } catch (e) {}
  var results = [];
  for (var i = 0; i < showsList.length; i++) {
    var s = showsList[i];
    if (cache[s.title] && Date.now() - cache[s.title].at < 7 * 86400e3) { results.push(cache[s.title]); continue; }
    var r = await fgFetchOne(s);
    results.push(r);
    if (r.ok) { cache[s.title] = r; try { localStorage.setItem('at_fg_cache', JSON.stringify(cache)); } catch (e) {} }
  }
  var okN = results.filter(function (r) { return r.ok; }).length;
  toast('校准完成：' + okN + '/' + results.length + ' 番已匹配');
  return results;
}
function fgApplyTo(s, fg){
  if (!fg || !fg.ok) return { added: 0, removed: 0 };
  var fStr = fgFmt(fg.filler), mStr = fgFmt(fg.mixed);
  s.filler = fStr; s.mixed = mStr; s.fgAt = fg.at; s.fgUrl = fg.url;
  s.updAt = Date.now(); statInvalidate(s.sid);
  return { added: fg.filler.length + fg.mixed.length };
}
/* ===== v2.17.0：来源默认自动校准（用户指令「默认自动校准好来源」）=====
   三条规矩：① 只吃离线 AFG 快照，绝不联网——主路径上有网络就会被当成卡住（缺点5 实测干等 2200ms）；
   ② 不抬 updAt：来源是推导出来的元数据，每台设备自己都会算出同一份，抬时钟反而让本机在云端逐剧合并里
      永远压过另一台的真改动；③ 一部只试一次（fgTried 随片单落盘），离线库没有的不再反复查。 */
function autoCalibrateSrc(s){
  if(!s||s.fgTried) return false;
  if(s.fgAt||s.filler||s.mixed){ s.fgTried=1; return false; }
  if(!(s.eps||[]).length) return false;
  if(!fillerAxisApplies(s)){ s.fgTried=1; return false; }
  var hit=fgLookupLocal(s);
  if(!hit){ s.fgTried=1; return false; }
  var keepUpd=s.updAt;
  fgApplyTo(s,{ ok:true, title:s.title, url:AFL_BASE+'/shows/'+hit.slug,
    filler:hit.data.f||[], mixed:hit.data.m||[], at:Date.now(), src:hit.data.t||hit.slug });
  s.updAt=keepUpd; s.fgTried=1;
  return true;
}
function calibrateAllLocal(){
  var n=0;
  (window.shows||[]).forEach(function(s){ if(autoCalibrateSrc(s)) n++; });
  if(n){
    save(); renderList();
    var d=document.getElementById('vDetail');
    if(d&&d.style.display!=='none') renderDetail();
  }
  return n;
}
async function fgAllShows(){
  var list=shows.slice();
  var rs=await fgCalibrate(list);
  var okN=0, miss=[];
  rs.forEach(function(r){
    var s=shows.find(function(x){ return x.title===r.title; });
    if(!s) return;
    if(r.ok){ fgApplyTo(s,r); okN++; }
    else miss.push(s.title);
  });
  shows.forEach(function(s){ statInvalidate(s.sid); });
  var agg=libraryCov();
  try{ localStorage.setItem('at_src_report',JSON.stringify({at:new Date().toISOString(),matched:okN,total:list.length,miss:miss.slice(0,60),agg:agg})); }catch(e){}
  save(); renderList();
  if(document.getElementById('vDetail').style.display!=='none') renderDetail();
  return {ok:okN,total:list.length};
}
function fgClearCache(){
  try { localStorage.removeItem('at_fg_cache'); toast('已清空 Filler 缓存'); } catch (e) {}
}

async function cacheCover(url){
  if(!url) return '';

     留着只会让每张坏封面白等两个 6s 超时。封面站带 CORS 头，直连即可。 */
  url=upHttps(url);
  var _attempts=[url];
  var r=null, _lastErr=null;
  for(var _i=0;_i<_attempts.length;_i++){
    try{
      var _c=new AbortController(); var _t=setTimeout(function(){ try{ _c.abort(); }catch(_e2){} },6000); /* v2.4.4：封面 6s 超时，防黑洞网络卡死添加 */
      r=await fetch(_attempts[_i],{signal:_c.signal}); clearTimeout(_t);
      if(r.ok) break; _lastErr=new Error('cover http '+r.status); r=null;
    }
    catch(_e){ _lastErr=_e; r=null; }
  }
  if(!r) throw (_lastErr||new Error('cover load failed'));
  var b=await r.blob();
  return await new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){ try{
      var c=document.createElement('canvas'); c.width=200; c.height=300;
      var ctx=c.getContext('2d'); ctx.drawImage(im,0,0,200,300);
      res(c.toDataURL('image/jpeg',0.85));

    im.src=URL.createObjectURL(b);

/* ===== v2.6.0 封面自愈：批量补封面 / 单条重拉 / 启动小批量（本地 dataURL 持久化） ===== */
function upHttps(u){ return String(u||'').replace(/^http:\/\/(?!127\.0\.0\.1|localhost)/i,'https://'); }

function coverNeedsHeal(s){ if(!s||s.pv) return false; var c=String(s.cover||'');

     而 coverBy='net' 那行豁免让它连「⟳ 补封面」都进不去。裂过 = 必须重拉。 */
  if(s.coverDead) return true;

var _deadSaveT=null;

    if(Number(s.coverDead||0)&&(now-Number(s.coverDead))<10*60*1000) return;
    s.coverDead=now;

function _cTrySet(m){ try{ localStorage.setItem('at_cover_try',JSON.stringify(m)); }catch(e){} }

         前几部恰好是冷门番（最容易不中）时，剩下的全都白跑——这正是「补了还是一片灰」的原因之一。
         v2.44.0：自动（开机小批量）也放豆瓣进来，但只给 2 次机会——它是本轮唯一可能撞风控的源，
         开机动静要小，2 次够把最该补的那部补上；手动一键补齐仍给满 6 次。 */
      var relay=dbFail<(manual?6:2);
      /* v2.41.0：coverOnly——批量补封面只要封面，不再顺带拉集表（每部一次大请求）。 */
      try{ var _r=await refreshNamesFor(pool[i],{save:false, relay:relay, coverOnly:true}); ok=_r.coverOk; }catch(e){ ok=false; }
      /* v2.44.0：去掉 manual 条件。原来只有手动补齐才计失败，而自动模式又刚刚放开了豆瓣
         （dbFail<(manual?6:2)），结果是自动那 6 部**每部都拿到 relay=true**——熔断形同虚设，
         开机尾巴从 8 秒拖到 15 秒（run-regression T15 实测：douban-relay 那一发落在 15.2s）。 */
      if(!ok&&relay) dbFail++;
      coverMark(pool[i].sid,ok);
      if(ok) okN++; else { failN++; miss.push(pool[i]); }
      if(manual) toast('补封面 '+(i+1)+'/'+pool.length+'（成功 '+okN+'）…'+(dbFail>=6?'（豆瓣已熔断，剩余走其他源）':''));
      /* 间隔不要往下调：run-regression 的 T15 靠「500ms 内没有新请求」判后台是否已安静，
         间隔一旦压到 500ms 以下，两部之间的缝会小过那个判定窗，量具就把「还在跑」误读成
         「已安静」，随后窗口里冒出的下一部请求被算到「标记已看」头上（实测 2/2 红）。
         v2.41.0 曾压到 320ms，已改回。提速靠 coverOnly 省下的集表请求，不靠压缩间隔。 */
      await new Promise(function(r){ setTimeout(r, relay?1200:420); });
    }
  }finally{
    _coverHealRunning=false;
    /* v2.24.0：没人补成功、但有老封面被还原时也要落盘——否则下一次打开又回到空白 */
    if(!okN&&_cvRestored){ try{ save(); renderList(); var dd=document.getElementById('vDetail'); if(dd&&dd.style.display!=='none') renderDetail(); }catch(e){} }
    _cvRestored=false;
    if(okN){
      save(); renderList();
      var d=document.getElementById('vDetail'); if(d&&d.style.display!=='none') renderDetail();
      try{ logAdd('补封面 '+okN+' 部','批量封面补齐'+(failN?('（仍缺 '+failN+'）'):''),true); }catch(e){}
    }
    if(manual){
      var tail='封面补齐完成：成功 '+okN+' 部'+(failN?('，仍缺 '+failN+' 部'):'')+(skipN?('，离线跳过 '+skipN+' 部'):'');
      toast(tail);
      /* 报账把「还缺哪几部」摊开说：以前只报一个数字，用户看着一片灰却不知道剩的是谁 */
      if(failN){
        var names=miss.slice(0,14).map(function(s){ return '《'+((s&&s.title)||'')+'》'; }).join('\n');
        uiConfirm(tail+'\n\n还缺封面的这几部：\n'+names+(miss.length>14?('\n…以及另外 '+(miss.length-14)+' 部'):'')+
          '\n\n可以打开详情点「⟳ 重拉封面」单独再试，或用「⇪ 本地封面」从本机选一张（一定能成）。',
          function(){}, {title:'仍缺封面 '+failN+' 部', okText:'知道了', cancelText:'关闭'});
      }
    }
    else if(okN) toast('已自动补齐 '+okN+' 部封面','bg');
  }
}

/* ===== v2.24.0「⇪ 本地封面」=====
   为什么必须有这条路：TVMaze 一条源对中文剧/国产剧基本失效（实测「上错花轿嫁对郎」中文名搜索返回 []）。
   现已补三道自动源：TMDB（浏览器直连、需 key）、Wikidata（浏览器直连、免 key 但覆盖弱）、
   以及豆瓣中转（v2.27.0 起走 CloudBase 公网 HTTP 函数 douban-relay，任何网络下可达，国剧覆盖最全；
   局域网时优先用本机 8089 的 /cover-relay）。但自动源总有漏网，
   本地选图 + 粘贴仍是 100% 可控、离线也在的兜底：200×300 压成 dataURL 存本机，
   打 coverBy='user' 标记，自愈与「洗封面」都不再动它。 */
function fileToCoverDataURL(file){
  return new Promise(function(res,rej){
    if(!file||!/^image\//.test(String(file.type||''))) return rej(new Error('不是图片文件'));
    if(file.size>12*1024*1024) return rej(new Error('图片太大（>12MB）'));
    var rd=new FileReader();
    rd.onerror=function(){ rej(new Error('读图失败')); };
    rd.onload=function(){
      var im=new Image();
      im.onerror=function(){ rej(new Error('这张图没法解码')); };
      im.onload=function(){
        try{
          var c=document.createElement('canvas'); c.width=200; c.height=300;
          var ctx=c.getContext('2d');
          /* 海报是 2:3：按「短边贴满」裁中间，别拉变形（cover 同款裁法） */
          var nw=200,nh=300,sw=im.width,sh=im.height,sr=sw/sh,dr=nw/nh;
          if(sr>dr){ sw=sh*dr; } else { sh=sw/dr; }
          ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,nw,nh);
          var du=c.toDataURL('image/jpeg',0.85);
          if(String(du).indexOf('data:image')!==0) return rej(new Error('转换失败'));
          res(du);
        }catch(e){ rej(e); }
      };
      im.src=String(rd.result);
    };
    rd.readAsDataURL(file);
  });
}

async function syncFromPortal(box){
  var m=box?box.querySelector('#syMsg'):null;

      var j=await r.json();

      var items=(j.anime||[]).concat(j.tv||[]);

/* ---------- 多季切换（v2.17.0）----------
   旧版：一个季度＝一个 Bangumi 条目，所以切换要联网「找齐同系列的其它条目」。
   现在：全网库一次就把整部剧的单集全给了（老友记 236 集含 10 季），季度直接从
   本条目的单集里按 sn 切出来，纯本地、零请求；点季度=筛选卡片。 */
function seasonsOf(s){
  var out=[]; (s.eps||[]).forEach(function(e2){ var n=Number(e2.sn)||1; if(out.indexOf(n)<0) out.push(n); });
  return out.sort(function(a,b){ return a-b; });
}
/* 由已入库单集算出季列表（不联网）。不足两季时把旧季度列表清掉：
   老数据里的 parts 指向已退役的「找同系列条目」机制，留着会渲染出点不动的芯片。 */
function ensureSeasons(s){
  if(!s) return;
  var sns=(s.eps||[]).length ? seasonsOf(s) : [];
  if(sns.length<2){ if((s.parts||[]).length){ s.parts=[]; } delete s.curPart; return; }
  s.parts=sns.map(function(n){
    var cnt=(s.eps||[]).filter(function(e2){ return (Number(e2.sn)||1)===n; }).length;
    return { key:'S'+n, no:n, name:'第'+n+'季', eps:cnt };
  });
  var keep='S'+sns[0];
  var cp=String(s.curPart||'');
  if(/^S\d+$/.test(cp)&&sns.indexOf(Number(cp.slice(1)))>=0) keep=cp;
  s.curPart=keep;
}

/* 标题归一：用于门户导入 / 全网库之间的去重比对 */
/* v2.44.3：剥尾部季数，但只认「第 N 季/部/卷/篇」与「S1/S2」这类**带标记**的写法。
   原来是无条件 `.replace(/[0-9]+$/,'')`，本意是把「漫长的季节 第一季」和
   「漫长的季节 第二季」并成同一部（对的），但它顺手也把
   「灌篮高手 2」削成「灌篮高手」—— 那是两部完全不同的电影/剧，
   并进去等于把两部的进度混成一条（实测抓到的误判）。
   实测代价（旧口径正向 4/8、误判 1/4）：
     「咒术回战（第二季）」对不上「咒术回战」—— 括号里的「第二季」是中文数字，
       旧正则只认阿拉伯数字，所以剥不掉；
     「灌篮高手 2」被误判成「灌篮高手」—— 无标记裸数字，凭什么认定它是第2季？
   现在：中文数字与阿拉伯数字的「第N季/部/卷/篇」都剥，括号一并清掉；
   裸数字**保留**（它更可能是续作编号而不是季数）。
   另补：S1/S2 这类缩写也剥（「Battle Spirits S2」与「Battle Spirits」同一部）。 */
function dbNormTitle(t){
  var s=String(t||'').toLowerCase()
    .replace(/[\s·・:：\-—~～!！?？.,，、'"“”‘’()（）\[\]【】]/g,'');
  /* 「第2季 / 第二季 / 第2部 / 上部…」与 S1/S2 缩写：有标记才当季数 */
  s=s.replace(/(?:第)?[0-9一二三四五六七八九十]+(?:季|部|卷|篇)/g,'')
     .replace(/s[0-9]+(?![a-z0-9])/g,'');
  return s;
}
/* —— 剧名铁律（用户令 2026-10-06）：外语剧＝中文+原文，中文剧＝中文名，已有条目永不改名 ——
   网关把豆瓣收藏页的「中文名 / 原名」按 / 拆成 title/origTitle 两截；外语剧在片单里要双语，
   入库前把两截拼回「中文名 原文」。主标题本身中英粘连的（Working!!迷糊餐厅，没有 / 拆分）
   和纯外文的（豆瓣没建中文名，如 The Pitt）没有「中文段+原名」可拼，原样保留。
   中文段单独存 cnTitle，给 dbTargetOf 的片名匹配兜底——片单里的旧条目多是纯中文名。 */
function dbShowTitle(d){
  var t=String(d.title||'').trim(), o=String(d.origTitle||'').trim();
  if(!t||!o) return t;
  if(t.toLowerCase().indexOf(o.toLowerCase())>=0) return t;   /* 原名已在主标题里，不重复拼 */
  return t+' '+o;
}

function pvDrop(){ var had=false; for(var i=0;i<shows.length;i++){ if(shows[i].pv){ had=true; break; } } if(had) shows=shows.filter(function(s){ return !s.pv; }); return had; }

   pic 留豆瓣远程地址，手机上裂就裂——真要收进片单，加入那一步自己会补封面。 */
var DB_SNAP_KEY='tr_db_snap', DB_SNAP_MAX=800;
function dbSnapSave(items){

        cnTitle:String(d.cnTitle||''), origTitle:String(d.origTitle||''),
        year:String(d.year||''), status:String(d.status||''), pic:String(d.pic||''),
        rating:d.rating||0, ep:d.ep||0, markedAt:String(d.markedAt||''),
        isAnime:d.isAnime?1:0, genres:(d.genres||[]).slice(0,6),

    return slim.length;
  }catch(e){ return 0; }
}
function dbSnapGet(){

}
/* 快照是「别处拉来的外部数据」，只读展示用；任何一条都不许混进 shows（那是用户自己的账本）。 */

/* v2.43.0（用户令「豆瓣和追迹都有的要合并」）：豆瓣一行的全部叫法。
   老逻辑只拿「豆瓣中文段」比「片单正名」，于是这几种最常见的组合全都判不出「已经在片单」：
     · 片单存的是英文原名（Cowboy Bebop），豆瓣行给的是中文名（星际牛仔）
     · 片单存的是中文名，豆瓣行给的是双语（星际牛仔 Cowboy Bebop）
     · 片单条目的名字挂在别名里（al1 添加的条目）
   结果就是导入后多出一条同作品的重复——两条同名、各记一半进度，正是用户抱怨的那种。
   这里把两边所有叫法都摊开比：豆瓣侧出「整名/中文段/原名段」，片单侧出「正名/原名/别名」，
   仍是**归一化全等才算**，不放宽成模糊匹配（《欢乐颂》配到交响曲那类误伤绝不重演）。 */
function dbKeysOf(d){
  var out={};
  var put=function(x){ var k=dbNormTitle(x); if(k) out[k]=1; };
  put(d.title); put(d.cnTitle); put(d.origTitle);
  /* 双语名「海贼王 One Piece」里把中文段单独切出来：网关有时不给 cnTitle，
     而片单里的旧条目恰恰多是纯中文名，没有这一刀就永远对不上。 */
  var t=String(d.title||'');
  var cjk=(t.match(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]+/g)||[]).join('');
  if(cjk) put(cjk);
  var lat=(t.match(/[A-Za-z0-9][A-Za-z0-9'!?.\-]*(?:\s+[A-Za-z0-9'!?.\-]+)*/g)||[]).join(' ').trim();
  if(lat) put(lat);
  /* v2.44.3：豆瓣原名也给一份剥掉季数的中文侧键。
     场景：豆瓣给 Cowboy Bebop、追迹那条存的是「星际牛仔」——两边叫法全不同，
     光靠主标题永远对不上（实测正向 8 个场景里这类就占了 1 个）。
     这不是放宽成模糊匹配：仍然是归一化**全等**才认，
     只是把「原名 + 季数」这个必然同指的两种形态都收进同一个键里。 */
  if(d.origTitle){ var ok2=dbNormTitle(d.origTitle); if(ok2) out[ok2]=1; }
  return out;
}
function showHasKey(s,keys){
  if(!s||!keys) return false;
  var cands=[s.title,s.nameJp].concat(s.aliases||[]);
  for(var i=0;i<cands.length;i++){ var k=dbNormTitle(cands[i]); if(k&&keys[k]) return true; }
  return false;
}
function dbTargetOf(d){
  var i,t=null,real=/^\d+$/.test(String(d.subjectId||''));
  if(real){ for(i=0;i<shows.length;i++){ if(String(shows[i].dbId||'')!==''&&String(shows[i].dbId)===String(d.subjectId)){ t=shows[i]; break; } } }
  if(!t){
    var keys=dbKeysOf(d);
    for(i=0;i<shows.length;i++){ if(showHasKey(shows[i],keys)){ t=shows[i]; break; } }
  }
  /* v2.44.3：内置库当「译名桥」——同一份片单在豆瓣和追迹对不上的最后一块。
     前两道（dbId、按名字集合比）只在两边叫法重合时有效，而剩下那类怎么都比不上：
     豆瓣叫Cowboy Bebop、追迹那条存的是「星际牛仔」；两边各自都「没出错」，
     纯靠字符串永远对不上。内置库 301 条人工校对了中英对照（含别名），
     于是「豆瓣那个叫法在库里对应哪部、那部在片单里叫什么」这条链就接上了。
     安全：仍然是**归一化全等**才认，没有模糊匹配、没有相似度——
     库是离线静态数据，给什么比什么，不猜。库里查不到就直接放弃，走原有路径。 */
  if(!t){
    var lib=window.INTERNAL_SHOWS||[], q=dbKeysOf(d), hit2=null;
    for(i=0;i<lib.length&&!hit2;i++){
      var L=lib[i], lk={};
      lk[dbNormTitle(L.title)]=1;
      if(L.nameJp) lk[dbNormTitle(L.nameJp)]=1;
      (L.aliases||[]).forEach(function(a){ var k=dbNormTitle(a); if(k) lk[k]=1; });
      for(var kk in q){ if(q[kk]&&lk[kk]){ hit2=L; break; } }
    }
    if(hit2){
      for(i=0;i<shows.length;i++){
        var S=shows[i];
        if(dbNormTitle(S.title)===dbNormTitle(hit2.title) ||
           (S.nameJp && dbNormTitle(S.nameJp)===dbNormTitle(hit2.nameJp)) ||
           (S.aliases||[]).some(function(a){ return dbNormTitle(a)===dbNormTitle(hit2.title); })){
          t=S; break;
        }
      }
    }
  }
  return t;
}
/* 豆瓣给的时间只填空缺：手改过的（From=me）永不覆盖，豆瓣给的可以被下一次豆瓣更新。 */
function dbStamp(s,field,ms){
  if(!s||!ms) return false;
  if(s[field]&&s[field+'From']==='me') return false;
  if(s[field]===ms) return false;
  s[field]=ms; s[field+'From']='db'; return true;
}
/* 豆瓣列表每条只给一个「标记日期」：看过=完成时间，在看=开始时间，想看都不落。
   「看过」的开始时间留空，不编。 */
function dbStampTimes(s,status,markedAt){
  var ms=parseDay(markedAt); if(!ms||!s) return false;
  /* v2.44.6d：标记日期本身也记一份，**跟状态无关**——想看那天没有开始/完成可记，
     但「哪天标的」是排序要用的账。豆瓣是这本账的记账方，每轮拉取以它为准。 */
  var ch=false;
  if(s.dbMark!==ms){ s.dbMark=ms; s.dbMarkFrom='db'; ch=true; }
  if(status==='collect'){ if(dbStamp(s,'tDone',ms)) ch=true; return ch; }
  if(status==='do'){ if(dbStamp(s,'tStart',ms)) ch=true; return ch; }
  return ch;
}
/* v2.44.6d：片单的排序轴＝「标记时间」，不是「最近被动过」。
   updAt 会被改名/补封面这类后台动作顶起来，用它排，列表跟豆瓣那页对不上。 */
function dbMarkOf(s){
  s=s||{};
  var t=Number(s.dbMark)||0; if(t) return t;
  /* 老数据没这格（v2.44.6 之前导入的）：从已有的豆瓣来源时间戳里认 */
  var m=0;
  if(s.tStartFrom==='db') m=Math.max(m,Number(s.tStart)||0);
  if(s.tDoneFrom==='db') m=Math.max(m,Number(s.tDone)||0);
  if(m) return m;
  return Number(s.addedAt)||0;
}
/* 同一天标了好几部：豆瓣自己那一列的先后是唯一线索，拉取时按下标存下来 */
function dbMarkSeqOf(s){ var q=Number((s||{}).dbMarkSeq); return isFinite(q)&&q>=0?q:-1; }
function markCmp(a,b){
  var ta=dbMarkOf(a),tb=dbMarkOf(b);
  if(tb!==ta) return tb-ta;
  var sa=dbMarkSeqOf(a),sb=dbMarkSeqOf(b);
  if(sa!==sb) return (sa<0?1e9:sa)-(sb<0?1e9:sb);
  return (b.updAt||0)-(a.updAt||0);
}

/* v2.44.7（用户令「合并第 1 和第 4 项，实现自动对齐标记」）：这张快照终于有了读它的人。
   以前每次拉取都 dbSnapSave 一份、还随账号云同步传到手机（手机上打不到 :3000 网关，

   现在开机先按快照把「标记哪天 + 同日第几条」这两格补齐，再渲染第一屏。
   刻意只补排序要用的账：状态/题名/集表一律不自动动——那是会看得见的数据，得他点导入才算他同意。

      subjectId:String(d.subjectId||'') };
    /* 快照存的就是「最近标记在前」那一列原序：同一条目重名时以先出现的那条为准 */
    if(/\d+$/.test(rec.subjectId) && !byId[rec.subjectId]) byId[rec.subjectId]=rec;
    var keys=dbKeysOf(d);

function dbMarkSync(){

  (shows||[]).forEach(function(s){

    if(!rec){
      var cands=[s.title,s.nameJp].concat(s.aliases||[]);
      for(var i=0;i<cands.length&&!rec;i++){ var k=dbNormTitle(cands[i]); if(k&&ix.byKey[k]) rec=ix.byKey[k]; }
    }

    var ch=false;
    if(Number(s.dbMark)!==ms){ s.dbMark=ms; s.dbMarkFrom='db'; ch=true; }
    if(Number(s.dbMarkSeq)!==rec.seq){ s.dbMarkSeq=rec.seq; ch=true; }
    if(ch) set++;

function dbApplyOne(d){

      year:d.year||'', total:0, eps:[], statuses:{}, status:stt, rating:d.rating||0,
      genres:d.genres||[], isAnime:!!d.isAnime, dbId:real?String(d.subjectId):'',
      ep:d.ep||0, source:d.source||('豆瓣'+(d.isAnime?'·动画':'·真人')),
      addedAt:Date.now(), updAt:Date.now(), dbMarkSeq:(typeof d.seq==='number'?d.seq:-1) };

  var _want=dbShowTitle(d);

  if(!cur.year&&d.year){ cur.year=d.year; ch=true; }
  if(!cur.rating&&d.rating){ cur.rating=d.rating; ch=true; }
  if(dbStampTimes(cur,d.status,d.markedAt)) ch=true;
  if(typeof d.seq==='number'&&Number(cur.dbMarkSeq)!==Number(d.seq)){ cur.dbMarkSeq=d.seq; ch=true; }

  var ck=document.getElementById('dbnCookie'), v=ck?String(ck.value||'').trim():'';
  if(!v){ dbnNote('还没粘贴 Cookie','bad'); if(ck) ck.focus(); return; }
  dbnNote('正在验证 Cookie…');
  var c;
  try{ c=await fetch(GW+'/hub/api/db/cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie:v})}).then(function(r){ return r.json(); }); }
  catch(e){ dbnNote('连接异常：'+((e&&e.message)||e),'bad'); return; }
  if(!c||!c.ok){
    dbnNote('连接失败：'+((c&&c.msg)||'未知错误'),'bad');
    /* uid 认出来了但收藏页打不开 = Cookie 过期，这个组合值得单独说，否则用户不知道该重粘 */
    if(c&&c.uidSaved) dbnNote('uid 认出来了（'+c.uid+'），但豆瓣打不开它的收藏页 —— Cookie 过期了，重粘一次','bad');
    return;
  }
  if(ck) dbnLastCookie=v; dbnLastUid=(c&&c.uid)||'';   /* 留一份在内存给「存到云端」用；页面一关即消失 */
  if(ck) ck.value='';
  /* 没认出 uid 才亮出兜底输入框；正常路径（Cookie 自带 dbcl2）一次就通，不该让用户看见多一步 */
  if(c.uidUnknown||!c.uid){
    var ui=document.getElementById('dbnUid'), ub=document.getElementById('dbnUidGo');
    if(ui) ui.style.display=''; if(ub) ub.style.display='';
    dbnNote('这份 Cookie 里没认出 uid —— 多半是少复制了 dbcl2 那段。可以重粘一次，或在下面手填','bad');
    return;
  }
  /* 粘一次就够：Cookie 里的 dbcl2 自带 uid，网关直接认出来并顺手验了收藏页 */
  dbnNote('豆瓣已连接（uid '+(c.uid||'')+'）'+(c.n?('，收藏页读到 '+c.n+' 条'):''),'ok');
  /* 连上之后顺手问一句要不要存云端 —— 这样手机/平板换设备时不用再粘一遍 */
  dbnOfferCred(c.uid);
  var sc=document.querySelector('#dbnScope .dbn-q.on');
  await dbnPull(sc?sc.getAttribute('data-sc'):'tv');
}
/* ===== 豆瓣凭据跨设备（v2.32.0）=====
   Cookie 存本机网关只够这一台设备用；手机上的 127.0.0.1 是手机自己，够不到 PC。
   所以连上之后可以把 Cookie 加密存进你自己的 CloudBase 账号，换设备登录后自动取回。
   加密密钥由账号密码派生（PBKDF2 → AES-GCM），所以只有本人能解。 */
function dbnCredRow(){
  var el=document.getElementById('dbnCredRow');
  if(!el) return;
  var C=window.AT_CRED;
  if(!C){ el.innerHTML=''; return; }   /* 云同步脚本没就位（离线打开）→ 什么都不显示，不报错 */
  C.exists().then(function(r){
    if(!r) return;                                  /* 没登录追迹账号，不显示这一行 */
    el.innerHTML = r.has
      ? '<span class="dbn-note">云端已存一份凭据（'+String(r.at||'').slice(0,10)+'）</span>'+
        '<button type="button" class="dbn-q" id="dbnTake">从云端取回</button>'+
        '<button type="button" class="dbn-q" id="dbnForget">删掉云端那份</button>'
      : '<span class="dbn-note">要在这台以外也能用豆瓣？把凭据加密存到你的追迹账号，换设备登录后自动取回</span>'+
        '<button type="button" class="dbn-q" id="dbnPut">存到云端</button>';
    var P=function(id,fn){ var b=document.getElementById(id); if(b) b.onclick=fn; };
    P('dbnPut',function(){ dbnPutCred(); });
    P('dbnTake',function(){ dbnTakeCred(); });
    P('dbnForget',function(){
      C.clear().then(function(){ dbnNote('云端那份已删','ok'); dbnCredRow(); });
    });
  });
}
function dbnAskPassword(why){
  var v=prompt(why+'\n\n（密码只在这一刻用来派生加密密钥，不会被存下来）');
  return v?String(v):'';
}
function dbnPutCred(){
  var C=window.AT_CRED;
  if(!C){ dbnNote('云同步模块没加载 —— 检查网络或换个入口打开','bad'); return; }
  if(!dbnLastCookie){ dbnNote('这次没拿到 Cookie —— 先在上面粘一次','bad'); return; }
  var pw=dbnAskPassword('存到云端需要你的追迹账号密码，用来加密 Cookie');
  if(!pw) return;
  C.stashDouban(dbnLastCookie, dbnLastUid, pw).then(function(){
    dbnNote('已加密存到云端 —— 以后在这台以外登录同一账号，点「从云端取回」就行','ok');
    dbnCredRow();
  }).catch(function(e){ dbnNote('存云端失败：'+((e&&e.message)||e),'bad'); });
}
function dbnTakeCred(){
  var C=window.AT_CRED;
  if(!C){ dbnNote('云同步模块没加载 —— 检查网络或换个入口打开','bad'); return; }
  var pw=dbnAskPassword('从云端取回需要同一密码来解密');
  if(!pw) return;
  dbnNote('正在解密…');
  C.takeDouban(pw).then(async function(o){
    if(!o||!o.cookie){ dbnNote('云端没有可用的凭据','bad'); return; }
    var r=await fetch(GW+'/hub/api/db/cookie',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cookie:o.cookie,uid:o.uid||''})}).then(function(x){ return x.json(); });
    if(!r||!r.ok){ dbnNote('取回了但连不上豆瓣：'+((r&&r.msg)||'未知错误'),'bad'); return; }
    dbnNote('已从云端恢复（uid '+(r.uid||'')+'），正在拉取…','ok');
    var sc=document.querySelector('#dbnScope .dbn-q.on');
    await dbnPull(sc?sc.getAttribute('data-sc'):'tv');
  }).catch(function(e){ dbnNote('取回失败：'+((e&&e.message)||e),'bad'); });
}
/* 面板每次打开都探一次云端那份在不在 */
function dbnOfferCred(){
  dbnCredRow();
}
/* 手填 uid：填完当场验一次收藏页通不通，填错当场说 */
async function dbnSaveUid(){

  dbnNote('正在核对 uid…');
  var r;
  try{ r=await fetch(GW+'/hub/api/db/uid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:v})}).then(function(x){ return x.json(); }); }
  catch(e){ dbnNote('连接异常：'+((e&&e.message)||e),'bad'); return; }
  if(!r||!r.ok){ dbnNote('uid 填不了：'+((r&&r.msg)||'未知错误'),'bad'); return; }
  if(el) el.value='';
  /* 兜底用完就收起来，别让它一直杵在面板上提醒你「还得填 uid」 */

  var sc=document.querySelector('#dbnScope .dbn-q.on');
  await dbnPull(sc?sc.getAttribute('data-sc'):'tv');
}

/* 离线导入：豆瓣导出文件（JSON 数组，或 CSV 标题,年份,状态,评分[,标记日期]）。
   解析出的条目进同一套勾选清单，不直接入库。 */
function importDoubanFile(box,f){
  f=f||(box&&box.files&&box.files[0]); if(!f) return;
  var rd2=new FileReader();
  rd2.onload=function(){
    var rows=[];
    try{
      var text=String(rd2.result||''), trimmed=text.trim();
      if(trimmed.charAt(0)==='['||trimmed.charAt(0)==='{'){
        var arr=JSON.parse(trimmed); if(!Array.isArray(arr)) arr=[arr];
        arr.forEach(function(d,i){
          if(!d) return;
          var t=String(d.title||d.name||d['书名']||d['名称']||d['视频名']||'').trim(); if(!t) return;
          rows.push({ title:t, origTitle:String(d.origTitle||d['原名']||'').trim(),
            year:String(d.year||d['年份']||'').slice(0,4),
            status:String(d.status||d['状态']||''), rating:parseFloat(d.rating||d['评分']||0)||0,
            markedAt:String(d.markedAt||d['标记时间']||d['时间']||d.date||'').slice(0,10),
            subjectId:'f'+i });
        });
      } else {
        var lines=trimmed.split(/\r?\n/);
        for(var i=0;i<lines.length;i++){
          var ln=String(lines[i]||'').trim(); if(!ln) continue;
          var c=ln.split(',');
          rows.push({ title:(c[0]||'').trim(), year:(c[1]||'').trim().slice(0,4), status:(c[2]||'').trim(),
            rating:parseFloat(c[3])||0, markedAt:String(c[4]||'').trim().slice(0,10), subjectId:'f'+i });
        }
      }
    }catch(e){ dbnNote('解析失败：'+((e&&e.message)||e),'bad'); return; }
    if(!rows.length){ dbnNote('文件里没解析出条目','bad'); return; }
    var back={};
    ['do','collect','wish'].forEach(function(k){ back[DB_ST_NAME[k]]=k; });
    dbnItems=rows.map(function(d,i){
      var k=DB_ST[d.status]?d.status:(back[d.status]||'do');
      return { subjectId:d.subjectId, title:dbShowTitle(d), cnTitle:String(d.title||'').trim(),
        origTitle:String(d.origTitle||'').trim(), year:d.year, genres:[], isAnime:false,
        rating:d.rating, markedAt:d.markedAt, pic:'', status:k, ep:0, seq:i, pick:0, source:'豆瓣·文件' };
    });
    dbnFrom='从文件「'+f.name+'」解析到 '+dbnItems.length+' 条 · 勾选才入库';
    dbnRender();
    dbnNote('文件读好了 —— 勾选要入库的条目','ok');
  };
  rd2.readAsText(f,'utf-8');
}
