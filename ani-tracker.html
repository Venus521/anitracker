<style>
/* ============ 追迹 v2 · preset 11 Build 奢侈极简 ============ */
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#17150f; --muted:#6f695c; --line:#e8e3d9;
  --accent:#b08d4f; --accent-soft:#f2e9d8; --danger:#a8552f;
  --ok:#5c7f4a; --info:#2d6a9f; --warn:#9a6420;
  --serif:Georgia,'Source Han Serif SC','Noto Serif SC',serif;
  --sans:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans)}
.wrap{max-width:560px;margin:0 auto;padding:0 22px 60px;min-height:100vh}
button{font-family:var(--sans);cursor:pointer}
button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.top{padding:34px 0 8px;display:flex;align-items:flex-end;justify-content:space-between}
.brand{font-family:var(--serif);font-size:30px;font-weight:300;letter-spacing:6px;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:6px;font-weight:400}
.topbtn{background:none;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.topbtn:active{background:var(--accent-soft)}
.filter{display:flex;gap:20px;padding:22px 0 6px;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.fbtn{background:none;border:none;font-size:14px;color:var(--muted);font-weight:400;padding:4px 0 10px;position:relative;white-space:nowrap;min-height:44px}
.fbtn.on{color:var(--ink);font-weight:600}
.fbtn.on:after{content:'';position:absolute;left:0;right:0;bottom:4px;height:2px;background:var(--accent)}
.show{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.show img{width:64px;height:88px;object-fit:cover;border-radius:6px;background:var(--accent-soft);flex:none}
.show .info{flex:1;min-width:0;cursor:pointer}
.show .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show .s{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.show .prog{margin-top:6px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.show .prog i{display:block;height:100%;background:var(--accent)}
.show .num{font-family:var(--serif);font-size:20px;font-weight:400;margin-top:6px}
.show .num b{font-weight:600;font-size:15px}
.p1{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);background:none;color:var(--accent);font-size:20px;line-height:1}
.p1:active{background:var(--accent);color:#fff}
.empty{text-align:center;padding:80px 0 40px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:44px;font-weight:200;color:var(--line);line-height:1}
.empty p{font-size:13px;margin:12px 0 20px}
.hero{display:flex;gap:18px;padding:26px 0 18px}
.hero img{width:110px;height:152px;object-fit:cover;border-radius:8px;background:var(--accent-soft)}
.hero h2{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 4px;line-height:1.35}
.hero .jp{font-size:11px;color:var(--muted);letter-spacing:1px}
.hero .meta{font-size:12px;color:var(--muted);margin-top:8px}
.strow{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 14px}
.st{background:none;border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:12px;color:var(--muted);min-height:36px}
.st.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.partrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.partrow::-webkit-scrollbar{height:6px}
.partrow::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.partrow::-webkit-scrollbar-track{background:transparent}
.part{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;min-width:96px;max-width:150px;text-align:left;cursor:pointer}
.part .pn{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px}
.part .pt{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.part .py{font-size:10px;color:var(--muted);margin-top:2px}
.part.on{border-color:var(--accent);background:var(--accent-soft)}
.parthead{display:flex;justify-content:space-between;align-items:center;margin:0 0 2px}
.parthead span{font-size:11px;letter-spacing:2px;color:var(--muted)}
.scrlbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font-size:15px;line-height:1;flex:none}
.scrlbtn:hover{border-color:var(--accent);color:var(--accent)}
.scrlbtn:disabled{opacity:.35;cursor:default}
.fcnt{display:inline-block;background:repeating-linear-gradient(45deg,transparent 0 4px,#f4e7c5 4px 8px);color:#7a5a2a;font-size:10px;padding:2px 6px;border-radius:8px;margin-left:4px;border:1px solid #d8b878;vertical-align:middle}
.type-tag{display:inline-block;font-size:10px;padding:2px 5px;border-radius:10px;margin-left:4px;vertical-align:middle;font-weight:600}
.type-tag.tv-original{background:#fce8e8;color:var(--danger);border:1px solid #f0c4b4}
.type-tag.manga-adapt{background:#e8f0ff;color:#2d6a9f;border:1px solid #b4d4f0}
.type-tag.semi-original{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.type-tag.unknown{background:#f0f0f0;color:#888;border:1px solid #d0d0d0}
.statgrid{display:flex;gap:8px;margin:4px 0 14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 0;text-align:center}
.stat b{font-family:var(--serif);font-size:18px;display:block}
.stat span{font-size:10px;color:var(--muted);letter-spacing:1px}
.quickrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0 14px}
.quickrow input{width:64px;border:none;border-bottom:1px solid var(--line);background:none;font-family:var(--serif);font-size:20px;text-align:center;color:var(--accent);padding:2px 0}
.quickrow span{font-size:12px;color:var(--muted)}
.quickrow button{margin-left:auto;background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:500}
.searchrow2{display:flex;gap:0;border-bottom:1px solid var(--line);margin:6px 0 12px}
.searchrow2 input{flex:1;border:none;background:none;font-size:14px;padding:9px 2px;color:var(--ink);outline:none}
.typerow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.ty{background:none;border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:11px;color:var(--muted);min-height:30px}
.ty.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#showTypeRow:empty{display:none}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;padding:6px 0 10px}
.ep{min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;padding:4px 2px}
.ep small{font-size:8px;letter-spacing:.5px;opacity:.65;font-weight:400}
.ep.w{background:var(--accent);border-color:var(--accent);color:#fff}
.eprow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--card);min-height:42px;width:100%;text-align:left}
.eprow .no{font-family:var(--serif);font-size:15px;min-width:36px;text-align:right;color:var(--muted);flex:none}
.eprow .nm{flex:1;font-size:13px;min-width:0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eprow .ty{flex:none;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:1px 8px}
.eprow.w{background:var(--accent-soft);border-color:var(--accent)}
.eprow.w .no{color:var(--accent);font-weight:600}
.eprow.r{opacity:.78}
.eprow .no .rw{font-size:10px}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 0 6px}
.pg{min-width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;color:var(--muted);padding:0 6px}
.pg.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.pgdots{align-self:center;color:var(--muted);font-size:13px;padding:0 2px}
.histrow{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 2px;align-items:center}
.histchip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-size:12px;color:var(--muted);min-height:28px}
.histchip:active{border-color:var(--accent);color:var(--accent)}
.ep.r{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ep:active{transform:scale(.94)}
.grp{font-size:11px;letter-spacing:2px;color:var(--muted);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.back{background:none;border:none;font-size:13px;color:var(--muted);padding:14px 0 0;display:flex;align-items:center;gap:6px;min-height:44px}
.mask{position:fixed;inset:0;background:rgba(23,21,15,.4);z-index:99;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:24px 22px 40px;max-height:88vh;overflow-y:auto}
.panel h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 16px}
.panel input{width:100%;border:none;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font-size:14px;color:var(--ink);outline:none;margin-bottom:2px}
.panel label{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);margin:14px 0 2px}
.panel select{width:100%;border:none;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font-size:14px;color:var(--ink);outline:none;margin-bottom:2px}
.panel .row2{display:flex;gap:8px;margin-top:18px}
.panel .row2 button{flex:1;border-radius:10px;padding:13px;font-size:14px}
.b1{background:var(--ink);color:var(--bg);border:none;font-weight:500}
.b2{background:none;border:1px solid var(--line);color:var(--muted)}
.b3{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent)}
.msg{font-size:12px;color:var(--muted);margin:10px 0;min-height:18px}
.divi{border-top:1px solid var(--line);margin:18px 0 6px}
.mini{font-size:12px;color:var(--muted);line-height:1.7}
.tiny{font-size:11px;color:var(--muted)}
/* ===== v2.10.1：AI 结果导入面板（重做） =====
   目标：粘贴即识别，结果一眼看懂。分类色板沿用全app 的暖色调，
   三类各给一个可辨认的色：TV原创=赤陶 / 半原创=赭黄 / 漫改=松绿。 */
.aiwrap{--ai-filler:#b4573c;--ai-mixed:#a8842f;--ai-canon:#5f8a5a}
html[data-theme=dark] .aiwrap{--ai-filler:#d98a70;--ai-mixed:#d4b269;--ai-canon:#93bb8c}
.aibox{width:100%;box-sizing:border-box;min-height:104px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:14px/1.65 var(--sans);padding:12px 13px;outline:none;transition:border-color .15s}
.aibox:focus{border-color:var(--muted);box-shadow:none}
.aibox::placeholder{color:var(--muted);opacity:.75}
.aihint{margin:0 0 10px;font-size:12px;line-height:1.7;color:var(--muted)}
.aiflow{margin-top:12px}
.aiflow .aihd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.aiflow .aitot{font-size:12px;color:var(--muted)}
.aiflow .aitot b{color:var(--ink)}
.aicat{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;margin-bottom:6px;border:1px solid var(--line);background:var(--card)}
.aicat .dot{width:8px;height:8px;border-radius:50%;flex:none}
.aicat .lbl{font-size:12px;font-weight:700;flex:none;width:52px}
.aicat .range{font-size:13px;line-height:1.6;color:var(--ink);word-break:break-word;font-variant-numeric:tabular-nums;flex:1;min-width:0}
.aicat .cnt{font-size:11px;color:var(--muted);flex:none;text-align:right}
.aicat.f{border-color:color-mix(in srgb,var(--ai-filler) 38%,var(--line));background:color-mix(in srgb,var(--ai-filler) 7%,var(--card))}
.aicat.f .dot{background:var(--ai-filler)} .aicat.f .lbl{color:var(--ai-filler)}
.aicat.m{border-color:color-mix(in srgb,var(--ai-mixed) 38%,var(--line));background:color-mix(in srgb,var(--ai-mixed) 7%,var(--card))}
.aicat.m .dot{background:var(--ai-mixed)} .aicat.m .lbl{color:var(--ai-mixed)}
.aicat.c{border-color:color-mix(in srgb,var(--ai-canon) 38%,var(--line));background:color-mix(in srgb,var(--ai-canon) 7%,var(--card))}
.aicat.c .dot{background:var(--ai-canon)} .aicat.c .lbl{color:var(--ai-canon)}
.aibar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:10px 0 3px;background:var(--line)}
.aibar i{display:block;height:100%}
.ailegend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-bottom:2px}
.ailegend span{display:flex;align-items:center;gap:5px}
.ailegend i{width:7px;height:7px;border-radius:50%;display:block}
.aiexc{margin-top:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:9px 11px}
.aiexc summary{cursor:pointer;list-style:none;font-size:12px;color:var(--muted)}
.aiexc summary::-webkit-details-marker{display:none}
.aiexc summary::before{content:'▸ ';color:var(--muted)}
.aiexc[open] summary::before{content:'▾ '}
.aiexc .ln{font-size:11.5px;color:var(--muted);line-height:1.75;margin-top:6px;word-break:break-word}
.aiok{border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:420px){.aicat .lbl{min-width:44px}.aicat .range{font-size:12.5px}}
.searchrow{display:flex;gap:0;padding:20px 0 8px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.searchrow input{flex:1;border:none;background:none;font-size:16px;padding:12px 2px;color:var(--ink);outline:none}
.searchrow button{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;padding:0 4px}
.sr{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.sr img{width:50px;height:70px;object-fit:cover;border-radius:5px;background:var(--accent-soft);flex:none}
.sr .i{flex:1;min-width:0}
.sr .t{font-weight:600;font-size:14px}
.sr .m{font-size:11px;color:var(--muted)}
.sr button{flex:none;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:9px 16px;font-size:12px;min-height:44px}
.sr button:disabled{opacity:.4}
.minit{font-size:12px;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.minit a{color:var(--accent);text-decoration:none;font-size:12px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:10px 22px;border-radius:22px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1}
/* v2.10.1：面板打开时把 toast 抬到底部按钮之上，避免遮住「写入」等主操作 */
body.panel-open #toast{bottom:96px}
@supports(padding:max(0px)){.wrap{padding-bottom:max(60px,env(safe-area-inset-bottom))}}

/* ===== 顶部入口按钮 / 来源筛选 / 标注 ===== */
.topbtn.wide{width:auto;border-radius:22px;padding:0 14px;gap:6px;font-size:13px;color:var(--ink);border-color:var(--ink);display:inline-flex;height:40px}
.topbtn.wide .ic{font-size:14px}
.srcbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 0 10px}
.srcchip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:11px;color:var(--muted);min-height:30px}
.srcchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.srcchip.tool{border-style:dashed}
.srchint{font-size:10px;color:var(--muted);letter-spacing:.5px}
.eprow .ty{cursor:pointer}
.eprow .ty.ty-filler{color:var(--danger);border-color:#e8c8b0}
.eprow .ty.ty-semi{color:#c07b2d;border-color:#ecd5ae}
.eprow .ty.ty-canon{color:#2d6a9f;border-color:#c3d8ee}
.eprow .ty.ty-unknown{color:var(--muted);border-style:dashed}
.eprow .ty.ty-movie{color:#6a5acd;border-color:#cfc8ef}
.srccov{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 12px;background:var(--card);line-height:1.9}
.srccov b{color:var(--ink);font-weight:600}
.srccov .lnk{color:var(--accent);cursor:pointer;margin-left:auto;white-space:nowrap;font-weight:600}
.sycard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--card)}
/* 面板视觉：顶部一句话状态条 + 卡片 + 折叠档（v2.10.0 沿用，服务于「账号」面板） */
.systatus{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 4px;background:var(--card)}
.systatus .dot{font-size:13px;line-height:1}
.systatus .txt{font-size:12px;color:var(--ink);font-weight:600;flex:1;min-width:0}
.systatus .sybtn{margin-left:auto}
details.syfold{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:0 0 10px;background:var(--card)}
details.syfold>summary{cursor:pointer;list-style:none;padding:12px 0;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.syfold>summary::-webkit-details-marker{display:none}
details.syfold>summary::before{content:'▸';color:var(--muted);font-size:11px;transition:transform .15s}
details.syfold[open]>summary::before{transform:rotate(90deg)}
details.syfold>summary .st{font-size:10px;font-weight:400;color:var(--muted)}
details.syfold>summary+p,details.syfold>div:last-child{padding-bottom:12px}
.sycard h4{margin:0;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sycard h4 .st{font-size:10px;font-weight:400;color:var(--muted)}
.sycard .bd{margin-top:8px}
.syrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sybtn{border:1px solid var(--line);background:none;border-radius:9px;padding:10px 14px;font-size:12px;color:var(--muted);min-height:38px}

function rd(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } }
var _quotaWarned=0;
function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){
  if(e&&(e.name==='QuotaExceededError'||e.code===22)&&Date.now()-_quotaWarned>300000){
    _quotaWarned=Date.now();

function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2200); }
/* v2.13.0 错误留痕：数据类应用最怕「吞错不上报」。环形日志 at_errlog（最近100条）+ 控制台，
   账号面板「同步日志」下方可查看；同步/保存链路的空 catch 全部接进来。 */
function atErr(where,e){
  try{ var L=rd('at_errlog',[]); if(!Array.isArray(L)) L=[];
    L.push({t:Date.now(),w:String(where||''),m:String((e&&(e.message||e))||'').slice(0,300)});
    if(L.length>100) L=L.slice(-100);
    localStorage.setItem('at_errlog',JSON.stringify(L));
  }catch(x){}
  try{ console.warn('[追迹·错误] '+(where||''), e); }catch(x){}
}

/* ===== v2.8.0 网络层重做（2026-09-24）=====
   背景实测：api.bgm.tv 在国内直连不通（10 秒超时）；原「公共 CORS 代理兜底」
   （proxy.cors.sh / api.codetabs.com）也早已失效。结果是每次请求白等 13 秒后
   报一句含糊的「网络不可达」——这正是「同步做不好」的体感来源。

   ⚠️ 关键认知：浏览器的 fetch 无法指定 HTTP 代理（代理由浏览器/系统级决定）。
   所以正确做法是：直连 + 短超时 + 明确告知用户「需要开代理」，而不是让用户填代理地址。

   新策略：
   1) 直连只给 4 秒（不再 8+5=13 秒），失败立刻给可操作的中文诊断；
   2) 移除两个已死的公共代理；
   3) 诊断文案直接告诉用户「去开代理软件」，并给一键重试；
   4) 可选：走一个公共 CORS 中继（若用户自建了反代，可填在设置里）。 */
var NET_RELAY_KEY='at_net_relay';
function netRelayGet(){ try{ return (localStorage.getItem(NET_RELAY_KEY)||'').trim(); }catch(e){ return ''; } }

/* 诊断：把 fetch 异常翻译成「用户能照着做」的中文 */
function netDiag(e,u){
  var isBgm=(u||'').indexOf('bgm.tv')>=0;
  if(e && (e.name==='AbortError'||e.name==='TimeoutError')){
    return isBgm
      ? '连不上 Bangumi（4 秒超时）。Bangumi 在国内需要代理才能访问——请打开你的代理软件（Clash 等）并确认已开启系统代理，然后重试。'
      : '请求超时（4 秒），请检查网络后重试。';
  }
  if(e && e.name==='TypeError'){
    return isBgm
      ? '无法连接 Bangumi。绝大多数情况是「代理没开」——请打开 Clash / 代理软件（并开启系统代理或 TUN 模式），然后重试。'
      : '网络不可达，请检查网络后重试。';
  }
  return (e && e.message) || '未知网络错误';
}
function _bget(u,opt){
  opt=opt||{}; opt.headers=opt.headers||{};
  if(u.indexOf('api.bgm.tv')>=0 && !opt.headers.Authorization){ var _tk=bgmTok(); if(_tk){ opt.headers=Object.assign({},opt.headers,{'Authorization':'Bearer '+_tk}); } }
  var attempt=function(base,ms){
    var c=new AbortController(); var t=setTimeout(function(){ c.abort(); },ms);
    return fetch(base+u,Object.assign({signal:c.signal},opt||{})).then(function(r){ clearTimeout(t);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text().then(function(txt){ if(!txt) return null; try{ return JSON.parse(txt); }catch(e){ return null; } });
    },function(e){ clearTimeout(t); throw e; });
  };
  var relay=netRelayGet();
  var direct=attempt('',4000).catch(function(e1){
    if(e1.name==='TypeError'||e1.name==='AbortError'){
      /* 若配置了自建中继，失败后走它兜底 */
      if(relay){
        return attempt(relay.replace(/\/+$/,'')+'/',4000).catch(function(){
          var ne=new Error(netDiag(e1,u)); ne.name=e1.name; ne.bgmCode='NET'; throw ne;
        });
      }
      var ne=new Error(netDiag(e1,u)); ne.name=e1.name; ne.bgmCode='NET'; throw ne;
    }
    throw e1; /* HTTP 状态错误：不是网络问题，原样抛出 */
  });

}

  if (s) [s.title, s.nameJp, s.titleEn, s.nameEn].forEach(function(x){ if(x) names.push(String(x)); });
  if (s && s.aliases) try{ (Array.isArray(s.aliases)?s.aliases:[]).forEach(function(a){ names.push(String(a)); }); }catch(e){}
  var norm = function(x){ return String(x).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,''); };
  var cands = names.map(norm).filter(function(x){ return x.length >= 3; });
  if (!cands.length) return null;
  var keys = Object.keys(ds);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i], entry = ds[k];
    var t = norm(entry && entry.t || k);
    if (!t || t.length < 3) continue;
    for (var j = 0; j < cands.length; j++) {
      var c = cands[j];
      /* 只做足够长的包含匹配，避免 "naruto" 命中 "boruto" 这类误判 */
      if (t === c) return { slug: k, data: entry };
      if (c.length >= 6 && (t.indexOf(c) >= 0 || c.indexOf(t) >= 0)) return { slug: k, data: entry };
    }
  }
  return null;
}

function fgParseFills(html){
  /* 严格解析: "N. (时长) 标题 *Filler | *Mixed Canon | *Canon" */
  var text = html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#\d+;/g,' ').replace(/\s+/g,' ');
  var re = /(\d{1,4})\.\s*(?:\([\d:]+\))?\s*([^.*]{2,80}?)\s*\*\s*(Filler|Mixed Canon(?:\/Filler)?|Anime Canon|Canon)\b/gi;
  var byCat = { filler: [], mixed: [], canon: [] }, dup = {};
  var m, safety = 0;
  while ((m = re.exec(text)) !== null && safety < 5000) {
    safety++;
    var ep = +m[1]; if (ep < 1 || ep > 2000) continue;
    var cat = m[3].toLowerCase();
    cat = cat.charAt(0) === 'f' ? 'filler' : (cat.indexOf('mixed') >= 0 ? 'mixed' : 'canon');
    if (!dup[ep]) dup[ep] = cat;
  }
  Object.keys(dup).forEach(function (k) { byCat[dup[k]].push(+k); });
  Object.keys(byCat).forEach(function (k) { byCat[k].sort(function (a, b) { return a - b; }); });
  return byCat;
}
function fgFmt(arr){
  if (!arr || !arr.length) return '';
  var out = [], i = 0;
  while (i < arr.length) {
    var j = i;
    while (j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++;
    out.push(i === j ? '' + arr[i] : arr[i] + '-' + arr[j]);
    i = j + 1;
  }
  return out.join(',');
}
function fgSlug(title){
  return String(title||'').toLowerCase().replace(/[’'":]/g,'').replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,'');
}
function fgLookupLocal(s){
  /* 本地灌水库（离线快照）查表，零网络依赖 */
  var ds = window.AFG_FILLER || {};
  var alias = FG_ALIAS[String(s.title || '').toLowerCase()] || null;
  var cands = [];
  if (alias) cands.push(alias);
  cands.push(fgSlug(s.title), fgSlug(s.nameJp));
  for (var i = 0; i < cands.length; i++) {
    if (ds[cands[i]]) return { slug: cands[i], data: ds[cands[i]] };
  }
  /* v2.8.0：别名/英文名松散兜底匹配（大幅提升新数据集的命中率） */
  try { var loose = fgLooseMatch(s); if (loose) return loose; } catch(e) {}
  return null;
}
/* v2.8.0：本地未收录时，联网实时抓取 animefillerlist.com 并缓存到本地。
   这样「以后新番」不用等数据集更新——查一次就自动进本地库。
   注意：浏览器直连该站可能被 CORS 拦；失败时给出明确提示与手动入口。 */
var AFL_BASE = 'https://www.animefillerlist.com';
var FG_LIVE_CACHE_KEY = 'at_fg_live';   /* {slug: {t,f,m,at}}，联网抓到后长期缓存 */

function fgLiveCacheAll(){ try{ return JSON.parse(localStorage.getItem(FG_LIVE_CACHE_KEY)||'{}'); }catch(e){ return {}; } }
function fgLiveCachePut(slug, entry){
  try{ var c=fgLiveCacheAll(); c[slug]=entry; localStorage.setItem(FG_LIVE_CACHE_KEY, JSON.stringify(c)); }catch(e){}
}
/* 用 slug 直接解析 animefillerlist 的剧集表 */
function fgParseAfl(html){
  var m = html.match(/<table[\s\S]*?<\/table>/i);
  if (!m) return null;
  var table = m[0];
  var f = [], mixed = [];
  var rows = table.match(/<tr[\s\S]*?<\/tr>/gi) || [];
  for (var i = 0; i < rows.length; i++) {
    var cells = rows[i].match(/<td[^>]*>([\s\S]*?)<\/td>/gi) || [];
    if (cells.length < 3) continue;
    var clip = function(h){ return h.replace(/<[^>]+>/g,'').replace(/&#0?39;/g,"'").replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').trim(); };
    var epTxt = clip(cells[0]), typ = clip(cells[2]);
    var nums = epTxt.match(/\d+/g); if (!nums) continue;
    var eps = nums.map(Number);
    if (typ === 'Filler') f = f.concat(eps);
    else if (typ === 'Mixed Canon/Filler' || typ === 'Anime Canon') mixed = mixed.concat(eps);
  }
  var uniq = function(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }).sort(function(x,y){ return x-y; }); };
  if (!f.length && !mixed.length) return null;
  return { f: uniq(f), m: uniq(mixed) };
}
/* 抓取一个 slug 的页面（走与 Bangumi 相同的代理策略） */
function fgFetchSlug(slug){
  var url = AFL_BASE + '/shows/' + slug;
  return fetch(url, { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(html){
    var parsed = fgParseAfl(html);
    if (!parsed) throw new Error('该页面没有可解析的剧集分类表');
    return parsed;
  }).catch(function(e){
    var ne = new Error('联网抓取失败（' + (e && e.message || '未知') + '）。可能原因：网络不通 / 该站被墙 / CORS 拦截。可点「打开 AFG 英文站」在浏览器里手动查，或在集上右键「来源标注」手动标。');
    ne.name = e && e.name || 'Error';
    throw ne;
  });
}
async function fgFetchOne(show){
  var hit = fgLookupLocal(show);
  if (hit) {
    return { ok: true, title: show.title,
      url: AFL_BASE + '/shows/' + hit.slug,
      filler: hit.data.f || [], mixed: hit.data.m || [],
      canon: 0, at: Date.now(), src: hit.data.t || hit.slug };
  }
  /* 本地未收录：尝试联网实时抓（先查 live 缓存，再命中别名 slug） */
  var live = fgLiveCacheAll();
  var cand = [ FG_ALIAS[String(show.title||'').toLowerCase()], fgSlug(show.title), fgSlug(show.nameJp) ].filter(Boolean);
  for (var i = 0; i < cand.length; i++) {
    var slug = cand[i];
    if (live[slug] && live[slug].f) {
      return { ok: true, title: show.title, url: AFL_BASE + '/shows/' + slug,
        filler: live[slug].f || [], mixed: live[slug].m || [], canon: 0, at: live[slug].at || Date.now(),
        src: live[slug].t || slug, fromLiveCache: true };
    }
  }
  /* 联网试抓 */
  for (var j = 0; j < Math.min(cand.length, 2); j++) {
    try {
      var data = await fgFetchSlug(cand[j]);
      fgLiveCachePut(cand[j], { t: show.title, f: data.f, m: data.m, at: Date.now() });
      return { ok: true, title: show.title, url: AFL_BASE + '/shows/' + cand[j],
        filler: data.f, mixed: data.m, canon: 0, at: Date.now(), src: show.title + '（联网抓取）', fromLive: true };
    } catch (e) { /* 换下一个候选 */ }
  }
  return { ok: false, title: show.title,
    err: '《' + (show.nameJp || show.title) + '》本地库与联网均未找到分类数据（本地已收录 212 部 + 联网自动补）。可在「来源标注」里手动标注，或点「打开 AFG 英文站」自行查阅。' };
}
async function fgCalibrate(showsList){
  toast('正在校准 Filler Guide 数据…');
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem('at_fg_cache') || '{}'); } catch (e) {}
  var results = [];
  for (var i = 0; i < showsList.length; i++) {
    var s = showsList[i];
    if (cache[s.title] && Date.now() - cache[s.title].at < 7 * 86400e3) { results.push(cache[s.title]); continue; }
    var r = await fgFetchOne(s);
    results.push(r);
    if (r.ok) { cache[s.title] = r; try { localStorage.setItem('at_fg_cache', JSON.stringify(cache)); } catch (e) {} }
  }
  var okN = results.filter(function (r) { return r.ok; }).length;
  toast('校准完成：' + okN + '/' + results.length + ' 番已匹配');
  return results;
}
function fgApplyTo(s, fg){
  if (!fg || !fg.ok) return { added: 0, removed: 0 };
  var fStr = fgFmt(fg.filler), mStr = fgFmt(fg.mixed);
  s.filler = fStr; s.mixed = mStr; s.fgAt = fg.at; s.fgUrl = fg.url;
  s.updAt = Date.now(); statInvalidate(s.sid);
  return { added: fg.filler.length + fg.mixed.length };
}
async function fgOneShow(){
  var s = bySid(curSid); if (!s) return;
  toast('查询中…');
  var r = await fgFetchOne(s);
  if (!r.ok) { toast('匹配失败：' + r.err); return; }
  fgApplyTo(s, r); save(); renderDetail();
  toast('已校准《' + s.title + '》：TV原创 ' + r.filler.length + ' 集、半原创 ' + r.mixed.length + ' 集');
}
async function fgAllShows(){
  var list=shows.slice();
  var rs=await fgCalibrate(list);
  var okN=0, miss=[];
  rs.forEach(function(r){
    var s=shows.find(function(x){ return x.title===r.title; });
    if(!s) return;
    if(r.ok){ fgApplyTo(s,r); okN++; }
    else miss.push(s.title);
  });
  shows.forEach(function(s){ statInvalidate(s.sid); });
  var agg=libraryCov();
  try{ localStorage.setItem('at_src_report',JSON.stringify({at:new Date().toISOString(),matched:okN,total:list.length,miss:miss.slice(0,60),agg:agg})); }catch(e){}
  save(); renderList();
  if(document.getElementById('vDetail').style.display!=='none') renderDetail();
  return {ok:okN,total:list.length};
}
function fgClearCache(){
  try { localStorage.removeItem('at_fg_cache'); toast('已清空 Filler 缓存'); } catch (e) {}
}

/* ===== 节流请求（写 >=1100ms / 读 >=350ms；429/网络错指数退避重试）===== */
var _bgmChain=Promise.resolve(), _bgmLast=0;
function bgmQueue(fn,gap){
  gap=(gap==null?1100:gap);
  var start=_bgmChain.then(function(){ return new Promise(function(res){ var w=Math.max(0,_bgmLast+gap-Date.now()); setTimeout(res,w); }); });
  var exec=start.then(function(){ _bgmLast=Date.now(); return fn(); });
  _bgmChain=exec.then(function(){},function(){});
  return exec;
}
function mkBErr(code,msg){ var e=new Error(msg||code); e.bgmCode=code; return e; }
function bgmErrText(e){
  if(!e) return '未知错误';
  var m=String(e.message||e);
  if(e.bgmCode==='NET'||e.name==='TypeError'||e.name==='AbortError'||m.indexOf('Failed to fetch')>=0) return '网络不可达（检查网络/代理后重试）';
  if(e.bgmCode==='RATE'||m.indexOf('429')>=0) return '触发接口限流（已自动重试，仍失败请稍后再试）';
  if(e.bgmCode==='AUTH'||m.indexOf('401')>=0||m.indexOf('403')>=0) return '凭据失效——请在 Bangumi 设置页重新生成并替换令牌';
  if(m.indexOf('HTTP 404')>=0) return '条目或章节不存在（可能已下架/改版，或本地映射过期）';
  if(m.indexOf('HTTP 400')>=0) return '请求被拒绝（条目未收藏或章节ID无效）';
  return m;
}
function _sleep(ms){ return new Promise(function(res){ setTimeout(res,ms); }); }
function bgmFetch(path,opt,opts){
  opts=opts||{}; var tries=opts.tries||3; var i=0;
  function once(){ return bgmQueue(function(){ return _bget(BAPI+path,opt); }, opts.read?350:1100); }
  function loop(){
    return once().catch(function(e){
      var msg=String(e&&(e.message||e));
      var rate=(msg.indexOf('429')>=0||msg.indexOf('HTTP 5')>=0);
      var net=(e&&(e.name==='TypeError'||e.name==='AbortError'));
      i++;
      /* v2.4.4：仅限流/5xx 自动重试；网络类错误一次即报（黑洞网络 3 次重试≈63s，改后≈20s） */
      if(i>=tries||!rate){ if(rate) throw mkBErr('RATE',msg); if(net) throw mkBErr('NET',msg); throw e; }
      return _sleep(1000*Math.pow(2,i-1)).then(loop);
    });
  }
  return loop();
}

function rebaseEps(s,newTotal){ /* 编辑集数：重建 eps 保留已有标记 */

async function cacheCover(url,useProxy){

async function _searchCoverByTitle(s){

var _coverHealRunning=false;
async function coverHealAll(manual,limit){

  var pool=shows.filter(function(s){ return coverNeedsHeal(s)&&(manual||coverCanAuto(s)); });
  if(limit&&pool.length>limit) pool=pool.slice(0,limit);
  if(!pool.length){ if(manual) toast('没有需要补封面的条目'); return; }
  _coverHealRunning=true;
  var okN=0,failN=0,skipN=0;
  if(manual) toast('开始补封面：共 '+pool.length+' 部…');
  try{
    for(var i=0;i<pool.length;i++){

      var ok=false;
      try{ ok=await healCoverFor(pool[i],{save:false}); }catch(e){ ok=false; }
      coverMark(pool[i].sid,ok);

async function bgmPullEpisodeList(sid){ /* v2.4.1 提取自 bgmAttach：拉取并规整剧集列表（搜索添加/关联补齐共用） */

  var eps=[], off=0;
  while(true){
    var r=await _bget(BAPI+'/episodes?subject_id='+sid+'&limit=100&offset='+off);
    (r.data||[]).forEach(function(e){ eps.push(e); });
    if((r.data||[]).length<100||off>=3000) break;
    off+=100;
  }
  var list=eps.filter(function(e){ return e.type===0||e.type===1; }).map(function(e){
    return {s:(e.sort!==undefined&&e.sort!==''&&+e.sort>0)?+e.sort:0, t:(e.name_cn||e.name||''), ref:null, dur:24, bid:e.id}; /* 来源标注交给判定器/AFG，不默认 canon */

  var normal=list.filter(function(e){ return e.s<=5000; });
  var specials=list.filter(function(e){ return e.s>5000; });

  if(/\bova\b|oad|ova版/i.test(x)) return {kind:'ova',seasonNo:0};
  if(/特别篇|总集篇|番外|外传|\bsp\b/i.test(x)) return {kind:'sp',seasonNo:0};
  var m=x.match(/第\s*([0-9]+)\s*季/); if(m) return {kind:'tv',seasonNo:parseInt(m[1],10)};
  var m2=x.match(/第\s*([一二三四五六七八九十]+)\s*季/); if(m2) return {kind:'tv',seasonNo:cnNum(m2[1])};
  var m3=x.match(/s\s*(\d+)/i); if(m3) return {kind:'tv',seasonNo:parseInt(m3[1],10)};
  var m4=x.match(/第\s*([0-9]+)\s*期/); if(m4) return {kind:'tv',seasonNo:parseInt(m4[1],10)};

function groupSeriesItems(items){

  items.forEach(function(d){

      note('豆瓣已连接（uid '+(st.uid||'')+'），正在拉取标记…', true);
    }
    var u=GW+'/hub/api/db/pull?limit=300'+(scope!=='all'?'&type='+scope:'');
    var j=await fetch(u,{cache:'no-store'}).then(function(r){ return r.json(); });
    if(!j.ok){ note('拉取失败：'+(j.msg||'未知错误'), false); return; }
    var items=j.items||[];
    if(!items.length){ note('没抓到条目——cookie 可能过期了，请重新粘贴一次', false); return; }
    var smap={do:'watching',collect:'done',wish:'want'};
    var added=0,upd=0,dup=0;
    items.forEach(function(d){
      var title=(d.title||'').trim(); if(!title) return;
      var stt=smap[d.status]||'watching';
      var cur=shows.find(function(s){ return String(s.dbId||'')===String(d.subjectId); });
      if(!cur) cur=shows.find(function(s){ return dbNormTitle(s.title)===dbNormTitle(title); });
      if(cur){
        if(!cur.dbId) cur.dbId=d.subjectId;
        if(!cur.cover&&d.pic) cur.cover=d.pic;
        if(!cur.year&&d.year) cur.year=d.year;
        if(cur.status!==stt){ cur.status=stt; cur.updAt=Date.now(); upd++; } else dup++;
        return;
      }
      shows.push({
        sid:'db'+d.subjectId, title:title, nameJp:d.origTitle||'',
        cover:d.pic||'', year:d.year||'', total:0, eps:[], statuses:{},
        status:stt, rating:d.rating||0,
        genres:d.genres||[], isAnime:!!d.isAnime, dbId:d.subjectId,
        ep:d.ep||0,
        source:'豆瓣'+(d.isAnime?'·动画':'·真人'),
        addedAt:Date.now(), updAt:Date.now()
      });
      added++;
    });
    if(added||upd){ save(); renderList(); }
    note('豆瓣同步完成：新增 '+added+' · 状态更新 '+upd+' · 无变化 '+dup+(j.truncated?'（条目多，只取了最近 300 条）':''), true);
  }catch(e){ note('同步异常：'+(e.message||e), false); }
}
/* 自包含：导入豆瓣导出文件（JSON 数组 或 CSV：标题,状态,年份,评分），无需网关/cookie */
function importDoubanFile(box,ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var m=box?box.querySelector('#dbMsg'):null;
  function note(t,ok){ if(m){ m.textContent=t; m.style.color=ok?'var(--ok)':'var(--danger)'; } else toast(t); }
  var rd2=new FileReader();
  rd2.onload=function(){
    try{
      var text=String(rd2.result||''); var rows=[];
      var trimmed=text.trim();
      if(trimmed.charAt(0)==='['||trimmed.charAt(0)==='{'){
        var arr=JSON.parse(trimmed); if(!Array.isArray(arr)) arr=[arr];
        arr.forEach(function(d){ if(d&&(d.title||d.name||d.书名||d.名称)) rows.push({title:String(d.title||d.name||d.书名||d.名称||''), year:String(d.year||d.年份||'').slice(0,4), status:String(d.status||d.状态||''), rating:parseFloat(d.rating||d.评分||0)||0}); });
      } else {
        var lines=text.split(/\r?\n/);
        for(var i=0;i<lines.length;i++){ var ln=lines[i].trim(); if(!ln) continue; var c=ln.split(','); rows.push({title:(c[0]||'').trim(), year:(c[1]||'').trim().slice(0,4), status:(c[2]||'').trim(), rating:parseFloat(c[3])||0}); }
      }
      if(!rows.length){ note('文件里没解析出条目', false); return; }
      var smap={wish:'want',do:'watching',collect:'done',想看:'want',在看:'watching',看过:'done'};
      var added=0,upd=0,dup=0;
      rows.forEach(function(d){
        var title=d.title.trim(); if(!title) return;
        var stt=smap[d.status]||'watching';
        var cur=shows.find(function(s){ return dbNormTitle(s.title)===dbNormTitle(title); });
        if(cur){ if(cur.status!==stt){ cur.status=stt; cur.updAt=Date.now(); upd++; } else dup++; return; }
        shows.push({ sid:'db'+Date.now()+Math.floor(Math.random()*1e4), title:title, nameJp:'', cover:'', year:d.year, total:0, eps:[], statuses:{}, status:stt, rating:d.rating, genres:[], isAnime:false, addedAt:Date.now(), updAt:Date.now(), source:'豆瓣·导入' });
        added++;
      });
      if(added||upd){ save(); renderList(); }
      note('豆瓣文件导入完成：新增 '+added+' · 状态更新 '+upd+' · 无变化 '+dup, true);
    }catch(e){ note('导入失败：'+(e.message||e), false); }
  };
  rd2.readAsText(f,'utf-8');
}

     十二·五、AI 粘贴导入（v2.9.0）

     设计原则：尽量解析 + 明确回报哪几条没懂（不整段拒绝）。
     ===================================================================== */
  var AI_PASTE_KEY = 'at_ai_paste';   /* {slug: {f,m,c,at,t,raw}}AI 结果长期库，优先级最高 */

  function aiPasteAll() { return lsGet(AI_PASTE_KEY, {}); }
  function aiPasteKey(s) {

    return false;

  /* —— 解析引擎 ———————————————————————————————————————————
     能吃下的写法（中英混排、有无"第""集"都行）：
       "1-10集为漫改，11-15为TV原创，16集半原创"
       "第 1、2、3 集是原创；第4集漫改"
       "TV原创：11-15, 23, 45-47"
       "【动画原创】第12集 ／ 12话 原创 ／ 12 (Filler)"
       "ep1-5 manga canon, ep6 filler"
     输出：{filler:[], mixed:[], canon:[], unknownLines:[], total}
     分类口径与项目一致：TV原创→filler，半原创→mixed，漫改→canon

     核心思路：先按「子句」切（逗号/顿号/分号/换行都切），再对每个子句
     分别判分类。关键点：子句只含集号不带分类词时，继承「它前面的分类词」
     —— 这样 "TV原创：11,12,13" 才能正确归到 TV原创 而不是漫改。
     ————————————————————————————————————————————————————— */
  var AI_CAT = {
    filler: ['tv原创', 'tv 原创', '动画原创', '動畫原創', '原创', '原創', 'filler', 'fillers', 'anime original'],
    mixed: ['mixed canon/filler', 'mixed canon', 'anime canon', '混合原创', '半原创', '半原創', '半改', 'mixed'],
    canon: ['manga canon', '漫画改编', '漫改', '原作改编', '原作', '原著', '漫画', 'manga', 'canon']
  };
  /* 关键词探测顺序：长词优先，防止 "mixed canon" 被 "canon" 抢走 */
  var AI_WORDS = [
    ['mixed canon/filler', 'mixed'], ['mixed canon', 'mixed'], ['anime canon', 'mixed'],
    ['动画原创', 'filler'], ['動畫原創', 'filler'], ['tv 原创', 'filler'], ['tv原创', 'filler'],
    ['混合原创', 'mixed'], ['半原创', 'mixed'], ['半原創', 'mixed'], ['半改', 'mixed'],
    ['漫画改编', 'canon'], ['manga canon', 'canon'], ['原作改编', 'canon'],
    ['漫改', 'canon'], ['原作', 'canon'], ['原著', 'canon'], ['漫画', 'canon'], ['canon', 'canon'],
    ['filler', 'filler'], ['anime original', 'filler'], ['原创', 'filler'], ['原創', 'filler'],
    ['manga', 'canon'], ['mixed', 'mixed']
  ];
  /* 在一个子句里找分类词；返回 {cat, at, len} 或 null（at 为命中位置，用于切分） */
  function aiFindCat(seg) {
    var low = String(seg || '').toLowerCase();
    var best = null;
    for (var i = 0; i < AI_WORDS.length; i++) {
      var w = AI_WORDS[i][0], cat = AI_WORDS[i][1];
      var at = low.indexOf(w);
      if (at < 0) continue;
      if (!best || at < best.at || (at === best.at && w.length > best.len)) {
        best = { cat: cat, at: at, len: w.length, word: w };
      }
    }
    return best;
  }
  /* 把一段集号文本解析成数字数组：支持 3 / 3-7 / 第3集 / 3、4、5 / 3,4,5 / 3~7 / 3–7 */
  function aiNumsOf(txt) {
    var out = [], consumed = [];
    var s = String(txt || '');
    /* 归一：全角逗号顿号→半角逗号；各种连接符→ '-' */
    s = s.replace(/[、，,;；／\/]/g, ',').replace(/[～~—－–−_至到]/g, '-').replace(/[（）()【】\[\]《》]/g, ' ');
    var m;
    /* ① 先抓区间（含 "第1至第10集" / "1-10集" / "1到10"） */
    var reRange = /(\d{1,4})\s*(?:集|话|話|集数|ep|episode)?\s*-\s*(?:第)?\s*(\d{1,4})\s*(?:集|话|話|ep|episode)?/gi;
    while ((m = reRange.exec(s)) !== null) {
      var a = +m[1], b = +m[2];
      if (a > b) { var t = a; a = b; b = t; }
      /* 明显不是区间（如 2024-2025 年份对）就跳过：集号超过 3000 不认 */
      if (b > 3000 || a < 1) continue;
      for (var k = a; k <= b; k++) out.push(k);
      consumed.push(m[0]);
    }
    /* ② 剩下文本里的零散单集号（必须先剔除已消化的区间，否则 1-10 会再抓出 1 和 10） */
    var rest = s;
    for (var c = 0; c < consumed.length; c++) rest = rest.replace(consumed[c], ' ');
    var reOne = /\d{1,4}/g;
    while ((m = reOne.exec(rest)) !== null) {
      var n = +m[0];
      if (n >= 1 && n <= 3000) out.push(n);
    }
    var uniq = [];
    out.forEach(function (n) { if (uniq.indexOf(n) < 0) uniq.push(n); });
    uniq.sort(function (x, y) { return x - y; });
    return uniq;
  }
  /* 主解析（v2.9.0 定稿）：按「位置最近」给每个集号打分类标签。
     步骤：① 逐行 → ② 找出该行所有分类词的位置 → ③ 找出该行所有集号/区间的位置
     → ④ 每个集号归属「离它最近的那个分类词」。
     这样同时解决：逗号继承（"TV原创：11,12,13"）、后置词（"1,2,3集是原创"）、
     一句多类（"原创：45-47 半原创：50"）三种情况，不需要特判。 */
  function aiParse(text) {
    var raw = String(text || '').replace(/\r/g, '');
    var filler = [], mixed = [], canon = [], unknownLines = [];
    var anyHit = 0;
    var lines = raw.split(/\n+/);
    lines.forEach(function (lnRaw) {
      var ln = lnRaw.trim();
      if (!ln) return;
      /* 项目自己的【动画原创】前缀先转成普通写法 */
      ln = ln.replace(/【动画原创】/g, '动画原创 ');
      var low = ln.toLowerCase();

      /* ① 找出所有分类词出现位置（长词优先，同位置取长；已被吃掉的区间不重复计） */
      var marks = [];
      AI_WORDS.forEach(function (pair) {
        var w = pair[0], cat = pair[1], from = 0, at;
        while ((at = low.indexOf(w, from)) >= 0) {
          marks.push({ at: at, len: w.length, cat: cat, word: w });
          from = at + w.length;
        }
      });
      /* 去掉被更长词包含的短词（如 "canon" 落在 "manga canon" 里） */
      marks = marks.filter(function (a) {
        for (var i = 0; i < marks.length; i++) {
          var b = marks[i];
          if (b === a) continue;
          if (b.at <= a.at && b.at + b.len >= a.at + a.len && b.len > a.len) return false;
        }
        return true;
      });
      marks.sort(function (x, y) { return x.at - y.at; });

      /* ② 找出所有集号与区间（连同它们在原文里的位置） */
      /* 归一：只在"副本"上找数字，位置与原文一致（替换都等长或仅去标点，需保持长度）
         为稳妥起见：先把各种连接符换成等长的 '-'，全角逗号换成等长 ','，再扫描 */
      var scan = ln.replace(/[～~—－–−]/g, '-').replace(/[、，]/g, ',');
      /* 硬边界：逗号/顿号/分号/句号/箭头 切成"子句"。
         归属规则：集号先看自己所在子句有没有分类词；有就用它。
         没有的话，再往前面的子句找最近的一个分类词（"TV原创：11,12,13" 的 12/13）。
         但若自己所在子句的"更后面"有分类词，且前面子句也没有 → 用后面的
         （"1,2,3集是原创" 里 1、2 所在子句无词、前面也无词 → 借后面子句的"原创"）。 */
      var segs = [], segStarts = [0];
      for (var si = 0; si < scan.length; si++) {
        if (/[,\uFF0C\u3001;\uFF1B\u3002!！?？\/\uFF0F|]/.test(scan.charAt(si))) segStarts.push(si + 1);
      }
      segStarts.push(scan.length);
      var segOf = [];
      for (var sg = 0; sg < segStarts.length - 1; sg++) {
        for (var p = segStarts[sg]; p < segStarts[sg + 1]; p++) segOf[p] = sg;
      }
      var lastSeg = segStarts.length - 2;
      segOf[scan.length] = lastSeg;

      var spans = [];
      var reRange = /(\d{1,4})\s*(?:集|话|話|集数|ep|episode)?\s*-\s*(?:第)?\s*(\d{1,4})\s*(?:集|话|話|ep|episode)?/gi;
      var m;
      while ((m = reRange.exec(scan)) !== null) {
        var a = +m[1], b = +m[2];
        if (a > b) { var t = a; a = b; b = t; }
        if (b > 3000 || a < 1) continue;
        if (b - a > 2000) continue;
        /* 正则尾部 \s* 会多吃空格，导致 sp.end 越界到下一个分类词上，
           使 "45-47 半原创" 的区间误判为半原创。这里把尾随空白去掉。 */
        var mTxt = m[0].replace(/\s+$/, '');
        for (var k = a; k <= b; k++) spans.push({ n: k, at: m.index, end: m.index + mTxt.length, seg: segOf[m.index] });
      }
      /* 剔除已被区间覆盖的数字，再抓零散单集号 */
      var covers = spans.map(function (s) { return { a: s.at, b: s.end }; });
      var reOne = /\d{1,4}/g;
      while ((m = reOne.exec(scan)) !== null) {
        var pos = m.index, inside = false;
        for (var ci = 0; ci < covers.length; ci++) { if (pos >= covers[ci].a && pos < covers[ci].b) { inside = true; break; } }
        if (inside) continue;
        var n2 = +m[0];
        if (n2 >= 1 && n2 <= 3000) spans.push({ n: n2, at: pos, end: pos + m[0].length, seg: segOf[pos] });
      }
      /* 该行连一个集号都没有：若它"看起来像在讲分类"就记为没懂，否则静默忽略。
         marks 已在上方算好，这里直接用。 */
      if (!spans.length) {
        if ((marks.length || /\d/.test(ln)) && unknownLines.indexOf(ln) < 0) unknownLines.push(ln);
        return;
      }

      /* 分类词按子句归档：segMarks[seg] = [mark…] */
      var segMarks = {};
      marks.forEach(function (mk) { var s2 = segOf[mk.at]; (segMarks[s2] = segMarks[s2] || []).push(mk); });
      var maxSeg = lastSeg;

      var lineHit = false;
      spans.forEach(function (sp) {
        if (!marks.length) return;
        var pick = null;
        /* ① 本子句内的分类词：优先取集号「前面最近」的；前面没有才取后面的。
             这样 "原创：45-47 半原创：50"（空格分隔、无逗号）里
             45-47 归前面的"原创"、50 归前面的"半原创"，而不是都归最近的词。 */
        var mine = segMarks[sp.seg];
        if (mine && mine.length) {
          for (var i = 0; i < mine.length; i++) {
            var mk2 = mine[i];
            if (mk2.at <= sp.end) {           /* 在集号之前（含紧邻） */
              if (!pick || mk2.at > pick.at) pick = mk2;
            }
          }
          if (!pick) {                        /* 没前置 → 取后面最近的 */
            for (var j2 = 0; j2 < mine.length; j2++) {
              var mk3 = mine[j2];
              if (!pick || mk3.at < pick.at) pick = mk3;
            }
          }
        }
        /* ② 前面最近的子句里的分类词（继承列表标签） */
        if (!pick) {
          for (var s3 = sp.seg - 1; s3 >= 0; s3--) {
            if (segMarks[s3] && segMarks[s3].length) { pick = segMarks[s3][segMarks[s3].length - 1]; break; }
          }
          /* ③ 前面也没有 → 用后面最近的子句（后置写法） */
          if (!pick) {
            for (var s4 = sp.seg + 1; s4 <= maxSeg; s4++) {
              if (segMarks[s4] && segMarks[s4].length) { pick = segMarks[s4][0]; break; }
            }
          }
        }
        if (!pick) return;
        lineHit = true; anyHit++;
        var bucket = pick.cat === 'filler' ? filler : (pick.cat === 'mixed' ? mixed : canon);
        if (bucket.indexOf(sp.n) < 0) bucket.push(sp.n);
      });
      /* 本行一个集号都没归好，但仍"看起来像在讲分类" → 记为没懂：
         a) 含分类词但找不到任何集号（"TV原创的那几集我记不清了"）
         b) 含数字但完全没分类词（"大概 70 多集吧"）
         纯叙述、既无分类词也无数字的行（"画质很好"）不算"没懂"，静默忽略。 */
      if (!lineHit && (marks.length || /\d/.test(ln)) && unknownLines.indexOf(ln) < 0) unknownLines.push(ln);
    });
    var sortU = function (a) { a.sort(function (x, y) { return x - y; }); return a; };
    /* 互斥：一个集号只归一类，优先级 TV原创 > 半原创 > 漫改（越"想跳过"越优先） */
    var seen = {};
    var f2 = [], m2 = [], c2 = [];
    sortU(filler).forEach(function (n) { if (!seen[n]) { seen[n] = 1; f2.push(n); } });
    sortU(mixed).forEach(function (n) { if (!seen[n]) { seen[n] = 1; m2.push(n); } });
    sortU(canon).forEach(function (n) { if (!seen[n]) { seen[n] = 1; c2.push(n); } });
    /* 没懂的行：去重、限量 */
    var uniqUnk = [];
    unknownLines.forEach(function (u) { u = String(u).trim().slice(0, 60); if (u && uniqUnk.indexOf(u) < 0) uniqUnk.push(u); });
    return { filler: f2, mixed: m2, canon: c2, unknownLines: uniqUnk.slice(0, 12), hitCount: anyHit, raw: raw };
  }
  AT270.aiParse = aiParse;

  /* —— 打开粘贴面板 —— */
  function openAiPaste() {
    var s = bySid(curSid);
    if (!s) { toast('先打开一部番的详情页'); return; }
    if (s.pv) { toast('预览模式：先加入片单再导入'); return; }
    closeM('at270AiMask');
    var prev = AT270.aiPasteFor(s);
    var epsN = (s.eps || []).length;
    /* ===== v2.10.1 重做版 =====
       旧版要「粘贴 → 点预览识别 → 点写入」三步，结果还是三行灰字。
       新版：粘贴即自动识别（防抖 260ms），结果直接渲染成分类色卡，
             主按钮只有「写入」，另有「复制提问」帮你拿到 AI 回答。 */
    var wrap = makeEl('<div id="at270AiMask" class="mask"><div class="panel aiwrap">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
        '<h3 style="margin:0">AI 结果导入</h3>' +
        '<button type="button" id="at270AiX" aria-label="关闭" style="background:none;border:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 4px">×</button>' +
      '</div>' +
      '<p class="aihint">把 AI 对《' + esc(s.title) + '》原创集的回答<b style="color:var(--ink)">整段贴进来</b>，自动认集号，不用整理格式。</p>' +
      '<textarea id="at270AiText" class="aibox" placeholder="例：1-10集漫改，11-15集TV原创，16集半原创" >' + esc(prev && prev.raw || '') + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:10px">' +
        '<button type="button" class="sybtn" id="at270AiHelp" style="flex:1">复制提问给 AI</button>' +
        (prev ? '<button type="button" class="sybtn" id="at270AiClear">清除已存结果</button>' : '') +
      '</div>' +
      '<div id="at270AiPrev" class="aiflow"></div>' +
      '<div class="msg" id="at270AiMsg"></div>' +
      '<div class="row2"><button type="button" class="b2" id="at270AiCancel" style="flex:0 0 34%">取消</button>' +
      '<button type="button" class="b1" id="at270AiApply" disabled style="flex:1;opacity:.45">写入</button></div>' +
      '</div></div>');
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });
    $('at270AiX').addEventListener('click', function () { wrap.remove(); });
    $('at270AiCancel').addEventListener('click', function () { wrap.remove(); });

    var last = null;
    var applyBtn = $('at270AiApply');

    function setApply(on) {
      applyBtn.disabled = !on;
      applyBtn.style.opacity = on ? '' : '.45';
    }

    /* 分类色卡：把集号数组渲染成「TV原创 11-15 (5集)」这样一行一色 */
    function catCard(cls, label, arr) {
      if (!arr || !arr.length) return '';
      return '<div class="aicat ' + cls + '">' +
        '<span class="dot"></span>' +
        '<span class="lbl">' + label + '</span>' +
        '<span class="range">' + esc(fgFmt(arr)) + '</span>' +
        '<span class="cnt">' + arr.length + ' 集</span>' +
        '</div>';
    }

    function showPreview() {
      /* v2.10.1：防抖定时器可能在面板已关闭后才触发（元素已移除）→ 先判断存活。
         否则会抛 "Cannot read properties of null (reading 'value')"。 */
      var ta = $('at270AiText');
      if (!ta || !wrap.parentNode) return;
      var msg = $('at270AiMsg'), box = $('at270AiPrev');
      if (!msg || !box) return;
      var txt = ta.value || '';
      if (!txt.trim()) {
        box.innerHTML = '';
        msg.textContent = '';
        setApply(false); last = null;
        return;
      }
      var r = aiParse(txt);
      last = r;
      var nF = r.filler.length, nM = r.mixed.length, nC = r.canon.length;

      if (!r.hitCount) {
        box.innerHTML = '<div class="aiok" style="color:var(--danger)">没认出任何集号。换个写法试试：「1-10集漫改，11-15集TV原创，16集半原创」</div>';
        msg.textContent = '';
        setApply(false);
        return;
      }
      var inR = function (n) { return n >= 1 && n <= epsN; };
      var F = r.filler.filter(inR), M = r.mixed.filter(inR), C = r.canon.filter(inR);
      var drop = r.filler.concat(r.mixed, r.canon).filter(function (n) { return !inR(n); }).length;
      var tot = F.length + M.length + C.length;

      var h = '<div class="aihd"><span class="aitot">识别到 <b>' + tot + '</b> 集' +
        (epsN ? '（全作 ' + epsN + ' 集）' : '') + '</span></div>';

      /* 比例条：三类各占一段，一眼看出构成 */
      if (tot) {
        h += '<div class="aibar">';
        if (nF) h += '<i style="background:var(--ai-filler);width:' + (nF / tot * 100) + '%"></i>';
        if (nM) h += '<i style="background:var(--ai-mixed);width:' + (nM / tot * 100) + '%"></i>';
        if (nC) h += '<i style="background:var(--ai-canon);width:' + (nC / tot * 100) + '%"></i>';
        h += '</div>';
      }
      h += catCard('f', 'TV原创', F);
      h += catCard('m', '半原创', M);
      h += catCard('c', '漫改', C);

      if (drop) h += '<div class="aiok" style="color:var(--danger)">有 ' + drop + ' 个集号超出本作范围（共 ' + epsN + ' 集），不会写入</div>';

      /* 没认出来的行收进折叠区，不打扰主视线 */
      if (r.unknownLines && r.unknownLines.length) {
        var lines = r.unknownLines.map(function (u) { return '<div class="ln">· ' + esc(u) + '</div>'; }).join('');
        h += '<details class="aiexc"><summary>' + r.unknownLines.length + ' 条没看懂（不影响其余写入）</summary>' + lines + '</details>';
      }
      box.innerHTML = h;
      msg.textContent = '';
      setApply(tot > 0);
    }

    /* 粘贴/输入即自动识别（防抖，避免边打边闪） */
    var _aiT = null;
    function queuePreview() {
      clearTimeout(_aiT);
      _aiT = setTimeout(showPreview, 260);
    }
    $('at270AiText').addEventListener('paste', function () { setTimeout(showPreview, 60); });
    $('at270AiText').addEventListener('input', queuePreview);

    /* 一键复制提问（多数浏览器需要用户手势，这里用点击后 copy + 兜底提示） */
    $('at270AiHelp').addEventListener('click', function () {
      var ask = '请列出动画《' + (s.nameJp || s.title) + '》TV版每一集是「漫画改编」还是「动画原创（TV原创）」，' +
        '有半原创（部分原作+部分原创）也请标出。只输出这种短句，不要解释：1-10集漫改，11-15集TV原创，16集半原创';
      var done = function () { toast('提问已复制，发给 AI 即可'); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ask).then(done, function () { fallback(); });
        } else fallback();
      } catch (e) { fallback(); }
      function fallback() {
        var ta = $('at270AiText');
        ta.value = ask; ta.focus();
        try { ta.select(); document.execCommand('copy'); done(); }
        catch (e2) { toast('已填入输入框，请手动复制'); }
      }
    });

    var bc = $('at270AiClear');
    if (bc) bc.addEventListener('click', function () {
      AT270.aiPasteClear(s); try { statInvalidate(s.sid); } catch (e) {}
      renderDetail(); wrap.remove(); toast('已清除本作的 AI 导入结果');
    });

    applyBtn.addEventListener('click', function () {
      var msg = $('at270AiMsg');
      if (!last || !last.hitCount) { showPreview(); return; }
      var r = last;
      if (!epsN) { msg.textContent = '本作还没有剧集列表，先用「✎ 编辑集数」补上'; msg.style.color = 'var(--danger)'; return; }
      var inR = function (n) { return n >= 1 && n <= epsN; };
      var F = r.filler.filter(inR), M = r.mixed.filter(inR), C = r.canon.filter(inR);
      /* AI 结果优先：写入 at_ai_paste 覆盖层，并落到集级（集级标注优先级最高） */
      aiPastePut(s, { f: F, m: M, c: C, at: Date.now(), t: s.title, raw: r.raw.slice(0, 4000) });
      var cnt = 0, conflicted = [];
      (s.eps || []).forEach(function (e) {
        var k = (F.indexOf(e.s) >= 0) ? 'filler' : (M.indexOf(e.s) >= 0 ? 'semi' : (C.indexOf(e.s) >= 0 ? 'canon' : null));
        if (!k) return;
        /* 人工标注过的集不覆盖（尊重手改）；v2.13.0：冲突集数显式上报，不再静默 */
        if (e.src === 'filler' || e.src === 'semi' || e.src === 'canon') {
          if (e.srcNote === 'AI 导入') { e.src = k; e.srcNote = 'AI 导入'; e.srcAt = Date.now(); cnt++; }
          else if (e.src !== k) conflicted.push(e.s);
          return; /* 真正手改过的不动 */
        }
        e.src = k; e.srcNote = 'AI 导入'; e.srcAt = Date.now();
        cnt++;
      });
      /* 兜底：AI 只给了原创集、没提其余 → 其余按漫改（与 AFG 区间外口径一致） */
      var covered = F.concat(M, C);
      if (F.length || M.length) {
        (s.eps || []).forEach(function (e) {
          if (covered.indexOf(e.s) >= 0) return;
          if (e.src === 'filler' || e.src === 'semi' || e.src === 'canon') return;
          e.src = 'canon'; e.srcNote = 'AI 导入（其余按漫改）'; e.srcAt = Date.now(); cnt++;
        });
      }
      /* 同步刷新剧集级的汇总串（列表角标用它） */
      try { s.filler = fgFmt(F); s.mixed = fgFmt(M); s.aiAt = Date.now(); } catch (e) {}
      s.updAt = Date.now(); try { statInvalidate(s.sid); } catch (e) {}
      try { logEdit(s.sid, 'AI 导入', 'TV原创 ' + F.length + ' · 半原创 ' + M.length + ' · 漫改 ' + C.length + (conflicted.length ? (' · 与既有标注冲突保留 ' + conflicted.length + ' 集') : '') + (r.unknownLines.length ? ('（未识别 ' + r.unknownLines.length + ' 条）') : '')); } catch (e) {}
      save(); renderDetail(); wrap.remove();
      toast('已写入 ' + cnt + ' 集：TV原创 ' + F.length + ' · 半原创 ' + M.length + (conflicted.length ? ('；' + conflicted.length + ' 集与既有标注冲突，已保留原标注') : ''));
    });

    /* 打开即有旧结果 → 直接渲染；否则聚焦等粘贴 */
    if (prev && prev.raw) { setTimeout(showPreview, 40); }
    setTimeout(function () { try { $('at270AiText').focus(); } catch (e) {} }, 80);
  }
  window.aiPasteImport = openAiPaste;
  AT270.aiPaste = openAiPaste;

  /* =====================================================================
     十三、启动：迁移 + 数据版本 + 一次性自动校准
     ===================================================================== */
  function boot() {
    try {
      if (!lsGet('at_v270', false)) {
        lsSet('at_v270', true);
      }
      var snap = lsGet('at_fg_snap', '');
      if (snap !== SNAP) {
        try { localStorage.removeItem('at_fg_cache'); } catch (e) {}
        lsSet('at_fg_snap', SNAP);
        setTimeout(function () {
          try {
            if (window.shows && shows.length) {
              toast('正在用新版来源数据校准（含海贼王等）…');
              Promise.resolve(fgAllShows()).then(function (r) {
                if (r && r.total) toast('来源校准完成：匹配 ' + r.ok + '/' + r.total + ' 部');
              }).catch(function () {});
            }
          } catch (e) {}
        }, 2600);
      }
      setTimeout(function () { try { renderSrcBar(); } catch (e) {} }, 900);
    } catch (e) {}
  }
    /* 空剧集本地方案（v2.7.1）：内置库补齐 / 生成占位 / 兜底引导——不依赖 Bangumi */
  AT270.fillFromLib = function () {
    var s = bySid(curSid); if (!s) return;
    if ((s.eps || []).length) { toast('已有剧集数据，无需补齐'); return; }
    var lib = (window.INTERNAL_SHOWS || []).filter(function (x) { return normTxt(x.title) === normTxt(s.title) || (s.nameJp && x.nameJp && normTxt(x.nameJp) === normTxt(s.nameJp)); })[0];
    if (!lib || !(lib.eps || []).length) { toast('内置库没有《' + (s.title || '') + '》的剧集——可点「生成第1–N集」占位，或「✎ 编辑集数」手动补'); return; }
    s.eps = JSON.parse(JSON.stringify(lib.eps));
    if (!s.total || s.total < s.eps.length) s.total = s.eps.length;
    s.updAt = Date.now(); save(); try { statInvalidate(s.sid); } catch (e) {}
    renderDetail(); toast('已从内置库补齐 ' + s.eps.length + ' 集（含中文集名）');
  };
  AT270.fillPlaceholders = function () {
    var s = bySid(curSid); if (!s) return;
    if ((s.eps || []).length) { toast('已有剧集数据，无需生成'); return; }
    var n = parseInt(s.total, 10) || 0;
    if (!n) { toast('先在「✎ 编辑集数」里填总集数，再生成占位'); return; }
    s.eps = [];
    for (var i = 1; i <= n; i++) s.eps.push({ s: i, t: '第 ' + i + ' 集' });
    s.updAt = Date.now(); save(); try { statInvalidate(s.sid); } catch (e) {}
    renderDetail(); toast('已生成 ' + n + ' 集占位——点集号可逐集补双语集名');
  };
  AT270.fillEps = function (s) {
    if (!s) return;
    if ((s.eps || []).length) { renderDetail(); return; }
    AT270.fillFromLib();
    try { var cur = bySid(curSid) || s; if (!(cur.eps || []).length) AT270.fillPlaceholders(); } catch (e) {}
  };
boot();
  /* v2.9.2：不再有「同步精简」全局开关。此处仅清理旧版遗留的 at_sync_off 标记（已在头部执行）。 */
  /* 草稿清扫（v2.7.0 复核修复）：登录/注册成功后表单消失 → 自动清理对应草稿 */
  setInterval(function () {
    try {
      var D = JSON.parse(localStorage.getItem('at_drafts') || '{}');
      var changed = false;
      var keys = Object.keys(D);
      for (var i = 0; i < keys.length; i++) {
        var mask = document.getElementById(keys[i]);
        if (!mask) continue;
        var ks = Object.keys(D[keys[i]].fields || {});
        var gone = ks.length > 0;
        for (var j = 0; j < ks.length; j++) {
          if (mask.querySelector('[id="' + ks[j] + '"]')) { gone = false; break; }
        }
        if (gone) { delete D[keys[i]]; changed = true; }
      }
      if (changed) localStorage.setItem('at_drafts', JSON.stringify(D));
    } catch (e) {}
  }, 6000);

})();
